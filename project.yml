name: StockScope
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "13.0"
packages: {}
targets:
  StockScope:
    type: application
    platform: iOS
    sources:
      - path: StockScope
    frameworks:
      - framework: CoreMotion.framework
      - framework: CoreLocation.framework
      - framework: CoreBluetooth.framework
      - framework: WebKit.framework
      - framework: Network.framework
    info:
      path: StockScope/Info.plist
      properties:
        NSMotionUsageDescription: "需要访问气压与运动传感器以分析空间垂直位移与电梯状态"
        NSLocationWhenInUseUsageDescription: "需要获取位置精度以判断室内外遮蔽情况"
        NSBluetoothAlwaysUsageDescription: "需要扫描周围低功耗蓝牙外设数量以评估人群密集度"
        NSLocalNetworkUsageDescription: "需要探测当前 Wi-Fi 局域网主机拓扑以识别网络属性"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.stockscope
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_STYLE: "Automatic"
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
