<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JR-DOS v3.0 Enterprise</title>
    <!-- Pyodide Python 3 WebAssembly Runtime -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <style>
        :root {
            --bg-color: #080808;
            --term-green: #00ff66;
            --term-dim: #008f3a;
            --term-err: #ff3344;
            --term-warn: #ffaa00;
            --font-stack: "SF Mono", "Menlo", "Courier New", Courier, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--term-green);
            font-family: var(--font-stack);
            font-size: 13.5px;
            line-height: 1.45;
            padding: 10px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-user-select: text;
        }

        #terminal {
            flex: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            padding-bottom: 8px;
        }

        .output-line { margin-bottom: 2px; }
        .prompt-container { display: flex; align-items: center; margin-top: 4px; }
        .prompt { color: var(--term-green); font-weight: bold; margin-right: 6px; user-select: none; }

        #cli-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--term-green);
            font-family: var(--font-stack);
            font-size: 13.5px;
            caret-color: var(--term-green);
        }

        #hidden-file-picker { display: none; }
    </style>
</head>
<body>
    <div id="terminal"></div>
    <div class="prompt-container">
        <span class="prompt" id="prompt-label">C:\&gt;</span>
        <input type="text" id="cli-input" autofocus autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>

    <!-- Hidden native file picker for openfile / selectfile -->
    <input type="file" id="hidden-file-picker" multiple>

    <script>
        const terminal = document.getElementById('terminal');
        const cliInput = document.getElementById('cli-input');
        const promptLabel = document.getElementById('prompt-label');
        const filePicker = document.getElementById('hidden-file-picker');

        let pyodideInstance = null;
        let commandHistory = [];
        let historyIndex = -1;
        let nativeCallbackResolver = null;

        // --- Output Utility ---
        function print(text, type = "normal") {
            const div = document.createElement('div');
            div.className = 'output-line';
            if (type === "error") div.style.color = "var(--term-err)";
            else if (type === "warn") div.style.color = "var(--term-warn)";
            else if (type === "dim") div.style.color = "var(--term-dim)";
            div.textContent = text;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        // ==========================================
        // 1. Hierarchical Virtual File System (VFS)
        // ==========================================
        class VirtualFileSystem {
            constructor() {
                this.root = { type: 'dir', name: '', children: {}, parent: null };
                this.currentDir = this.root;
                this.currentPath = ['C:'];
            }

            resolvePath(pathStr) {
                if (!pathStr || pathStr === '.') return this.currentDir;
                let parts = pathStr.replace(/\\/g, '/').split('/').filter(p => p.length > 0);
                let startNode = (pathStr.startsWith('/') || pathStr.toUpperCase().startsWith('C:')) ? this.root : this.currentDir;
                if (parts[0] && parts[0].toUpperCase() === 'C:') parts.shift();

                let curr = startNode;
                for (let part of parts) {
                    if (part === '.') continue;
                    if (part === '..') {
                        if (curr.parent) curr = curr.parent;
                    } else {
                        if (!curr.children[part]) return null;
                        curr = curr.children[part];
                    }
                }
                return curr;
            }

            getAbsolutePath() {
                if (this.currentPath.length === 1) return 'C:\\';
                return this.currentPath.join('\\');
            }

            mkdir(name) {
                if (this.currentDir.children[name]) return false;
                this.currentDir.children[name] = { type: 'dir', name: name, children: {}, parent: this.currentDir };
                return true;
            }

            writeFile(name, content) {
                this.currentDir.children[name] = { type: 'file', name: name, content: content, parent: this.currentDir, mtime: new Date() };
            }

            readFile(name) {
                const node = this.resolvePath(name);
                if (node && node.type === 'file') return node.content;
                return null;
            }

            remove(name) {
                const node = this.resolvePath(name);
                if (!node || !node.parent) return false;
                delete node.parent.children[node.name];
                return true;
            }
        }

        const vfs = new VirtualFileSystem();
        vfs.mkdir("System");
        vfs.mkdir("Scripts");
        vfs.writeFile("welcome.txt", "Welcome to JR-DOS Operating System v3.0 Enterprise.");

        // ==========================================
        // 2. JR Proprietary Syntax Lexer & Parser
        // ==========================================
        /*
           JR-Script Grammar Specification:
           - Root Token: Command identifier (case-insensitive)
           - Parameters: Positional tokens, string literals ("..." or '...')
           - Long flags: --flag=value or --flag value or --flag
           - Short flags: -f, -rf, -h
           - Native calls: @module.action:param
           - Environment variables: $VAR expands to runtime environment
           - Pipeline separator: |
           - Redirect operators: >, >>
        */
        const JR_ENV = {
            "OS_NAME": "JR-DOS",
            "VERSION": "3.0.0-PROD",
            "ARCH": "ARM64-WKWebView",
            "USER": "Jack Zhang",
            "PROMPT": "C:\\>"
        };

        function jrTokenize(input) {
            // Expand environment variables first
            input = input.replace(/\$([A-Z_]+)/g, (_, v) => JR_ENV[v] !== undefined ? JR_ENV[v] : "");
            
            const regex = /[^\s"']+|"([^"]*)"|'([^']*)'/g;
            const tokens = [];
            let match;
            while ((match = regex.exec(input)) !== null) {
                tokens.push(match[1] || match[2] || match[0]);
            }
            return tokens;
        }

        function jrParseArgs(tokens) {
            const positional = [];
            const flags = {};
            const nativeDirectives = [];

            for (let i = 0; i < tokens.length; i++) {
                const token = tokens[i];
                if (token.startsWith('@')) {
                    // JR Proprietary Native Bridge Directive (e.g. @sys.query:battery)
                    nativeDirectives.push(token.slice(1));
                } else if (token.startsWith('--')) {
                    const parts = token.slice(2).split('=');
                    const key = parts[0];
                    const val = parts.length > 1 ? parts[1] : (tokens[i + 1] && !tokens[i + 1].startsWith('-') ? tokens[++i] : true);
                    flags[key] = val;
                } else if (token.startsWith('-') && token.length > 1) {
                    const chars = token.slice(1).split('');
                    chars.forEach((c, idx) => {
                        if (idx === chars.length - 1 && tokens[i + 1] && !tokens[i + 1].startsWith('-')) {
                            flags[c] = tokens[++i];
                        } else {
                            flags[c] = true;
                        }
                    });
                } else {
                    positional.push(token);
                }
            }
            return { positional, flags, nativeDirectives };
        }

        // ==========================================
        // 3. Native iOS Host Bridge (WKWebView)
        // ==========================================
        window.onNativeBridgeResponse = function(payload) {
            const data = typeof payload === 'string' ? JSON.parse(payload) : payload;
            if (nativeCallbackResolver) {
                nativeCallbackResolver(data);
                nativeCallbackResolver = null;
            } else {
                print("[Native Response Received]:\n" + JSON.stringify(data, null, 2));
            }
        };

        function callNativeHost(action, payload = {}) {
            return new Promise((resolve) => {
                nativeCallbackResolver = resolve;
                if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.jrNativeBridge) {
                    window.webkit.messageHandlers.jrNativeBridge.postMessage({ action: action, data: payload });
                } else {
                    // Browser Fallback Emulation for desktop testing
                    setTimeout(() => {
                        if (action === "getDeviceInfo") {
                            resolve({
                                "Device Model": navigator.platform || "iPad Simulator",
                                "System Name": "iPadOS (Emulated)",
                                "OS Version": "18.2",
                                "Device Name": "Jack's iPad Pro",
                                "Battery Level": "92%",
                                "Battery State": "Unplugged",
                                "Available Storage": "142.8 GB",
                                "Thermal State": "Nominal",
                                "Identifier": "SIMULATED-DEV-UUID-001"
                            });
                        } else if (action === "shutdown") {
                            resolve({ status: "OK", message: "Emulated termination call executed." });
                        } else {
                            resolve({ status: "OK", data: "Executed action: " + action });
                        }
                    }, 50);
                }
            });
        }

        // ==========================================
        // 4. Pyodide Initialization
        // ==========================================
        async function initPyodideEngine() {
            print("Booting JR-DOS Python 3 WebAssembly Kernel...");
            try {
                pyodideInstance = await loadPyodide({
                    stdout: (txt) => print(txt),
                    stderr: (txt) => print(txt, "error")
                });
                print("Python 3.11 Kernel Online.\n");
            } catch (err) {
                print("Python runtime loading failed: " + err.message, "error");
            }
        }

        // ==========================================
        // 5. Fifty (50+) Distinct Command Roots
        // ==========================================
        const commands = {};

        // 1. python3
        commands.python3 = async (ctx) => {
            if (!pyodideInstance) return "Error: Pyodide kernel initializing...";
            const scriptName = ctx.positional[0];
            if (!scriptName) return "Usage: python3 <script.py> [*args] [--opts]";
            const code = vfs.readFile(scriptName);
            if (code === null) return `python3: error: file '${scriptName}' not found in virtual filesystem`;

            try {
                pyodideInstance.FS.writeFile(scriptName, code);
                const argv = [scriptName, ...ctx.rawTokens.slice(1)];
                await pyodideInstance.runPythonAsync(`
import sys
sys.argv = ${JSON.stringify(argv)}
                `);
                await pyodideInstance.runPythonAsync(`
with open("${scriptName}", "r") as __f:
    exec(__f.read())
                `);
                return "";
            } catch (e) {
                return `Python Error: ${e.message}`;
            }
        };

        // 2. mkdir
        commands.mkdir = (ctx) => {
            const dirName = ctx.positional[0];
            if (!dirName) return "mkdir: missing directory operand";
            return vfs.mkdir(dirName) ? `Directory '${dirName}' created.` : `mkdir: cannot create directory '${dirName}': File exists`;
        };

        // 3. cd
        commands.cd = (ctx) => {
            const target = ctx.positional[0] || 'C:';
            if (target === '..') {
                if (vfs.currentDir.parent) {
                    vfs.currentDir = vfs.currentDir.parent;
                    vfs.currentPath.pop();
                }
            } else if (target === 'C:' || target === '/' || target === '\\') {
                vfs.currentDir = vfs.root;
                vfs.currentPath = ['C:'];
            } else {
                const node = vfs.resolvePath(target);
                if (!node || node.type !== 'dir') return `cd: no such file or directory: ${target}`;
                vfs.currentDir = node;
                vfs.currentPath.push(node.name);
            }
            promptLabel.textContent = vfs.getAbsolutePath() + ">";
            return "";
        };

        // 4. ls / dir
        commands.ls = (ctx) => {
            const isLong = ctx.flags.l || false;
            const entries = Object.keys(vfs.currentDir.children);
            if (entries.length === 0) return "  <Directory is empty>";
            const lines = [` Directory of ${vfs.getAbsolutePath()}`];
            entries.forEach(name => {
                const item = vfs.currentDir.children[name];
                if (isLong) {
                    const typeTag = item.type === 'dir' ? '<DIR> ' : '      ';
                    const size = item.type === 'file' ? item.content.length.toString().padStart(8) : "        ";
                    lines.push(`  ${typeTag}  ${size}  ${name}`);
                } else {
                    lines.push(`  ${item.type === 'dir' ? '[' + name + ']' : name}`);
                }
            });
            return lines.join('\n');
        };
        commands.dir = (ctx) => commands.ls(ctx);

        // 5. sysinfo
        commands.sysinfo = async (ctx) => {
            print("Querying native iPad / iPhone hardware telemetry...");
            const data = await callNativeHost("getDeviceInfo");
            if (ctx.flags.json) return JSON.stringify(data, null, 2);
            const lines = ["=== iPad / iPhone Device Information ==="];
            for (const [k, v] of Object.entries(data)) {
                lines.push(`  ${k.padEnd(20)}: ${v}`);
            }
            lines.push("========================================");
            return lines.join('\n');
        };

        // 6. dosinfo
        commands.dosinfo = () => {
            return [
                "=== JR-DOS System Specifications ===",
                "  Kernel Name        : JR-DOS Enterprise Microkernel",
                "  Syntax Standard    : JR-Script Specification v3.0",
                "  Python Engine      : Pyodide v0.25 (Python 3.11 Runtime)",
                "  Host Interop       : Apple WebKit IPC via WKScriptMessageHandler",
                "  Active Filesystem  : Hierarchical In-Memory VFS (C:\\)",
                "  Developer / Vendor : JR Entertainment",
                "===================================="
            ].join('\n');
        };

        // 7. shutdown
        commands.shutdown = async (ctx) => {
            print("Triggering system shutdown signal to native iOS container...", "warn");
            await callNativeHost("shutdown");
            return "Application shutdown terminated.";
        };

        // 8. clear / cls
        commands.clear = () => { terminal.innerHTML = ''; return ""; };
        commands.cls = () => commands.clear();

        // 9. curl
        commands.curl = async (ctx) => {
            const url = ctx.positional[0];
            if (!url) return "curl: no URL specified";
            try {
                const res = await fetch(url);
                return await res.text();
            } catch (e) {
                return `curl: network request failed: ${e.message}`;
            }
        };

        // 10. post
        commands.post = async (ctx) => {
            const url = ctx.positional[0];
            if (!url) return "Usage: post <url> [--data=<json|str>] [--headers=<json>]";
            const bodyData = ctx.flags.data || ctx.positional[1] || "";
            let customHeaders = { "Content-Type": "application/json" };
            if (ctx.flags.headers) {
                try { customHeaders = JSON.parse(ctx.flags.headers); } catch(e) { return "post: malformed headers JSON"; }
            }
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: customHeaders,
                    body: typeof bodyData === 'string' ? bodyData : JSON.stringify(bodyData)
                });
                return await res.text();
            } catch (e) {
                return `post: request failed: ${e.message}`;
            }
        };

        // 11. cat
        commands.cat = (ctx) => {
            const file = ctx.positional[0];
            if (!file) return "cat: missing file operand";
            const content = vfs.readFile(file);
            return content !== null ? content : `cat: ${file}: No such file`;
        };

        // 12. echo
        commands.echo = (ctx) => ctx.positional.join(' ');

        // 13. openfile / selectfile
        commands.openfile = (ctx) => {
            filePicker.onchange = (e) => {
                const files = Array.from(e.target.files);
                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        vfs.writeFile(file.name, evt.target.result);
                        print(`[VFS] Imported '${file.name}' (${file.size} bytes)`);
                    };
                    reader.readAsText(file);
                });
                filePicker.value = '';
            };
            filePicker.click();
            return "Opening iOS Native Document Picker...";
        };
        commands.selectfile = (ctx) => commands.openfile(ctx);

        // 14. rm
        commands.rm = (ctx) => {
            const target = ctx.positional[0];
            if (!target) return "rm: missing operand";
            return vfs.remove(target) ? `Removed '${target}'` : `rm: cannot remove '${target}': No such file or directory`;
        };

        // 15. touch
        commands.touch = (ctx) => {
            const f = ctx.positional[0];
            if (!f) return "touch: missing file operand";
            vfs.writeFile(f, "");
            return `File '${f}' created.`;
        };

        // 16. pwd
        commands.pwd = () => vfs.getAbsolutePath();

        // 17. write
        commands.write = (ctx) => {
            const f = ctx.positional[0];
            if (!f) return "write: missing filename";
            const data = ctx.positional.slice(1).join(' ');
            vfs.writeFile(f, data);
            return `Wrote ${data.length} bytes to '${f}'`;
        };

        // 18. append
        commands.append = (ctx) => {
            const f = ctx.positional[0];
            if (!f) return "append: missing filename";
            const existing = vfs.readFile(f) || "";
            const data = ctx.positional.slice(1).join(' ');
            vfs.writeFile(f, existing + (existing ? "\n" : "") + data);
            return `Appended ${data.length} bytes to '${f}'`;
        };

        // 19. py (inline Python)
        commands.py = async (ctx) => {
            if (!pyodideInstance) return "Python kernel not ready.";
            try {
                const res = await pyodideInstance.runPythonAsync(ctx.rawTokens.join(' '));
                return res !== undefined ? String(res) : "";
            } catch (e) {
                return `Python Error: ${e.message}`;
            }
        };

        // 20. battery
        commands.battery = async () => {
            const data = await callNativeHost("getDeviceInfo");
            return `Battery Level: ${data["Battery Level"] || "N/A"} | State: ${data["Battery State"] || "N/A"}`;
        };

        // 21. storage
        commands.storage = async () => {
            const data = await callNativeHost("getDeviceInfo");
            return `Available Internal Storage: ${data["Available Storage"] || "N/A"}`;
        };

        // 22. thermal
        commands.thermal = async () => {
            const data = await callNativeHost("getDeviceInfo");
            return `Hardware Thermal State: ${data["Thermal State"] || "N/A"}`;
        };

        // 23. uuid
        commands.uuid = async () => {
            const data = await callNativeHost("getDeviceInfo");
            return `Device Identifier: ${data["Identifier"] || "N/A"}`;
        };

        // 24. osver
        commands.osver = async () => {
            const data = await callNativeHost("getDeviceInfo");
            return `Operating System: ${data["System Name"] || "iOS"} ${data["OS Version"] || ""}`;
        };

        // 25. devname
        commands.devname = async () => {
            const data = await callNativeHost("getDeviceInfo");
            return `Device Friendly Name: ${data["Device Name"] || "Apple Device"}`;
        };

        // 26. haptic
        commands.haptic = async (ctx) => {
            const style = ctx.positional[0] || "medium";
            await callNativeHost("hapticFeedback", { style: style });
            return `Haptic pulse [${style}] fired.`;
        };

        // 27. clipget
        commands.clipget = async () => {
            const res = await callNativeHost("getClipboard");
            return res.text ? res.text : "<Clipboard empty>";
        };

        // 28. clipset
        commands.clipset = async (ctx) => {
            const txt = ctx.positional.join(' ');
            await callNativeHost("setClipboard", { text: txt });
            return "Text copied to iOS system clipboard.";
        };

        // 29. date
        commands.date = () => new Date().toString();

        // 30. time
        commands.time = () => new Date().toLocaleTimeString();

        // 31. timestamp
        commands.timestamp = () => String(Date.now());

        // 32. whoami
        commands.whoami = () => JR_ENV.USER;

        // 33. env
        commands.env = () => Object.entries(JR_ENV).map(([k, v]) => `${k}=${v}`).join('\n');

        // 34. set
        commands.set = (ctx) => {
            const pair = ctx.positional[0];
            if (!pair || !pair.includes('=')) return "Usage: set KEY=VALUE";
            const [k, v] = pair.split('=');
            JR_ENV[k] = v;
            return `Set env ${k}=${v}`;
        };

        // 35. unset
        commands.unset = (ctx) => {
            const k = ctx.positional[0];
            delete JR_ENV[k];
            return `Unset env ${k}`;
        };

        // 36. wc
        commands.wc = (ctx) => {
            const f = ctx.positional[0];
            if (!f) return "wc: missing file operand";
            const content = vfs.readFile(f);
            if (content === null) return `wc: ${f}: No such file`;
            const lines = content.split('\n').length;
            const words = content.trim().split(/\s+/).length;
            return `Lines: ${lines}, Words: ${words}, Bytes: ${content.length}`;
        };

        // 37. head
        commands.head = (ctx) => {
            const f = ctx.positional[0];
            const n = parseInt(ctx.flags.n || 10);
            const content = vfs.readFile(f);
            if (content === null) return `head: ${f}: No such file`;
            return content.split('\n').slice(0, n).join('\n');
        };

        // 38. tail
        commands.tail = (ctx) => {
            const f = ctx.positional[0];
            const n = parseInt(ctx.flags.n || 10);
            const content = vfs.readFile(f);
            if (content === null) return `tail: ${f}: No such file`;
            const arr = content.split('\n');
            return arr.slice(Math.max(arr.length - n, 0)).join('\n');
        };

        // 39. grep
        commands.grep = (ctx) => {
            const pattern = ctx.positional[0];
            const f = ctx.positional[1];
            if (!pattern) return "Usage: grep <pattern> [file]";
            const src = f ? vfs.readFile(f) : ctx.stdin;
            if (!src) return "grep: No content to search";
            return src.split('\n').filter(line => line.includes(pattern)).join('\n');
        };

        // 40. sort
        commands.sort = (ctx) => {
            const f = ctx.positional[0];
            const src = f ? vfs.readFile(f) : ctx.stdin;
            if (!src) return "";
            return src.split('\n').sort().join('\n');
        };

        // 41. uniq
        commands.uniq = (ctx) => {
            const f = ctx.positional[0];
            const src = f ? vfs.readFile(f) : ctx.stdin;
            if (!src) return "";
            return Array.from(new Set(src.split('\n'))).join('\n');
        };

        // 42. base64enc
        commands.base64enc = (ctx) => {
            const raw = ctx.positional.join(' ') || ctx.stdin;
            return btoa(raw);
        };

        // 43. base64dec
        commands.base64dec = (ctx) => {
            const raw = ctx.positional[0] || ctx.stdin;
            try { return atob(raw.trim()); } catch(e) { return "base64dec: Invalid base64 stream"; }
        };

        // 44. ping
        commands.ping = async (ctx) => {
            const host = ctx.positional[0] || "1.1.1.1";
            const start = performance.now();
            try {
                await fetch("https://" + host, { mode: 'no-cors' });
                const elapsed = (performance.now() - start).toFixed(1);
                return `Reply from ${host}: time=${elapsed}ms`;
            } catch (e) {
                return `Request timeout for ping: ${host}`;
            }
        };

        // 45. history
        commands.history = () => commandHistory.map((cmd, i) => `  ${(i + 1).toString().padStart(3)}  ${cmd}`).join('\n');

        // 46. stat
        commands.stat = (ctx) => {
            const f = ctx.positional[0];
            const node = vfs.resolvePath(f);
            if (!node) return `stat: cannot stat '${f}': No such file or directory`;
            return `File: ${node.name}\nType: ${node.type}\nSize: ${node.type === 'file' ? node.content.length : 0} bytes\nModified: ${node.mtime || 'System'}`;
        };

        // 47. cp
        commands.cp = (ctx) => {
            const [src, dest] = ctx.positional;
            if (!src || !dest) return "Usage: cp <source> <dest>";
            const content = vfs.readFile(src);
            if (content === null) return `cp: cannot read '${src}'`;
            vfs.writeFile(dest, content);
            return `Copied '${src}' -> '${dest}'`;
        };

        // 48. mv
        commands.mv = (ctx) => {
            const [src, dest] = ctx.positional;
            if (!src || !dest) return "Usage: mv <source> <dest>";
            const content = vfs.readFile(src);
            if (content === null) return `mv: cannot read '${src}'`;
            vfs.writeFile(dest, content);
            vfs.remove(src);
            return `Moved '${src}' -> '${dest}'`;
        };

        // 49. sleep
        commands.sleep = async (ctx) => {
            const sec = parseFloat(ctx.positional[0] || 1);
            await new Promise(r => setTimeout(r, sec * 1000));
            return `Slept ${sec}s`;
        };

        // 50. reboot
        commands.reboot = () => {
            terminal.innerHTML = '';
            print("Restarting JR-DOS Subsystem...\n");
            return commands.dosinfo();
        };

        // 51. calc
        commands.calc = (ctx) => {
            const expr = ctx.positional.join('');
            try { return String(Function(`'use strict'; return (${expr})`)()); } catch(e) { return "calc: syntax error"; }
        };

        // 52. help
        commands.help = () => {
            const keys = Object.keys(commands).sort();
            return `JR-DOS Built-in Commands (${keys.length} roots available):\n  ` + keys.join(', ');
        };

        // ==========================================
        // 6. Pipeline & Execution Coordinator
        // ==========================================
        async function runSingleCommand(rawCmdStr, stdin = "") {
            const rawTokens = jrTokenize(rawCmdStr.trim());
            if (rawTokens.length === 0) return "";

            const root = rawTokens[0].toLowerCase();
            const tokenStream = rawTokens.slice(1);
            const parsed = jrParseArgs(tokenStream);

            const context = {
                root: root,
                positional: parsed.positional,
                flags: parsed.flags,
                directives: parsed.nativeDirectives,
                rawTokens: tokenStream,
                stdin: stdin
            };

            if (commands[root]) {
                const res = await commands[root](context);
                return res !== undefined ? String(res) : "";
            } else {
                return `'${root}' is not recognized as a command in JR-DOS. Type 'help'.`;
            }
        }

        async function processCommandLine(line) {
            let redirectFile = null;
            let appendMode = false;

            if (line.includes('>>')) {
                const parts = line.split('>>');
                line = parts[0];
                redirectFile = parts[1].trim();
                appendMode = true;
            } else if (line.includes('>')) {
                const parts = line.split('>');
                line = parts[0];
                redirectFile = parts[1].trim();
                appendMode = false;
            }

            const pipeStages = line.split('|');
            let pipeBuffer = "";

            for (const stage of pipeStages) {
                pipeBuffer = await runSingleCommand(stage, pipeBuffer);
            }

            if (redirectFile) {
                if (appendMode) {
                    const exist = vfs.readFile(redirectFile) || "";
                    vfs.writeFile(redirectFile, exist + (exist ? "\n" : "") + pipeBuffer);
                } else {
                    vfs.writeFile(redirectFile, pipeBuffer);
                }
                print(`[Output saved to ${redirectFile}]`, "dim");
            } else if (pipeBuffer) {
                print(pipeBuffer);
            }
        }

        // ==========================================
        // 7. Input & Event Listeners
        // ==========================================
        cliInput.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter') {
                const input = cliInput.value.trim();
                cliInput.value = '';
                if (!input) return;

                print(`${vfs.getAbsolutePath()}> ${input}`);
                commandHistory.push(input);
                historyIndex = commandHistory.length;

                await processCommandLine(input);
            } else if (e.key === 'ArrowUp') {
                if (historyIndex > 0) {
                    historyIndex--;
                    cliInput.value = commandHistory[historyIndex];
                }
            } else if (e.key === 'ArrowDown') {
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex++;
                    cliInput.value = commandHistory[historyIndex];
                } else {
                    historyIndex = commandHistory.length;
                    cliInput.value = '';
                }
            }
        });

        document.body.addEventListener('click', () => cliInput.focus());

        // System Startup
        print("==============================================================");
        print(" JR-DOS Operating System [Version 3.0.0-ENTERPRISE]           ");
        print(" Proprietary JR-Script Architecture & Python 3.11 Runtime     ");
        print(" Copyright (c) JR Entertainment. All rights reserved.          ");
        print("==============================================================");
        print("Type 'help' to review 50+ integrated command roots.\n");
        initPyodideEngine();
    </script>
