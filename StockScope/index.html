<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Phira Pure Engine - Cloud & Storage Edition</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      touch-action: none;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px 26px;
      z-index: 10;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      text-shadow: 0 2px 6px rgba(0,0,0,0.85);
    }
    .hud-combo {
      text-align: center;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 2px;
      line-height: 1;
    }
    .hud-combo span {
      font-size: 13px;
      font-weight: normal;
      display: block;
      opacity: 0.8;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    /* 启动与管理主面板 */
    #main-dashboard {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(6, 6, 12, 0.95);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 30;
      padding: 24px;
      overflow-y: auto;
      gap: 16px;
    }
    .header-bar {
      display: flex;
      width: 100%;
      max-width: 900px;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .rks-badge {
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      color: #000;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 14px;
    }
    .tabs {
      display: flex;
      gap: 12px;
      max-width: 900px;
      width: 100%;
    }
    .tab-btn {
      padding: 8px 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      cursor: pointer;
      font-size: 14px;
    }
    .tab-btn.active {
      background: #00e5ff;
      color: #000;
      font-weight: bold;
      border-color: #00e5ff;
    }
    .content-area {
      max-width: 900px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 48vh;
      overflow-y: auto;
    }
    .item-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      padding: 12px 18px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .item-card:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .btn {
      padding: 8px 22px;
      background: linear-gradient(135deg, #2979ff, #00e5ff);
      border: none;
      border-radius: 20px;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:active {
      transform: scale(0.96);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .upload-zone {
      padding: 20px;
      border: 2px dashed rgba(0, 229, 255, 0.4);
      border-radius: 16px;
      text-align: center;
      cursor: pointer;
      background: rgba(0, 229, 255, 0.02);
    }

    /* 结算面板样式 */
    #result-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(4, 6, 12, 0.94);
      backdrop-filter: blur(20px);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 40;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    .result-card {
      width: 90%;
      max-width: 720px;
      display: flex;
      flex-direction: row;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px;
      gap: 30px;
      align-items: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }
    .result-rank {
      font-size: 90px;
      font-weight: 900;
      color: #ffd700;
      text-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
      width: 140px;
      text-align: center;
    }
    .result-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .result-score {
      font-size: 40px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .result-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 16px;
      font-size: 14px;
      color: #b0bec5;
    }
    .stat-val {
      font-weight: bold;
      color: #fff;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
  <div id="canvas-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <div id="ui-overlay">
    <div class="hud-top">
      <div>
        <div id="song-name" style="font-weight: bold; font-size: 18px;">曲目名称</div>
        <div id="song-desc" style="opacity: 0.7; font-size: 13px;">等待载入...</div>
      </div>
      <div class="hud-combo">
        <div id="combo-num">0</div>

      <div style="text-align: right;">
        <div id="score-val" style="font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums;">0000000</div>

      </div>
    </div>
  </div>

  <!-- 主控制面板 -->
  <div id="main-dashboard">
    <div class="header-bar">
      <div>
        <h2 style="font-weight:300; letter-spacing:2px;">PHIRA CLIENT</h2>
        <span style="font-size:12px; color:#90a4ae;">IndexedDB Storage & GitHub Sync</span>
      </div>

      <button class="tab-btn" id="tab-settings">偏好设置</button>
    </div>

    <!-- 1. 本地曲库面板 -->
    <div class="content-area" id="panel-local">
      <div class="upload-zone" onclick="document.getElementById('import-local-zip').click()">
        <p style="font-size:14px; font-weight:bold;">导入本地谱面 / 皮肤 ZIP 文件</p>
        <p style="font-size:12px; color:#80deea; margin-top:4px;">导入后将永久保存在本地数据库中</p>
        <input type="file" id="import-local-zip" accept=".zip" style="display:none;">

      <h4 style="font-size:13px; color:#cfd8dc; margin-top:4px;">已保存谱面列表：</h4>
      <div class="card-list" id="local-chart-list">
        <!-- 动态生成 -->
      </div>
    </div>

    <!-- 2. GitHub 云端下载面板 -->
    <div class="content-area" id="panel-cloud" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:13px; color:#90a4ae;">仓库：zhangzhanhang855/phira-emu</span>
        <button class="btn btn-secondary" id="btn-refresh-cloud">刷新云端列表</button>
      </div>
      <div class="card-list" id="cloud-item-list">
        <!-- 动态生成 -->
      </div>
    </div>

    <!-- 3. 设置面板 -->
    <div class="content-area" id="panel-settings" style="display:none;">
      <div class="item-card">
        <span>Note 缩放倍率</span>
        <input type="range" id="size-slider" min="0.6" max="2.2" step="0.05" value="1.25">
        <span id="size-val" style="color:#00e5ff; font-weight:bold;">1.25x</span>
      </div>
      <div class="item-card">
        <span>自动游玩模式 (Autoplay)</span>
        <button class="btn btn-secondary" id="autoplay-btn">关 (OFF)</button>
      </div>
    </div>
  </div>

  <!-- 结算结果面板 -->
  <div id="result-panel">
    <div class="result-card">
      <div class="result-rank" id="res-rank">V</div>
      <div class="result-info">
        <div id="res-title" style="font-size: 20px; font-weight: 700;">曲目完成</div>
        <div class="result-score" id="res-score">0000000</div>
        <div class="result-stats">
          <div>ACC: <span class="stat-val" id="res-acc">100.00%</span></div>
          <div>Max Combo: <span class="stat-val" id="res-combo">0</span></div>
          <div>单曲 rks: <span class="stat-val" style="color:#ffd700;" id="res-song-rks">0.00</span></div>
          <div>Perfect: <span class="stat-val" style="color:#00e5ff;" id="res-perf">0</span></div>
          <div>Good: <span class="stat-val" style="color:#ffd54f;" id="res-good">0</span></div>
          <div>Miss: <span class="stat-val" style="color:#ff1744;" id="res-miss">0</span></div>
        </div>
      </div>
    </div>
    <button class="btn" style="margin-top: 24px;" onclick="closeResultPanel()">返回曲目列表</button>
  </div>

  <script>
    // --- 1. IndexedDB 存储核心 ---
    const DB_NAME = "PhiraPureDB";
    const DB_VERSION = 1;
    let db = null;

    function openDatabase() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains("charts")) {
            d.createObjectStore("charts", { keyPath: "id" });
          }
          if (!d.objectStoreNames.contains("skins")) {
            d.createObjectStore("skins", { keyPath: "id" });
          }
          if (!d.objectStoreNames.contains("scores")) {
            d.createObjectStore("scores", { keyPath: "chartId" });
          }
        };
        req.onsuccess = (e) => { db = e.target.result; resolve(db); };
        req.onerror = (e) => reject(e);
      });
    }

    function dbSave(storeName, data) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction([storeName], "readwrite");
        const store = tx.objectStore(storeName);
        store.put(data);
        tx.oncomplete = () => resolve();
        tx.onerror = (e) => reject(e);
      });
    }

    function dbGetAll(storeName) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction([storeName], "readonly");
        const store = tx.objectStore(storeName);
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = (e) => reject(e);
      });
    }

    function dbGet(storeName, key) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction([storeName], "readonly");
        const store = tx.objectStore(storeName);
        const req = store.get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = (e) => reject(e);
      });
    }

    // --- 2. 官方 rks 计算模型 ---
    function calcSongRks(acc, difficulty) {
      if (acc < 70) return 0;
      if (acc >= 100) return difficulty;
      const factor = Math.pow((acc - 55) / 45, 2);
      return Math.round(factor * difficulty * 100) / 100;
    }

    async function updateOverallRks() {
      const scores = await dbGetAll("scores");
      if (scores.length === 0) {
        document.getElementById('user-rks').innerText = "0.00";
        return;
      }
      // 取最高的前 19 首 (Best 19)
      scores.sort((a, b) => (b.rks || 0) - (a.rks || 0));
      const topScores = scores.slice(0, 19);
      const sum = topScores.reduce((acc, cur) => acc + (cur.rks || 0), 0);
      const overall = sum / 19;
      document.getElementById('user-rks').innerText = overall.toFixed(2);
    }

    // --- 3. 基础游戏上下文与全局变量 ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
    let audioCtx = null;
    let sfxGainNode = null;
    let bgmBuffer = null;
    let endingBuffer = null;
    let bgmSource = null;
    let startTime = 0;
    let isPlaying = false;
    let isEnded = false;

    let userNoteScale = 1.25;
    let isAutoplay = false;

    let currentChartId = "";
    let songMeta = {
      title: "Phira Track",
      level: "IN Lv.15",
      difficulty: 15.0,
      composer: "Unknown",
      charter: "Unknown",
      offset: 0.0
    };

    const ASSETS = {
      chartJson: null,
      bgImage: null,
      hitFxImage: null,
      audioBuffers: {},
      images: {}
    };

    let parsedLines = [];
    let score = 0, combo = 0, maxCombo = 0;
    let perfectCount = 0, goodCount = 0, missCount = 0, totalNotes = 0;
    let W = 0, H = 0, scale = 1;
    const hitParticles = [];

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
      scale = Math.min(W / 1280, H / 720);
    }
    window.addEventListener('resize', resize);
    resize();

    async function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
        sfxGainNode = audioCtx.createGain();
        sfxGainNode.gain.setValueAtTime(0.85, audioCtx.currentTime);
        sfxGainNode.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') await audioCtx.resume();
    }

    const lastSoundPlayTime = { Tap: 0, Drag: 0, Hold: 0, Flick: 0 };
    function playHitSound(type) {
      if (!audioCtx) return;
      const now = performance.now();
      const map = { 1: "Tap", 2: "Drag", 3: "Hold", 4: "Flick" };
      const name = map[type];

      if (now - lastSoundPlayTime[name] < 12) return;
      lastSoundPlayTime[name] = now;

      if (ASSETS.audioBuffers[name]) {
        const s = audioCtx.createBufferSource();
        s.buffer = ASSETS.audioBuffers[name];
        s.connect(sfxGainNode);
        s.start(0);
      }
    }

    function spawnHitFX(worldX, worldY, isPerfect) {
      if (hitParticles.length > 36) hitParticles.shift();
      hitParticles.push({
        x: worldX,
        y: worldY,
        startTime: performance.now(),
        duration: 280,
        isPerfect: isPerfect
      });
    }

    function parseInfoString(str) {
      const res = {};
      const lines = str.split(/\r?\n/);
      lines.forEach(l => {
        const idx = l.indexOf(':');
        if (idx > -1) {
          const k = l.slice(0, idx).trim().replace(/^#\s*/, '');
          let v = l.slice(idx + 1).trim();
          v = v.replace(/^["']|["']$/g, '');
          if (k) res[k] = v;
        }
      });
      return res;
    }

    // --- 4. ZIP 处理与载入流 ---
    async function processAndLoadZip(fileBlob, isSkin = false) {
      await initAudio();
      const zip = await JSZip.loadAsync(fileBlob);
      const entries = zip.files;

      if (isSkin) {
        for (let path in entries) {
          const l = path.toLowerCase();
          const entry = entries[path];
          if (entry.dir) continue;

          if (l.endsWith('.png') || l.endsWith('.jpg')) {
            const blob = await entry.async('blob');
            const img = new Image();
            img.src = URL.createObjectURL(blob);
            await new Promise(r => { img.onload = r; });

            if (l.includes('hit_fx') || l.includes('hitfx') || l.includes('image_7')) ASSETS.hitFxImage = img;
            else if (l.includes('tap')) ASSETS.images[l.includes('mh') ? 'Tap_mh' : 'Tap'] = img;
            else if (l.includes('drag')) ASSETS.images[l.includes('mh') ? 'Drag_mh' : 'Drag'] = img;
            else if (l.includes('hold')) ASSETS.images[l.includes('mh') ? 'Hold_mh' : 'Hold'] = img;
            else if (l.includes('flick')) ASSETS.images[l.includes('mh') ? 'Flick_mh' : 'Flick'] = img;
          } else if (l.endsWith('.ogg') || l.endsWith('.wav') || l.endsWith('.mp3')) {
            const ab = await entry.async('arraybuffer');
            const buf = await audioCtx.decodeAudioData(ab);
            if (l.includes('tap')) ASSETS.audioBuffers['Tap'] = buf;
            else if (l.includes('drag')) ASSETS.audioBuffers['Drag'] = buf;
            else if (l.includes('hold')) ASSETS.audioBuffers['Hold'] = buf;
            else if (l.includes('flick')) ASSETS.audioBuffers['Flick'] = buf;
            else if (l.includes('ending')) endingBuffer = buf;
          }
        }
        await dbSave("skins", { id: "default_skin", blob: fileBlob });
        alert("皮肤资源包已更新并保存至数据库！");
        return;
      }

      // 谱面包 (包含 5 文件)
      let infoData = {};
      for (let path in entries) {
        const l = path.toLowerCase();
        if (l.endsWith('info.yml') || l.endsWith('info.yaml') || l.endsWith('info.txt')) {
          const txt = await entries[path].async('text');
          infoData = Object.assign(infoData, parseInfoString(txt));
        }
      }

      let chartJson = null;
      let audioBuf = null;
      let bgImg = null;

      for (let path in entries) {
        const entry = entries[path];
        if (entry.dir) continue;
        const l = path.toLowerCase();

        if (l.endsWith('.json')) {
          const txt = await entry.async('text');
          const j = JSON.parse(txt);
          if (j.judgeLineList) chartJson = j;
        } else if (l.endsWith('.ogg') || l.endsWith('.mp3') || l.endsWith('.wav')) {
          const ab = await entry.async('arraybuffer');
          audioBuf = await audioCtx.decodeAudioData(ab);
        } else if (l.endsWith('.png') || l.endsWith('.jpg') || l.endsWith('.jpeg')) {
          const blob = await entry.async('blob');
          const img = new Image();
          img.src = URL.createObjectURL(blob);
          await new Promise(r => { img.onload = r; });
          bgImg = img;
        }
      }

      if (!chartJson || !audioBuf) throw new Error("谱面包文件结构不完整，未识别到 JSON 或音频！");

      const cid = infoData.name || ("chart_" + Date.now());
      const record = {
        id: cid,
        name: infoData.name || "未命名谱面",
        level: infoData.level || "IN Lv.15",
        difficulty: parseFloat(infoData.difficulty) || 15.0,
        composer: infoData.composer || "Unknown",
        charter: infoData.charter || "Unknown",
        blob: fileBlob
      };

      await dbSave("charts", record);
      await refreshLocalList();
      alert(`谱面《${record.name}》已存入本地数据库！`);
    }

    async function loadChartFromDB(cid) {
      const record = await dbGet("charts", cid);
      if (!record) return;

      currentChartId = record.id;
      songMeta.title = record.name;
      songMeta.level = record.level;
      songMeta.difficulty = record.difficulty;
      songMeta.composer = record.composer;
      songMeta.charter = record.charter;

      const zip = await JSZip.loadAsync(record.blob);
      for (let path in zip.files) {
        const entry = zip.files[path];
        if (entry.dir) continue;
        const l = path.toLowerCase();
        if (l.endsWith('.json')) {
          ASSETS.chartJson = JSON.parse(await entry.async('text'));
        } else if (l.endsWith('.ogg') || l.endsWith('.mp3') || l.endsWith('.wav')) {
          bgmBuffer = await audioCtx.decodeAudioData(await entry.async('arraybuffer'));
        } else if (l.endsWith('.png') || l.endsWith('.jpg')) {
          const img = new Image();
          img.src = URL.createObjectURL(await entry.async('blob'));
          await new Promise(r => { img.onload = r; });
          ASSETS.bgImage = img;
        }
      }

      document.getElementById('song-name').innerText = songMeta.title;
      document.getElementById('song-desc').innerText = `${songMeta.level} | ${songMeta.composer}`;

      // 启动游戏
      prepareChart();
      document.getElementById('main-dashboard').style.display = 'none';
      isPlaying = true;
      isEnded = false;

      if (bgmBuffer) {
        bgmSource = audioCtx.createBufferSource();
        bgmSource.buffer = bgmBuffer;
        bgmSource.connect(audioCtx.destination);
        startTime = audioCtx.currentTime;
        bgmSource.start(0);
      } else {
        startTime = audioCtx.currentTime;
      }
      requestAnimationFrame(render);
    }

    // --- 5. GitHub 仓库云端抓取 ---
    const REPO_OWNER = "zhangzhanhang855";
    const REPO_NAME = "Phira-Emu";

    async function fetchGitHubDirectory(dirPath) {
      const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${dirPath}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error("GitHub API 请求受限或目录不存在");
      return await res.json();
    }

    async function downloadAndImportGitHubFile(downloadUrl, isSkin) {
      const btn = event.target;
      const originText = btn.innerText;
      btn.innerText = "下载中...";
      btn.disabled = true;

      try {
        const res = await fetch(downloadUrl);
        const blob = await res.blob();
        await processAndLoadZip(blob, isSkin);
        btn.innerText = "已保存";
      } catch (err) {
        alert("下载失败: " + err.message);
        btn.innerText = originText;
        btn.disabled = false;
      }
    }

    async function refreshCloudList() {

    // --- 6. 核心游戏引擎与渲染 ---
    function prepareChart() {
      if (!ASSETS.chartJson || !ASSETS.chartJson.judgeLineList) return;
      totalNotes = 0;

      const timeCount = new Map();
      ASSETS.chartJson.judgeLineList.forEach(line => {
        const allNotes = [...(line.notesAbove || []), ...(line.notesBelow || [])];
        allNotes.forEach(n => {
          const t = Math.round(n.time);
          timeCount.set(t, (timeCount.get(t) || 0) + 1);
        });
      });

      parsedLines = ASSETS.chartJson.judgeLineList.map((line, idx) => {
        const bpm = line.bpm || 140.0;
        const tickToSec = (tick) => (tick / 32) * (60 / bpm);
        const secToTick = (sec) => (sec / (60 / bpm)) * 32;

        let accumulatedFloor = 0;
        const speedEvents = (line.speedEvents || []).map(e => {
          const startFloor = accumulatedFloor;
          const duration = e.endTime - e.startTime;
          const deltaFloor = (duration / 32) * (e.value / (bpm / 60));
          accumulatedFloor += deltaFloor;
          return {
            startTime: e.startTime,
            endTime: e.endTime,
            value: e.value,
            startFloor: startFloor,
            endFloor: accumulatedFloor
          };
        });

        function getFloorPosAtTick(tick) {
          if (speedEvents.length === 0) return 0;
          if (tick <= speedEvents[0].startTime) return 0;
          const last = speedEvents[speedEvents.length - 1];
          if (tick >= last.endTime) return last.endFloor;

          for (let i = 0; i < speedEvents.length; i++) {
            const ev = speedEvents[i];
            if (tick >= ev.startTime && tick <= ev.endTime) {
              const p = (tick - ev.startTime) / (ev.endTime - ev.startTime || 1);
              return ev.startFloor + (ev.endFloor - ev.startFloor) * p;
            }
          }
          return 0;
        }

        function formatNotes(notes, isAbove) {
          return (notes || []).map(n => {
            totalNotes++;
            const startFloor = (n.floorPosition !== undefined) ? n.floorPosition : getFloorPosAtTick(n.time);
            const endFloor = getFloorPosAtTick(n.time + (n.holdTime || 0));
            const isMulti = (timeCount.get(Math.round(n.time)) || 0) >= 2;

            return {
              type: n.type,
              time: n.time,
              timeSec: tickToSec(n.time),
              holdTime: n.holdTime || 0,
              holdTimeSec: tickToSec(n.holdTime || 0),
              x: n.positionX,
              speed: n.speed || 1.0,
              startFloor: startFloor,
              endFloor: endFloor,
              isAbove: isAbove,
              isMulti: isMulti,
              hit: false,
              miss: false,
              holding: false,
              headHit: false,
              lastTouchTime: 0,
              holdFxTimer: 0
            };
          });
        }

        const allNotes = [...formatNotes(line.notesAbove, true), ...formatNotes(line.notesBelow, false)];
        allNotes.sort((a, b) => a.timeSec - b.timeSec);

        return {
          id: idx,
          bpm: bpm,
          tickToSec: tickToSec,
          secToTick: secToTick,
          getFloorPosAtTick: getFloorPosAtTick,
          moveEvents: line.judgeLineMoveEvents || [],
          rotateEvents: line.rotateEvents || line.judgeLineRotateEvents || [],
          disappearEvents: line.judgeLineDisappearEvents || [],
          notes: allNotes,
          activeNoteHeadIndex: 0
        };
      });
    }

    function evalNumberEvent(events, curTick, defaultVal) {
      if (!events || events.length === 0) return defaultVal;
      if (curTick <= events[0].startTime) return events[0].start;
      const last = events[events.length - 1];
      if (curTick >= last.endTime) return last.end;

      for (let i = 0; i < events.length; i++) {
        const ev = events[i];
        if (curTick >= ev.startTime && curTick <= ev.endTime) {
          const t = (curTick - ev.startTime) / (ev.endTime - ev.startTime || 1);
          return ev.start + (ev.end - ev.start) * t;
        }
      }
      return defaultVal;
    }

    function evalMoveEvent(events, curTick) {
      if (!events || events.length === 0) return { x: 0.5, y: 0.5 };
      if (curTick <= events[0].startTime) return { x: events[0].start, y: events[0].start2 ?? 0.5 };
      const last = events[events.length - 1];
      if (curTick >= last.endTime) return { x: last.end, y: last.end2 ?? 0.5 };

      for (let i = 0; i < events.length; i++) {
        const ev = events[i];
        if (curTick >= ev.startTime && curTick <= ev.endTime) {
          const t = (curTick - ev.startTime) / (ev.endTime - ev.startTime || 1);
          return {
            x: ev.start + (ev.end - ev.start) * t,
            y: (ev.start2 ?? 0.5) + ((ev.end2 ?? 0.5) - (ev.start2 ?? 0.5)) * t
          };
        }
      }
      return { x: 0.5, y: 0.5 };
    }

    function computeNoteLocalY(note, curFloorPos, curSec) {
      const dt = note.timeSec - curSec;
      const rawFloorDiff = Math.abs(note.startFloor - curFloorPos);
      const dist = rawFloorDiff * 380 * scale;
      let y = 0;
      if (note.isAbove) {
        y = (dt >= 0) ? -dist : dist;
      } else {
        y = (dt >= 0) ? dist : -dist;
      }
      return y;
    }

    function updateAutoplay(curTime) {
      if (!isAutoplay) return;

      for (let l = 0; l < parsedLines.length; l++) {
        const line = parsedLines[l];
        const curTick = line.secToTick(curTime);
        const linePos = evalMoveEvent(line.moveEvents, curTick);
        const rotDeg = evalNumberEvent(line.rotateEvents, curTick, 0);

        const lx = linePos.x * W;
        const ly = (1.0 - linePos.y) * H;
        const rad = (-rotDeg * Math.PI) / 180;
        const cosR = Math.cos(rad);
        const sinR = Math.sin(rad);

        const notes = line.notes;
        const startIdx = line.activeNoteHeadIndex;

        for (let i = startIdx; i < notes.length; i++) {
          const note = notes[i];
          if (note.hit || note.miss) continue;
          if (note.timeSec - curTime > 0.005) break;

          const noteLocalX = (note.x / 9) * (W * 0.42);
          const hitWorldX = lx + noteLocalX * cosR;
          const hitWorldY = ly + noteLocalX * -sinR;

          if (note.type === 1 || note.type === 2 || note.type === 4) {
            note.hit = true;
            playHitSound(note.type);
            registerHit(1.0);
            spawnHitFX(hitWorldX, hitWorldY, true);
          } else if (note.type === 3) {
            if (!note.headHit) {
              note.headHit = true;
              note.holding = true;
              note.lastTouchTime = curTime;
              playHitSound(1);
              spawnHitFX(hitWorldX, hitWorldY, true);
            }
          }
        }
      }
    }

    const activeTouches = new Map();

    window.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (isAutoplay) return;
      activeTouches.set(e.pointerId, {
        x: e.clientX,
        y: e.clientY,
        lastX: e.clientX,
        lastY: e.clientY,
        startTime: performance.now()
      });
      checkHits(e.clientX, e.clientY, 'tap');
    }, { passive: false });

    window.addEventListener('pointermove', (e) => {
      e.preventDefault();
      if (isAutoplay) return;
      if (activeTouches.has(e.pointerId)) {
        const p = activeTouches.get(e.pointerId);
        const dx = e.clientX - p.lastX;
        const dy = e.clientY - p.lastY;
        const dist = Math.hypot(dx, dy);
        const isFlick = dist > 14;

        p.lastX = e.clientX;
        p.lastY = e.clientY;
        p.x = e.clientX;
        p.y = e.clientY;

        if (isFlick) checkHits(e.clientX, e.clientY, 'flick');
        checkHits(e.clientX, e.clientY, 'drag');
      }
    }, { passive: false });

    function onPointerUp(e) { activeTouches.delete(e.pointerId); }
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);

    function checkHits(screenX, screenY, inputType) {
      if (!isPlaying || isAutoplay) return;
      const curTime = (audioCtx.currentTime - startTime) + (songMeta.offset || 0);

      for (let l = 0; l < parsedLines.length; l++) {
        const line = parsedLines[l];
        const curTick = line.secToTick(curTime);
        const linePos = evalMoveEvent(line.moveEvents, curTick);
        const rotDeg = evalNumberEvent(line.rotateEvents, curTick, 0);
        const curFloorPos = line.getFloorPosAtTick(curTick);

        const lx = linePos.x * W;
        const ly = (1.0 - linePos.y) * H;
        const rad = (-rotDeg * Math.PI) / 180;
        const cosR = Math.cos(rad);
        const sinR = Math.sin(rad);

        const dx = screenX - lx;
        const dy = screenY - ly;
        const touchLocalX = dx * cosR - dy * sinR;
        const touchLocalY = dx * sinR + dy * cosR;

        const notes = line.notes;
        const startIdx = line.activeNoteHeadIndex;

        for (let i = startIdx; i < notes.length; i++) {
          const note = notes[i];
          if (note.hit || note.miss) continue;

          const dt = curTime - note.timeSec;
          if (dt < -0.22) break;

          const noteLocalY = computeNoteLocalY(note, curFloorPos, curTime);
          const noteLocalX = (note.x / 9) * (W * 0.42);

          const horizDist = Math.abs(touchLocalX - noteLocalX);
          const horizThreshold = 130 * scale * userNoteScale;
          const isTouchNearLine = Math.abs(touchLocalY) < (130 * scale * userNoteScale);
          const noteDistToLine = Math.abs(noteLocalY);

          if (horizDist < horizThreshold && isTouchNearLine) {
            const hitWorldX = lx + noteLocalX * cosR;
            const hitWorldY = ly + noteLocalX * -sinR;

            if (note.type === 1 && inputType === 'tap' && Math.abs(dt) <= 0.16) {
              note.hit = true;
              playHitSound(1);
              const isPerf = Math.abs(dt) <= 0.08;
              registerHit(isPerf ? 1.0 : 0.65);
              spawnHitFX(hitWorldX, hitWorldY, isPerf);
            } else if (note.type === 2 && noteDistToLine < (70 * scale * userNoteScale) && Math.abs(dt) <= 0.14) {
              note.hit = true;
              playHitSound(2);
              registerHit(1.0);
              spawnHitFX(hitWorldX, hitWorldY, true);
            } else if (note.type === 4 && inputType === 'flick' && Math.abs(dt) <= 0.16) {
              note.hit = true;
              playHitSound(4);
              registerHit(1.0);
              spawnHitFX(hitWorldX, hitWorldY, true);
            } else if (note.type === 3 && inputType === 'tap' && Math.abs(dt) <= 0.16 && !note.headHit) {
              note.headHit = true;
              note.holding = true;
              note.lastTouchTime = curTime;
              playHitSound(1);
              spawnHitFX(hitWorldX, hitWorldY, true);
            }
          }
        }
      }
    }

    function updateHoldingStates(curTime) {
      for (let l = 0; l < parsedLines.length; l++) {
        const line = parsedLines[l];
        const curTick = line.secToTick(curTime);
        const linePos = evalMoveEvent(line.moveEvents, curTick);
        const rotDeg = evalNumberEvent(line.rotateEvents, curTick, 0);

        const lx = linePos.x * W;
        const ly = (1.0 - linePos.y) * H;
        const rad = (-rotDeg * Math.PI) / 180;
        const cosR = Math.cos(rad);
        const sinR = Math.sin(rad);

        const notes = line.notes;
        const startIdx = line.activeNoteHeadIndex;

        for (let i = startIdx; i < notes.length; i++) {
          const note = notes[i];
          if (note.timeSec - curTime > 0.5) break;
          if (note.type !== 3 || !note.headHit || note.hit || note.miss) continue;

          if (curTime < note.timeSec) continue;

          if (curTime >= note.timeSec + note.holdTimeSec) {
            note.hit = true;
            registerHit(1.0);
            const noteLocalX = (note.x / 9) * (W * 0.42);
            spawnHitFX(lx + noteLocalX * cosR, ly + noteLocalX * -sinR, true);
            continue;
          }

          const noteLocalX = (note.x / 9) * (W * 0.42);
          const horizThreshold = 160 * scale * userNoteScale;
          const vertThreshold = 180 * scale * userNoteScale;

          let isTouchCovering = isAutoplay;

          if (!isTouchCovering) {
            for (let [id, touch] of activeTouches) {
              const dx = touch.x - lx;
              const dy = touch.y - ly;
              const tX = dx * cosR - dy * sinR;
              const tY = dx * sinR + dy * cosR;

              if (Math.abs(tX - noteLocalX) < horizThreshold && Math.abs(tY) < vertThreshold) {
                isTouchCovering = true;
                break;
              }
            }
          }

          if (isTouchCovering) {
            note.holding = true;
            note.lastTouchTime = curTime;

            if (!note.holdFxTimer || curTime - note.holdFxTimer > 0.12) {
              note.holdFxTimer = curTime;
              const hitWorldX = lx + noteLocalX * cosR;
              const hitWorldY = ly + noteLocalX * -sinR;
              spawnHitFX(hitWorldX, hitWorldY, true);
            }
          } else {
            if (curTime - note.lastTouchTime > 0.45) {
              note.holding = false;
              note.miss = true;
              registerMiss();
            }
          }
        }
      }
    }

    function registerHit(weight) {
      if (weight === 1.0) perfectCount++;
      else goodCount++;
      combo++;
      if (combo > maxCombo) maxCombo = combo;
      updateHUD();
    }

    function registerMiss() {
      missCount++;
      combo = 0;
      updateHUD();
    }

    function updateHUD() {
      const processed = perfectCount + goodCount + missCount;
      const totalScore = processed === 0 ? 0 : Math.round(((perfectCount + goodCount * 0.65) / totalNotes) * 1000000);
      const acc = processed === 0 ? 100 : (((perfectCount + goodCount * 0.65) / processed) * 100);

      document.getElementById('combo-num').innerText = combo;
      document.getElementById('score-val').innerText = totalScore.toString().padStart(7, '0');
      document.getElementById('acc-val').innerText = acc.toFixed(2) + '%';
    }

    function renderHitFX(now) {
      if (hitParticles.length === 0) return;
      for (let i = hitParticles.length - 1; i >= 0; i--) {
        const p = hitParticles[i];
        const elapsed = now - p.startTime;
        if (elapsed >= p.duration) {
          hitParticles.splice(i, 1);
          continue;
        }

        const progress = elapsed / p.duration;
        const frameIndex = Math.min(29, Math.floor(progress * 30));
        const col = frameIndex % 5;
        const row = Math.floor(frameIndex / 5);

        ctx.save();
        ctx.translate(p.x, p.y);

        if (ASSETS.hitFxImage) {
          const img = ASSETS.hitFxImage;
          const fw = img.width / 5;
          const fh = img.height / 6;
          const renderSize = 150 * scale * userNoteScale;
          ctx.drawImage(img, col * fw, row * fh, fw, fh, -renderSize / 2, -renderSize / 2, renderSize, renderSize);
        } else {
          ctx.strokeStyle = p.isPerfect ? '#ffe082' : '#80deea';
          ctx.lineWidth = 3.5 * (1 - progress);
          ctx.beginPath();
          ctx.arc(0, 0, (35 + progress * 45) * scale * userNoteScale, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      }
    }

    function render() {
      if (!isPlaying) return;

      const now = performance.now();
      const curSec = (audioCtx.currentTime - startTime) + (songMeta.offset || 0);

      updateAutoplay(curSec);
      updateHoldingStates(curSec);

      ctx.clearRect(0, 0, W, H);

      // 背景
      if (ASSETS.bgImage) {
        ctx.save();
        ctx.globalAlpha = 0.35;
        const img = ASSETS.bgImage;
        const imgRatio = img.width / img.height;
        const screenRatio = W / H;
        let dw, dh, dx, dy;
        if (screenRatio > imgRatio) {
          dw = W; dh = W / imgRatio; dx = 0; dy = (H - dh) / 2;
        } else {
          dh = H; dw = H * imgRatio; dx = (W - dw) / 2; dy = 0;
        }
        ctx.drawImage(img, dx, dy, dw, dh);
        ctx.restore();
      }

      // 判定线与音符
      for (let l = 0; l < parsedLines.length; l++) {
        const line = parsedLines[l];
        const curTick = line.secToTick(curSec);
        const linePos = evalMoveEvent(line.moveEvents, curTick);
        const rotDeg = evalNumberEvent(line.rotateEvents, curTick, 0);
        const lineAlpha = evalNumberEvent(line.disappearEvents, curTick, 1.0);
        const curFloorPos = line.getFloorPosAtTick(curTick);

        const lx = linePos.x * W;
        const ly = (1.0 - linePos.y) * H;

        ctx.save();
        ctx.translate(lx, ly);
        ctx.rotate((rotDeg * Math.PI) / 180);

        if (lineAlpha > 0.01) {
          ctx.save();
          ctx.globalAlpha = lineAlpha;
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
          ctx.lineWidth = 7 * scale;
          ctx.beginPath();
          ctx.moveTo(-W * 4, 0);
          ctx.lineTo(W * 4, 0);
          ctx.stroke();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 3.5 * scale;
          ctx.stroke();
          ctx.restore();
        }

        const notes = line.notes;
        let headIdx = line.activeNoteHeadIndex;

        while (headIdx < notes.length) {
          const n = notes[headIdx];
          const isHoldAlive = (n.type === 3 && n.headHit && !n.hit && !n.miss);
          if ((n.hit || n.miss) && !isHoldAlive) {
            headIdx++;
          } else if (curSec - n.timeSec > 0.35 && !isHoldAlive) {
            headIdx++;
          } else {
            break;
          }
        }
        line.activeNoteHeadIndex = headIdx;

        for (let i = headIdx; i < notes.length; i++) {
          const note = notes[i];
          if (note.hit) continue;

          if (!isAutoplay) {
            if (note.type !== 3 && curSec - note.timeSec > 0.18 && !note.miss) {
              note.miss = true;
              registerMiss();
              continue;
            }
            if (note.type === 3 && !note.headHit && curSec - note.timeSec > 0.18 && !note.miss) {
              note.miss = true;
              registerMiss();
              continue;
            }
          }

          const timeToHit = note.timeSec - curSec;
          if (timeToHit > 2.0) break;
          if (timeToHit < -0.25 && note.type !== 3) continue;

          const noteY = computeNoteLocalY(note, curFloorPos, curSec);
          const noteX = (note.x / 9) * (W * 0.42);

          if (Math.abs(noteY) > H * 1.5 && note.type !== 3) continue;

          ctx.save();
          ctx.translate(noteX, noteY);

          const baseWidth = 125 * scale * userNoteScale;
          const isMh = note.isMulti;

          if (note.type === 1) { // Tap
            const img = isMh ? ASSETS.images['Tap_mh'] : ASSETS.images['Tap'];
            if (img) {
              const h = baseWidth * (img.height / img.width);
              ctx.drawImage(img, -baseWidth / 2, -h / 2, baseWidth, h);
            } else {
              const h = 18 * scale * userNoteScale;
              ctx.fillStyle = isMh ? '#ffeb3b' : '#03a9f4';
              ctx.fillRect(-baseWidth / 2, -h / 2, baseWidth, h);
              ctx.strokeStyle = '#fff';
              ctx.strokeRect(-baseWidth / 2, -h / 2, baseWidth, h);
            }
          } else if (note.type === 2) { // Drag
            const img = isMh ? ASSETS.images['Drag_mh'] : ASSETS.images['Drag'];
            if (img) {
              const h = baseWidth * (img.height / img.width);
              ctx.drawImage(img, -baseWidth / 2, -h / 2, baseWidth, h);
            } else {
              const h = 15 * scale * userNoteScale;
              ctx.fillStyle = '#ffeb3b';
              ctx.fillRect(-baseWidth / 2.2, -h / 2, baseWidth / 1.1, h);
            }
          } else if (note.type === 3) { // Hold
            let holdFloorSpan = Math.abs(note.endFloor - note.startFloor);
            if (note.headHit) {
              holdFloorSpan = Math.max(0, Math.abs(note.endFloor - curFloorPos));
            }
            const holdLen = Math.max(0.01, holdFloorSpan * 380 * scale);
            const holdImg = isMh ? ASSETS.images['Hold_mh'] : ASSETS.images['Hold'];

            if (holdImg) {
              if (note.isAbove) ctx.drawImage(holdImg, -baseWidth / 2, -holdLen, baseWidth, holdLen);
              else ctx.drawImage(holdImg, -baseWidth / 2, 0, baseWidth, holdLen);
            } else {
              ctx.fillStyle = isMh ? 'rgba(255, 235, 59, 0.45)' : 'rgba(3, 169, 244, 0.4)';
              if (note.isAbove) ctx.fillRect(-baseWidth / 2, -holdLen, baseWidth, holdLen);
              else ctx.fillRect(-baseWidth / 2, 0, baseWidth, holdLen);
            }

            if (note.headHit) {
              ctx.fillStyle = isMh ? 'rgba(255, 235, 59, 0.28)' : 'rgba(0, 229, 255, 0.28)';
              ctx.beginPath();
              ctx.arc(0, 0, 36 * scale * userNoteScale, 0, Math.PI * 2);
              ctx.fill();
            }
          } else if (note.type === 4) { // Flick
            const img = isMh ? ASSETS.images['Flick_mh'] : ASSETS.images['Flick'];
            if (img) {
              const h = baseWidth * (img.height / img.width);
              ctx.drawImage(img, -baseWidth / 2, -h / 2, baseWidth, h);
            } else {
              const h = 20 * scale * userNoteScale;
              ctx.fillStyle = '#ff1744';
              ctx.fillRect(-baseWidth / 2, -h / 2, baseWidth, h);
              ctx.fillStyle = '#fff';
              ctx.fillRect(-baseWidth / 6, -h / 4, baseWidth / 3, h / 2);
            }
          }

          ctx.restore();
        }

        ctx.restore();
      }

      renderHitFX(now);

      if (bgmBuffer && curSec > bgmBuffer.duration + 0.8 && !isEnded) {
        isEnded = true;
        showResult();
      }

      requestAnimationFrame(render);
    }

    async function showResult() {
      isPlaying = false;
      if (endingBuffer) {
        const endSrc = audioCtx.createBufferSource();
        endSrc.buffer = endingBuffer;
        endSrc.connect(audioCtx.destination);
        endSrc.start(0);
      }

      const processed = perfectCount + goodCount + missCount;
      const totalScore = processed === 0 ? 0 : Math.round(((perfectCount + goodCount * 0.65) / totalNotes) * 1000000);
      const acc = processed === 0 ? 100 : (((perfectCount + goodCount * 0.65) / processed) * 100);

      // 计算本曲 rks
      const songRks = calcSongRks(acc, songMeta.difficulty);

      // 非 Autoplay 模式下保存成绩到 IndexedDB
      if (!isAutoplay && currentChartId) {
        const old = await dbGet("scores", currentChartId);
        if (!old || totalScore > old.score) {
          await dbSave("scores", {
            chartId: currentChartId,
            score: totalScore,
            acc: acc,
            rks: songRks,
            maxCombo: maxCombo,
            updateTime: Date.now()
          });
        }
        await updateOverallRks();
      }

      let rank = "F";
      let rankColor = "#f44336";
      if (totalScore === 1000000) { rank = "φ"; rankColor = "#00e5ff"; }
      else if (totalScore >= 960000) { rank = "V"; rankColor = "#ffd700"; }
      else if (totalScore >= 920000) { rank = "S"; rankColor = "#ffb300"; }
      else if (totalScore >= 880000) { rank = "A"; rankColor = "#4caf50"; }
      else if (totalScore >= 820000) { rank = "B"; rankColor = "#29b6f6"; }
      else if (totalScore >= 700000) { rank = "C"; rankColor = "#ab47bc"; }

      const rankElem = document.getElementById('res-rank');
      rankElem.innerText = rank;
      rankElem.style.color = rankColor;
      rankElem.style.textShadow = `0 0 25px ${rankColor}`;

      document.getElementById('res-title').innerText = songMeta.title;
      document.getElementById('res-score').innerText = totalScore.toString().padStart(7, '0');
      document.getElementById('res-acc').innerText = acc.toFixed(2) + '%';
      document.getElementById('res-song-rks').innerText = songRks.toFixed(2);
      document.getElementById('res-combo').innerText = maxCombo;
      document.getElementById('res-perf').innerText = perfectCount;
      document.getElementById('res-good').innerText = goodCount;
      document.getElementById('res-miss').innerText = missCount;

      const p = document.getElementById('result-panel');
      p.style.display = 'flex';
      setTimeout(() => { p.style.opacity = '1'; }, 50);
    }

    function closeResultPanel() {
      document.getElementById('result-panel').style.display = 'none';
      document.getElementById('result-panel').style.opacity = '0';
      document.getElementById('main-dashboard').style.display = 'flex';
      refreshLocalList();
    }

    // --- 7. UI 选项卡与控制绑定 ---
    document.getElementById('tab-local').onclick = () => switchTab('local');
    document.getElementById('tab-cloud').onclick = () => switchTab('cloud');
    document.getElementById('tab-settings').onclick = () => switchTab('settings');

    function switchTab(name) {
      document.getElementById('tab-local').classList.toggle('active', name === 'local');
      document.getElementById('tab-cloud').classList.toggle('active', name === 'cloud');
      document.getElementById('tab-settings').classList.toggle('active', name === 'settings');

      document.getElementById('panel-local').style.display = name === 'local' ? 'flex' : 'none';
      document.getElementById('panel-cloud').style.display = name === 'cloud' ? 'flex' : 'none';
      document.getElementById('panel-settings').style.display = name === 'settings' ? 'flex' : 'none';

      if (name === 'cloud') refreshCloudList();
      if (name === 'local') refreshLocalList();
    }

    document.getElementById('btn-refresh-cloud').onclick = refreshCloudList;

    document.getElementById('import-local-zip').onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        await processAndLoadZip(file, false);
      } catch (err) {
        alert("导入失败: " + err.message);
      }
    };

    // 自动恢复数据库中已存在的默认皮肤
    async function restoreCachedSkin() {
      const skinRecord = await dbGet("skins", "default_skin");
      if (skinRecord && skinRecord.blob) {
        await processAndLoadZip(skinRecord.blob, true);
      }
    }

    // 页面初始化
    window.onload = async () => {
      await openDatabase();
      await updateOverallRks();
      await refreshLocalList();
      await restoreCachedSkin().catch(() => {});
    };
  </script>
</body>
</html>
