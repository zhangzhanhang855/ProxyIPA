<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aether Admin Console</title>

  <!-- Google Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Display:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-main: 'Google Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Google Sans Display', var(--font-main);
      --bg-base: #090d16;
      --bg-surface: rgba(22, 30, 49, 0.7);
      --bg-surface-hover: rgba(33, 44, 71, 0.9);
      --accent-blue: #3b82f6;
      --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      --accent-glow: rgba(59, 130, 246, 0.3);
      --status-green: #10b981;
      --status-red: #ef4444;
      --status-amber: #f59e0b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-subtle: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    /* Ambient Glow */
    .ambient-glow {
      position: fixed;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(59,130,246,0.12) 0%, rgba(139,92,246,0.04) 50%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 900px;
      position: relative;
      z-index: 1;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 1.6rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      font-size: 0.7rem;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(59, 130, 246, 0.2);
      color: var(--accent-blue);
      font-weight: 700;
      text-transform: uppercase;
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 24px;
      backdrop-filter: blur(20px);
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 640px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text-main);
      font-family: var(--font-main);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--accent-blue);
    }

    .btn {
      background: var(--accent-gradient);
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      color: #fff;
      font-family: var(--font-main);
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.2);
      color: var(--status-red);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .btn-warning {
      background: rgba(245, 158, 11, 0.2);
      color: var(--status-amber);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .btn-success {
      background: rgba(16, 185, 129, 0.2);
      color: var(--status-green);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    /* Table Component */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      margin-top: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.88rem;
    }

    th {
      color: var(--text-sub);
      font-weight: 500;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-subtle);
    }

    td {
      padding: 14px;
      border-bottom: 1px solid var(--border-subtle);
      vertical-align: middle;
    }

    tr:hover td {
      background: var(--bg-surface-hover);
    }

    .code-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #fff;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 700;
    }

    .status-badge.unlocked {
      background: rgba(16, 185, 129, 0.15);
      color: var(--status-green);
    }

    .status-badge.locked {
      background: rgba(239, 68, 68, 0.15);
      color: var(--status-red);
    }

    .actions-cell {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* Login Modal Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(9, 13, 22, 0.95);
      backdrop-filter: blur(30px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 360px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid var(--border-subtle);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 0.88rem;
      color: #fff;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.25s ease;
      pointer-events: none;
      z-index: 200;
    }

    .toast.active {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>
  <div id="toast" class="toast">Notification</div>

  <!-- Admin Login Barrier -->
  <div class="modal-overlay" id="login-modal">
    <div class="login-box">
      <h2 style="font-size: 1.3rem; margin-bottom: 6px;">Admin Access</h2>
      <p style="font-size: 0.85rem; color: var(--text-sub); margin-bottom: 20px;">Enter security key to manage activation codes.</p>
      <div class="form-group">
        <label>Admin Secret Key</label>
        <input type="password" id="input-admin-key" placeholder="••••••••••••••••" />
      </div>
      <button class="btn" id="btn-login" style="width: 100%; margin-top: 8px;">Authenticate</button>
    </div>
  </div>

  <!-- Main Console -->
  <div class="container" id="main-content" style="display: none;">
    <header>
      <div class="brand-title">
        <span>Aether Console</span>
        <span class="brand-badge">PROD GATEWAY</span>
      </div>
      <button class="btn btn-secondary" id="btn-logout">Exit Session</button>
    </header>

    <!-- Generator Section -->
    <div class="card">
      <div class="card-title">
        <span>Create Activation Codes</span>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>Custom Specific Code (Optional)</label>
          <input type="text" id="gen-custom" placeholder="e.g. VIP-SPECIAL-2026" autocomplete="off" />
        </div>
        <div class="form-group">
          <label>Batch Generation Count (When custom code is empty)</label>
          <input type="number" id="gen-count" min="1" max="50" value="5" />
        </div>
      </div>
      <div style="display: flex; justify-content: flex-end; margin-top: 10px;">
        <button class="btn" id="btn-generate">Generate Codes to MongoDB</button>
      </div>
    </div>

    <!-- Active Codes List -->
    <div class="card">
      <div class="card-title">
        <div style="display: flex; align-items: center; gap: 12px;">
          <span>Database Codes</span>
          <span id="label-count" style="font-size: 0.8rem; color: var(--text-sub); font-weight: 400;">0 total</span>
        </div>
        <div style="display: flex; gap: 10px;">
          <input type="text" id="search-code" placeholder="Filter codes..." style="width: 180px; padding: 6px 12px; font-size: 0.8rem;" />
          <button class="btn btn-secondary" id="btn-refresh" style="padding: 6px 12px; font-size: 0.8rem;">Refresh</button>
        </div>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Activation Code</th>
              <th>Status</th>
              <th>Created At</th>
              <th style="text-align: right;">Operations</th>
            </tr>
          </thead>
          <tbody id="codes-table-body">
            <tr>
              <td colspan="4" style="text-align: center; color: var(--text-sub);">Loading stored keys...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // 你的 Cloudflare Worker API 域名
    const API_ENDPOINT = "https://jrmusic-premium.zhangzhanhang855.workers.dev";

    let adminKey = localStorage.getItem('aether_admin_key') || "";
    let cachedCodes = [];

    const toast = document.getElementById('toast');
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('active');
      setTimeout(() => toast.classList.remove('active'), 2500);
    }

    // 初始化检查
    async function initAuth() {
      if (adminKey) {
        const ok = await verifyKey(adminKey);
        if (ok) {
          showDashboard();
          return;
        }
      }
      document.getElementById('login-modal').style.display = 'flex';
      document.getElementById('main-content').style.display = 'none';
    }

    async function verifyKey(key) {
      try {
        const res = await fetch(`${API_ENDPOINT}/api/admin/verify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ adminKey: key })
        });
        return res.ok;
      } catch (e) {
        return false;
      }
    }

    function showDashboard() {
      document.getElementById('login-modal').style.display = 'none';
      document.getElementById('main-content').style.display = 'block';
      loadCodes();
    }

    document.getElementById('btn-login').addEventListener('click', async () => {
      const input = document.getElementById('input-admin-key').value.trim();
      if (!input) return showToast("Please input admin secret");

      const valid = await verifyKey(input);
      if (valid) {
        adminKey = input;
        localStorage.setItem('aether_admin_key', adminKey);
        showDashboard();
        showToast("Access Granted");
      } else {
        showToast("Invalid Security Key");
      }
    });

    document.getElementById('btn-logout').addEventListener('click', () => {
      adminKey = "";
      localStorage.removeItem('aether_admin_key');
      location.reload();
    });

    // 读取激活码列表
    async function loadCodes() {
      try {
        const res = await fetch(`${API_ENDPOINT}/api/admin/list-codes`, {
          headers: { 'x-admin-key': adminKey }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || "Failed to fetch list");

        cachedCodes = data.codes || [];
        renderTable(cachedCodes);
      } catch (e) {
        showToast(e.message);
      }
    }

    function renderTable(codes) {
      const tbody = document.getElementById('codes-table-body');
      tbody.innerHTML = '';
      document.getElementById('label-count').textContent = `${codes.length} active in MongoDB`;

      if (codes.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-sub); padding: 24px;">No unused activation codes found in database.</td></tr>`;
        return;
      }

      codes.forEach(item => {
        const tr = document.createElement('tr');
        const isLocked = item.isLocked;
        const dateStr = item.createdAt ? new Date(item.createdAt).toLocaleString() : '--';

        tr.innerHTML = `
          <td>
            <span class="code-text" style="${isLocked ? 'text-decoration: line-through; opacity: 0.5;' : ''}">${item.code}</span>
          </td>
          <td>
            <span class="status-badge ${isLocked ? 'locked' : 'unlocked'}">
              ${isLocked ? '● Locked' : '● Ready'}
            </span>
          </td>
          <td style="color: var(--text-sub); font-size: 0.8rem;">${dateStr}</td>
          <td style="text-align: right;">
            <div class="actions-cell" style="justify-content: flex-end;">
              <button class="btn btn-secondary copy-btn" data-code="${item.code}" style="padding: 4px 10px; font-size: 0.75rem;">Copy</button>
              <button class="btn ${isLocked ? 'btn-success' : 'btn-warning'} lock-btn" data-id="${item.id}" data-state="${isLocked}" style="padding: 4px 10px; font-size: 0.75rem;">
                ${isLocked ? 'Unlock' : 'Lock'}
              </button>
              <button class="btn btn-danger del-btn" data-id="${item.id}" style="padding: 4px 10px; font-size: 0.75rem;">Delete</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });

      // 绑定行按钮操作
      tbody.querySelectorAll('.copy-btn').forEach(b => {
        b.addEventListener('click', () => {
          navigator.clipboard.writeText(b.getAttribute('data-code'));
          showToast("Code copied to clipboard");
        });
      });

      tbody.querySelectorAll('.lock-btn').forEach(b => {
        b.addEventListener('click', () => {
          const id = b.getAttribute('data-id');
          const currentState = b.getAttribute('data-state') === 'true';
          toggleLock(id, !currentState);
        });
      });

      tbody.querySelectorAll('.del-btn').forEach(b => {
        b.addEventListener('click', () => {
          const id = b.getAttribute('data-id');
          if (confirm("Are you sure you want to permanently delete this redemption code?")) {
            deleteCode(id);
          }
        });
      });
    }

    // 创建激活码
    document.getElementById('btn-generate').addEventListener('click', async () => {
      const customCode = document.getElementById('gen-custom').value.trim();
      const count = parseInt(document.getElementById('gen-count').value, 10) || 1;

      try {
        const res = await fetch(`${API_ENDPOINT}/api/admin/create-codes`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-key': adminKey
          },
          body: JSON.stringify({ customCode, count })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || "Failed to create codes");

        showToast(data.message);
        document.getElementById('gen-custom').value = '';
        loadCodes();
      } catch (e) {
        showToast(e.message);
      }
    });

    // 切换锁定
    async function toggleLock(id, newLockState) {
      try {
        const res = await fetch(`${API_ENDPOINT}/api/admin/toggle-lock`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-key': adminKey
          },
          body: JSON.stringify({ id, isLocked: newLockState })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || "State toggle error");

        showToast(data.message);
        loadCodes();
      } catch (e) {
        showToast(e.message);
      }
    }

    // 物理删除
    async function deleteCode(id) {
      try {
        const res = await fetch(`${API_ENDPOINT}/api/admin/delete-code`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-key': adminKey
          },
          body: JSON.stringify({ id })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || "Delete failed");

        showToast(data.message);
        loadCodes();
      } catch (e) {
        showToast(e.message);
      }
    }

    // 本地搜索过滤
    document.getElementById('search-code').addEventListener('input', (e) => {
      const kw = e.target.value.trim().toLowerCase();
      if (!kw) {
        renderTable(cachedCodes);
      } else {
        const filtered = cachedCodes.filter(c => c.code.toLowerCase().includes(kw));
        renderTable(filtered);
      }
    });

    document.getElementById('btn-refresh').addEventListener('click', loadCodes);

    // 运行
    initAuth();
  </script>
</body>
</html>
