<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JR Studio - Audio Engine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 10% 20%, rgb(18, 22, 33) 0%, rgb(9, 11, 17) 90%);
      --glass-surface: rgba(26, 31, 46, 0.72);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-highlight: rgba(255, 255, 255, 0.16);
      --accent-primary: #3b82f6;
      --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      --accent-glow: rgba(59, 130, 246, 0.45);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --danger: #ef4444;
      --success: #10b981;
      --sidebar-width: 340px;
      --control-bar-height: 96px;
      --safe-area-bottom: env(safe-area-inset-bottom, 0px);
      --safe-area-top: env(safe-area-inset-top, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding-top: var(--safe-area-top);
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.1);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Layout Components */
    .app-viewport {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* Sidebar / Playlist */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--glass-surface);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-right: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      z-index: 20;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sidebar-header {
      padding: 24px 20px 16px 20px;
      border-bottom: 1px solid var(--glass-border);
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-sub {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .action-panel {
      padding: 16px 20px;
      display: flex;
      gap: 10px;
    }

    .import-btn {
      flex: 1;
      background: var(--accent-gradient);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px var(--accent-glow);
      transition: all 0.2s ease;
    }

    .import-btn:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    .clear-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .clear-btn:hover {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
    }

    .track-list-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
    }

    .track-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 4px;
      cursor: pointer;
      transition: background 0.15s ease;
      position: relative;
    }

    .track-item:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .track-item.active {
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.28);
    }

    .track-thumb {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 0.8rem;
    }

    .track-info {
      flex: 1;
      min-width: 0;
    }

    .track-title {
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-main);
    }

    .track-item.active .track-title {
      color: #60a5fa;
    }

    .track-artist {
      font-size: 0.75rem;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .track-delete {
      background: transparent;
      border: none;
      color: var(--text-dim);
      padding: 6px;
      cursor: pointer;
      border-radius: 6px;
      opacity: 0;
      transition: opacity 0.2s, color 0.2s;
    }

    .track-item:hover .track-delete {
      opacity: 1;
    }

    .track-delete:hover {
      color: var(--danger);
    }

    /* Main Stage */
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background: radial-gradient(circle at 50% 50%, rgba(30, 41, 59, 0.4) 0%, rgba(15, 23, 42, 0) 70%);
      overflow: hidden;
    }

    .stage-canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    #visualizer-canvas {
      width: 100%;
      height: 100%;
      opacity: 0.7;
    }

    .stage-content {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      gap: 32px;
    }

    .album-art-deck {
      position: relative;
      width: 280px;
      height: 280px;
      max-width: 60vw;
      max-height: 60vw;
    }

    .album-art-shadow {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      bottom: -10px;
      border-radius: 24px;
      background-size: cover;
      background-position: center;
      filter: blur(28px);
      opacity: 0.45;
      z-index: 1;
      transition: all 0.4s ease;
    }

    .album-art-main {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-highlight);
      background-size: cover;
      background-position: center;
      z-index: 2;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .album-art-placeholder {
      font-size: 3rem;
      color: rgba(255, 255, 255, 0.2);
    }

    .hero-meta {
      text-align: center;
      max-width: 520px;
    }

    .hero-title {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 6px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
    }

    .hero-artist {
      font-size: 1.05rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .hero-album {
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-top: 4px;
    }

    /* Bottom Player Deck */
    .player-deck {
      height: calc(var(--control-bar-height) + var(--safe-area-bottom));
      padding-bottom: var(--safe-area-bottom);
      background: var(--glass-surface);
      backdrop-filter: blur(32px) saturate(200%);
      -webkit-backdrop-filter: blur(32px) saturate(200%);
      border-top: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 24px;
      padding-right: 24px;
      position: relative;
      z-index: 30;
    }

    .deck-section-left {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 25%;
      min-width: 180px;
    }

    .deck-thumb {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
    }

    .deck-meta {
      overflow: hidden;
    }

    .deck-title {
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .deck-artist {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .deck-section-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 48%;
      max-width: 680px;
    }

    .playback-controls {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 8px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border-radius: 50%;
      transition: all 0.15s ease;
    }

    .ctrl-btn:hover {
      color: var(--text-main);
    }

    .ctrl-btn.active {
      color: var(--accent-primary);
    }

    .play-pause-btn {
      width: 44px;
      height: 44px;
      background: var(--text-main);
      color: #0f172a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .play-pause-btn:active {
      transform: scale(0.92);
    }

    .scrub-wrapper {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .scrub-time {
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
      color: var(--text-dim);
      min-width: 40px;
      text-align: center;
    }

    .slider-track {
      position: relative;
      flex: 1;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      cursor: pointer;
      outline: none;
      display: flex;
      align-items: center;
    }

    .slider-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background: var(--accent-gradient);
      border-radius: 3px;
      pointer-events: none;
      width: 0%;
    }

    .slider-thumb {
      position: absolute;
      top: 50%;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffffff;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      left: 0%;
      transition: transform 0.1s ease;
    }

    .slider-track:hover .slider-thumb {
      transform: translate(-50%, -50%) scale(1.2);
    }

    .deck-section-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      width: 25%;
      min-width: 160px;
    }

    .vol-wrapper {
      width: 90px;
      display: flex;
      align-items: center;
    }

    /* Modal / Diagnostics Overlays */
    .status-toast {
      position: fixed;
      top: calc(var(--safe-area-top) + 20px);
      right: 20px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      padding: 12px 18px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 100;
      transform: translateY(-80px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .status-toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .status-toast .icon {
      font-size: 1.2rem;
    }

    .hidden-file-input {
      display: none;
    }

    /* Responsive Queries */
    @media (max-width: 768px) {
      .sidebar {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .deck-section-left {
        display: none;
      }
      .deck-section-center {
        width: 100%;
      }
      .deck-section-right {
        display: none;
      }
      .mobile-menu-btn {
        display: block !important;
      }
    }

    .mobile-menu-btn {
      display: none;
      position: absolute;
      top: calc(var(--safe-area-top) + 16px);
      left: 16px;
      z-index: 10;
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      padding: 8px 12px;
      border-radius: 10px;
      color: var(--text-main);
      backdrop-filter: blur(12px);
    }
  </style>
</head>
<body>

  <button class="mobile-menu-btn" id="sidebar-toggle-btn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
  </button>

  <div class="app-viewport">
    <!-- Sidebar / Local IndexedDB Library -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand-title">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
          JR Audio Vault
        </div>
        <div class="brand-sub">Encrypted Storage & Engine</div>
      </div>

      <div class="action-panel">
        <button class="import-btn" id="import-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          Import .jrmusic
        </button>
        <button class="clear-btn" id="clear-db-btn" title="Clear Library">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </button>
      </div>

      <div class="track-list-container" id="track-list">
        <!-- Dynamic track items loaded from IndexedDB -->
      </div>
    </aside>

    <!-- Main Stage / Visualizer & Cover -->
    <main class="stage">
      <div class="stage-canvas-container">
        <canvas id="visualizer-canvas"></canvas>
      </div>

      <div class="stage-content">
        <div class="album-art-deck">
          <div class="album-art-shadow" id="hero-art-shadow"></div>
          <div class="album-art-main" id="hero-art-main">
            <span class="album-art-placeholder" id="hero-art-placeholder">♪</span>
          </div>
        </div>

        <div class="hero-meta">
          <h1 class="hero-title" id="stage-title">Ready to Decode</h1>
          <div class="hero-artist" id="stage-artist">Import encrypted .jrmusic tracks to initiate</div>
          <div class="hero-album" id="stage-album">IndexedDB Sandboxed Container</div>
        </div>
      </div>
    </main>
  </div>

  <!-- Bottom Control Deck -->
  <footer class="player-deck">
    <div class="deck-section-left">
      <div class="deck-thumb" id="deck-thumb"></div>
      <div class="deck-meta">
        <div class="deck-title" id="deck-title">No Track Active</div>
        <div class="deck-artist" id="deck-artist">Select audio</div>
      </div>
    </div>

    <div class="deck-section-center">
      <div class="playback-controls">
        <button class="ctrl-btn" id="shuffle-btn" title="Shuffle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
        </button>
        <button class="ctrl-btn" id="prev-btn" title="Previous">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
        </button>
        <button class="play-pause-btn" id="play-pause-btn" title="Play">
          <svg id="play-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          <svg id="pause-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display: none;"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
        </button>
        <button class="ctrl-btn" id="next-btn" title="Next">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
        </button>
        <button class="ctrl-btn" id="loop-btn" title="Loop Mode">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
        </button>
      </div>

      <div class="scrub-wrapper">
        <span class="scrub-time" id="cur-time">0:00</span>
        <div class="slider-track" id="timeline-track">
          <div class="slider-fill" id="timeline-fill"></div>
          <div class="slider-thumb" id="timeline-thumb"></div>
        </div>
        <span class="scrub-time" id="dur-time">0:00</span>
      </div>
    </div>

    <div class="deck-section-right">
      <button class="ctrl-btn" id="mute-btn">
        <svg id="vol-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
      </button>
      <div class="vol-wrapper">
        <div class="slider-track" id="volume-track">
          <div class="slider-fill" id="volume-fill" style="width: 80%;"></div>
          <div class="slider-thumb" id="volume-thumb" style="left: 80%;"></div>
        </div>
      </div>
    </div>
  </footer>

  <div class="status-toast" id="toast">
    <div class="icon" id="toast-icon">⚡</div>
    <div class="text" id="toast-msg">Operation completed</div>
  </div>

  <input type="file" id="file-picker" class="hidden-file-input" accept=".jrmusic" multiple>

  <script>
    /**
     * =========================================================================
     * CORE SUBSYSTEM 1: PROTOCOL SPECIFICATION & CRYPTOGRAPHIC DECODER
     * =========================================================================
     * Standard Specification:
     * - Protocol Identifier: "JRMUSIC_ENC_V1:"
     * - Layer 1 Transformation: RFC 4648 Base32 Encoding (Uppercase/Padded/Unpadded)
     * - Layer 2 Transformation: Standard RFC 4648 Base64 Encoding
     * - Final Payload: Binary Audio Stream (MPEG Layer-3 / FLAC / AAC / ALAC)
     */
    class JRMusicSecurityEngine {
      static HEADER = "JRMUSIC_ENC_V1:";
      static BASE32_ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";

      /**
       * Decodes RFC 4648 Base32 encoded ASCII string into raw byte array.
       * @param {string} input 
       * @returns {Uint8Array}
       */
      static decodeBase32(input) {
        const clean = input.toUpperCase().replace(/[=\s]/g, '');
        let bits = 0;
        let value = 0;
        let index = 0;
        const output = new Uint8Array(Math.floor((clean.length * 5) / 8));

        for (let i = 0; i < clean.length; i++) {
          const char = clean[i];
          const val = this.BASE32_ALPHABET.indexOf(char);
          if (val === -1) {
            throw new Error(`Base32 decoding violation: Illegal character sequence '${char}' encountered.`);
          }

          value = (value << 5) | val;
          bits += 5;

          if (bits >= 8) {
            bits -= 8;
            output[index++] = (value >>> bits) & 0xFF;
          }
        }
        return output.subarray(0, index);
      }

      /**
       * Parses and decrypts .jrmusic dual-layer envelope.
       * @param {ArrayBuffer} buffer 
       * @returns {Promise<Blob>}
       */
      static async decrypt(buffer) {
        const decoder = new TextDecoder("utf-8");
        const rawContent = decoder.decode(buffer).trim();

        if (!rawContent.startsWith(this.HEADER)) {
          throw new Error("Invalid format signature. Missing 'JRMUSIC_ENC_V1:' header token.");
        }

        const base32Layer = rawContent.slice(this.HEADER.length).trim();
        const base64Bytes = this.decodeBase32(base32Layer);
        const base64String = decoder.decode(base64Bytes);

        // Standard Base64 decode to binary
        const binaryRaw = atob(base64String.replace(/\s/g, ''));
        const len = binaryRaw.length;
        const audioBuffer = new Uint8Array(len);

        for (let i = 0; i < len; i++) {
          audioBuffer[i] = binaryRaw.charCodeAt(i);
        }

        // Determine MIME signature from byte header
        let mime = "audio/mpeg";
        if (len > 4) {
          if (audioBuffer[0] === 0x66 && audioBuffer[1] === 0x4C && audioBuffer[2] === 0x61 && audioBuffer[3] === 0x43) {
            mime = "audio/flac";
          } else if (audioBuffer[0] === 0x4F && audioBuffer[1] === 0x67 && audioBuffer[2] === 0x67 && audioBuffer[3] === 0x53) {
            mime = "audio/ogg";
          } else if (audioBuffer[4] === 0x66 && audioBuffer[5] === 0x74 && audioBuffer[6] === 0x79 && audioBuffer[7] === 0x70) {
            mime = "audio/mp4";
          }
        }

        return new Blob([audioBuffer], { type: mime });
      }
    }

    /**
     * =========================================================================
     * CORE SUBSYSTEM 2: ID3V2 / AUDIO METADATA EXTRACTION PIPELINE
     * =========================================================================
     */
    class ID3Parser {
      static async extract(blob) {
        const slice = blob.slice(0, 1024 * 512); // Sample first 512KB for headers
        const buffer = await slice.arrayBuffer();
        const view = new DataView(buffer);

        const metadata = {
          title: "Unknown Title",
          artist: "Unknown Artist",
          album: "Decrypted Session",
          pictureUrl: null
        };

        if (buffer.byteLength < 10) return metadata;

        // Check for 'ID3' marker
        if (view.getUint8(0) === 0x49 && view.getUint8(1) === 0x44 && view.getUint8(2) === 0x33) {
          const version = view.getUint8(3);
          const tagSize = ((view.getUint8(6) & 0x7f) << 21) |
                         ((view.getUint8(7) & 0x7f) << 14) |
                         ((view.getUint8(8) & 0x7f) << 7) |
                         (view.getUint8(9) & 0x7f);

          let offset = 10;
          const end = Math.min(tagSize + 10, buffer.byteLength);

          while (offset < end - 10) {
            let frameID = "";
            for (let i = 0; i < 4; i++) {
              frameID += String.fromCharCode(view.getUint8(offset + i));
            }

            if (frameID.charCodeAt(0) === 0) break;

            let frameSize = 0;
            if (version === 4) {
              frameSize = ((view.getUint8(offset + 4) & 0x7f) << 21) |
                          ((view.getUint8(offset + 5) & 0x7f) << 14) |
                          ((view.getUint8(offset + 6) & 0x7f) << 7) |
                          (view.getUint8(offset + 7) & 0x7f);
            } else {
              frameSize = view.getUint32(offset + 4);
            }

            offset += 10;
            if (frameSize <= 0 || offset + frameSize > buffer.byteLength) break;

            const frameBytes = new Uint8Array(buffer, offset, frameSize);

            try {
              if (frameID === "TIT2") {
                metadata.title = this.decodeTextFrame(frameBytes);
              } else if (frameID === "TPE1") {
                metadata.artist = this.decodeTextFrame(frameBytes);
              } else if (frameID === "TALB") {
                metadata.album = this.decodeTextFrame(frameBytes);
              } else if (frameID === "APIC" && !metadata.pictureUrl) {
                const picData = this.decodeAPIC(frameBytes);
                if (picData) metadata.pictureUrl = picData;
              }
            } catch (err) {
              console.warn("Frame parse warning", frameID, err);
            }

            offset += frameSize;
          }
        }
        return metadata;
      }

      static decodeTextFrame(bytes) {
        if (!bytes || bytes.length <= 1) return "";
        const encoding = bytes[0];
        const data = bytes.subarray(1);
        if (encoding === 0) {
          let s = "";
          for (let i = 0; i < data.length; i++) {
            if (data[i] === 0) break;
            s += String.fromCharCode(data[i]);
          }
          return s;
        } else if (encoding === 1 || encoding === 2) {
          const dec = new TextDecoder("utf-16");
          return dec.decode(data).replace(/\0.*$/g, '');
        } else if (encoding === 3) {
          const dec = new TextDecoder("utf-8");
          return dec.decode(data).replace(/\0.*$/g, '');
        }
        return "";
      }

      static decodeAPIC(bytes) {
        try {
          let ptr = 1;
          while (ptr < bytes.length && bytes[ptr] !== 0) ptr++;
          const mime = new TextDecoder("iso-8859-1").decode(bytes.subarray(1, ptr));
          ptr += 2; // pass picture type
          while (ptr < bytes.length && bytes[ptr] !== 0) ptr++;
          ptr++; // pass description null
          const imgBlob = new Blob([bytes.subarray(ptr)], { type: mime || "image/jpeg" });
          return URL.createObjectURL(imgBlob);
        } catch (e) {
          return null;
        }
      }
    }

    /**
     * =========================================================================
     * CORE SUBSYSTEM 3: INDEXEDDB PERSISTENCE SUBSYSTEM (IPA CONTAINER READY)
     * =========================================================================
     */
    class JRStorageEngine {
      static DB_NAME = "JR_Music_Persistent_Vault";
      static DB_VERSION = 1;
      static STORE_NAME = "audio_tracks";

      static async open() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(this.DB_NAME, this.DB_VERSION);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(this.STORE_NAME)) {
              const store = db.createObjectStore(this.STORE_NAME, { keyPath: "id", autoIncrement: true });
              store.createIndex("title", "title", { unique: false });
              store.createIndex("importedAt", "importedAt", { unique: false });
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      static async saveTrack(record) {
        const db = await this.open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(this.STORE_NAME, "readwrite");
          const store = tx.objectStore(this.STORE_NAME);
          const req = store.add(record);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      static async getAllTracks() {
        const db = await this.open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(this.STORE_NAME, "readonly");
          const store = tx.objectStore(this.STORE_NAME);
          const req = store.getAll();
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      static async deleteTrack(id) {
        const db = await this.open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(this.STORE_NAME, "readwrite");
          const store = tx.objectStore(this.STORE_NAME);
          const req = store.delete(id);
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error);
        });
      }

      static async clear() {
        const db = await this.open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(this.STORE_NAME, "readwrite");
          const store = tx.objectStore(this.STORE_NAME);
          const req = store.clear();
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error);
        });
      }
    }

    /**
     * =========================================================================
     * CORE SUBSYSTEM 4: WEB AUDIO API DISPATCHER & VISUALIZER
     * =========================================================================
     */
    class AudioPipelineEngine {
      constructor() {
        this.audioEl = new Audio();
        this.audioEl.crossOrigin = "anonymous";
        this.audioEl.preload = "auto";
        this.audioCtx = null;
        this.analyser = null;
        this.sourceNode = null;
        this.gainNode = null;
        this.isInitialized = false;

        this.canvas = document.getElementById("visualizer-canvas");
        this.ctx = this.canvas.getContext("2d");
        this.animationId = null;

        window.addEventListener("resize", () => this.resizeCanvas());
        this.resizeCanvas();
      }

      ensureContext() {
        if (!this.isInitialized) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.audioCtx = new AudioContext();
          this.analyser = this.audioCtx.createAnalyser();
          this.analyser.fftSize = 512;
          this.analyser.smoothingTimeConstant = 0.85;

          this.gainNode = this.audioCtx.createGain();

          this.sourceNode = this.audioCtx.createMediaElementSource(this.audioEl);
          this.sourceNode.connect(this.analyser);
          this.analyser.connect(this.gainNode);
          this.gainNode.connect(this.audioCtx.destination);

          this.isInitialized = true;
          this.startRenderLoop();
        }

        if (this.audioCtx.state === "suspended") {
          this.audioCtx.resume();
        }
      }

      resizeCanvas() {
        this.canvas.width = this.canvas.offsetWidth * window.devicePixelRatio;
        this.canvas.height = this.canvas.offsetHeight * window.devicePixelRatio;
      }

      startRenderLoop() {
        const bufferLength = this.analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        const render = () => {
          this.animationId = requestAnimationFrame(render);
          this.analyser.getByteFrequencyData(dataArray);

          const width = this.canvas.width;
          const height = this.canvas.height;
          this.ctx.clearRect(0, 0, width, height);

          const barCount = 64;
          const barWidth = (width / barCount) * 0.75;
          const gap = (width / barCount) * 0.25;

          for (let i = 0; i < barCount; i++) {
            const rawIndex = Math.floor(Math.pow(i / barCount, 1.4) * (bufferLength * 0.65));
            const value = dataArray[rawIndex] || 0;
            const percent = value / 255;
            const barHeight = percent * (height * 0.45);

            const x = i * (barWidth + gap) + gap / 2;
            const y = height - barHeight;

            const grad = this.ctx.createLinearGradient(0, height, 0, y);
            grad.addColorStop(0, "rgba(59, 130, 246, 0.05)");
            grad.addColorStop(0.5, "rgba(139, 92, 246, 0.45)");
            grad.addColorStop(1, "rgba(96, 165, 250, 0.85)");

            this.ctx.fillStyle = grad;
            this.ctx.beginPath();
            this.ctx.roundRect(x, y, barWidth, barHeight, [4, 4, 0, 0]);
            this.ctx.fill();
          }
        };
        render();
      }

      setVolume(val) {
        if (this.gainNode) {
          this.gainNode.gain.setValueAtTime(val, this.audioCtx.currentTime);
        } else {
          this.audioEl.volume = val;
        }
      }
    }

    /**
     * =========================================================================
     * CORE SUBSYSTEM 5: PLAYBACK CONTROLLER & APPLICATION STATE
     * =========================================================================
     */
    class ApplicationController {
      constructor() {
        this.audioPipeline = new AudioPipelineEngine();
        this.tracks = [];
        this.currentIndex = -1;
        this.isPlaying = false;
        this.isShuffled = false;
        this.loopMode = 0; // 0: off, 1: repeat-all, 2: repeat-one
        this.currentBlobUrl = null;

        this.dom = {
          filePicker: document.getElementById("file-picker"),
          importBtn: document.getElementById("import-btn"),
          clearBtn: document.getElementById("clear-db-btn"),
          trackList: document.getElementById("track-list"),
          playPauseBtn: document.getElementById("play-pause-btn"),
          playIcon: document.getElementById("play-icon"),
          pauseIcon: document.getElementById("pause-icon"),
          prevBtn: document.getElementById("prev-btn"),
          nextBtn: document.getElementById("next-btn"),
          shuffleBtn: document.getElementById("shuffle-btn"),
          loopBtn: document.getElementById("loop-btn"),
          muteBtn: document.getElementById("mute-btn"),
          timelineTrack: document.getElementById("timeline-track"),
          timelineFill: document.getElementById("timeline-fill"),
          timelineThumb: document.getElementById("timeline-thumb"),
          curTime: document.getElementById("cur-time"),
          durTime: document.getElementById("dur-time"),
          volumeTrack: document.getElementById("volume-track"),
          volumeFill: document.getElementById("volume-fill"),
          volumeThumb: document.getElementById("volume-thumb"),
          volIcon: document.getElementById("vol-icon"),
          deckThumb: document.getElementById("deck-thumb"),
          deckTitle: document.getElementById("deck-title"),
          deckArtist: document.getElementById("deck-artist"),
          stageTitle: document.getElementById("stage-title"),
          stageArtist: document.getElementById("stage-artist"),
          stageAlbum: document.getElementById("stage-album"),
          heroArtMain: document.getElementById("hero-art-main"),
          heroArtShadow: document.getElementById("hero-art-shadow"),
          heroArtPlaceholder: document.getElementById("hero-art-placeholder"),
          sidebar: document.getElementById("sidebar"),
          sidebarToggle: document.getElementById("sidebar-toggle-btn"),
          toast: document.getElementById("toast"),
          toastMsg: document.getElementById("toast-msg"),
          toastIcon: document.getElementById("toast-icon")
        };

        this.init();
      }

      async init() {
        this.bindEvents();
        await this.syncTracksFromDatabase();
      }

      showToast(msg, icon = "⚡") {
        this.dom.toastMsg.textContent = msg;
        this.dom.toastIcon.textContent = icon;
        this.dom.toast.classList.add("show");
        setTimeout(() => this.dom.toast.classList.remove("show"), 3200);
      }

      formatTime(seconds) {
        if (!seconds || isNaN(seconds)) return "0:00";
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      }

      bindEvents() {
        // UI Navigation & Imports
        this.dom.importBtn.addEventListener("click", () => this.dom.filePicker.click());
        this.dom.filePicker.addEventListener("change", (e) => this.handleFileSelection(e));
        this.dom.clearBtn.addEventListener("click", () => this.clearLibrary());

        this.dom.sidebarToggle.addEventListener("click", () => {
          this.dom.sidebar.classList.toggle("open");
        });

        // Transport buttons
        this.dom.playPauseBtn.addEventListener("click", () => this.togglePlayPause());
        this.dom.prevBtn.addEventListener("click", () => this.playPrevious());
        this.dom.nextBtn.addEventListener("click", () => this.playNext());

        this.dom.shuffleBtn.addEventListener("click", () => {
          this.isShuffled = !this.isShuffled;
          this.dom.shuffleBtn.classList.toggle("active", this.isShuffled);
          this.showToast(this.isShuffled ? "Shuffle Enabled" : "Shuffle Disabled");
        });

        this.dom.loopBtn.addEventListener("click", () => {
          this.loopMode = (this.loopMode + 1) % 3;
          this.dom.loopBtn.classList.toggle("active", this.loopMode > 0);
          const modes = ["Loop: Disabled", "Loop: All Tracks", "Loop: Single Track"];
          this.showToast(modes[this.loopMode]);
        });

        // Audio tag lifecycle
        this.audioPipeline.audioEl.addEventListener("timeupdate", () => this.handleTimeUpdate());
        this.audioPipeline.audioEl.addEventListener("ended", () => this.handleTrackEnded());
        this.audioPipeline.audioEl.addEventListener("loadedmetadata", () => {
          this.dom.durTime.textContent = this.formatTime(this.audioPipeline.audioEl.duration);
        });

        // Scrubbing
        this.initSlider(this.dom.timelineTrack, (percent) => {
          if (!this.audioPipeline.audioEl.duration) return;
          const target = percent * this.audioPipeline.audioEl.duration;
          this.audioPipeline.audioEl.currentTime = target;
        });

        // Volume
        this.initSlider(this.dom.volumeTrack, (percent) => {
          this.audioPipeline.setVolume(percent);
          this.dom.volumeFill.style.width = `${percent * 100}%`;
          this.dom.volumeThumb.style.left = `${percent * 100}%`;
        });
      }

      initSlider(element, onChange) {
        let isDragging = false;
        const calculateProgress = (e) => {
          const rect = element.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          let percent = (clientX - rect.left) / rect.width;
          percent = Math.max(0, Math.min(1, percent));
          onChange(percent);
        };

        const onStart = (e) => {
          isDragging = true;
          calculateProgress(e);
        };
        const onMove = (e) => {
          if (isDragging) calculateProgress(e);
        };
        const onEnd = () => {
          isDragging = false;
        };

        element.addEventListener("mousedown", onStart);
        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onEnd);

        element.addEventListener("touchstart", onStart, { passive: false });
        window.addEventListener("touchmove", onMove, { passive: false });
        window.addEventListener("touchend", onEnd);
      }

      async syncTracksFromDatabase() {
        try {
          this.tracks = await JRStorageEngine.getAllTracks();
          this.renderLibraryList();
        } catch (e) {
          console.error("IndexedDB Sync failure", e);
          this.showToast("Local Library Access Failed", "⚠️");
        }
      }

      renderLibraryList() {
        this.dom.trackList.innerHTML = "";
        if (this.tracks.length === 0) {
          this.dom.trackList.innerHTML = `
            <div style="padding: 32px 16px; text-align: center; color: var(--text-dim); font-size: 0.82rem;">
              Vault is empty.<br>Import .jrmusic files above.
            </div>`;
          return;
        }

        this.tracks.forEach((track, index) => {
          const item = document.createElement("div");
          item.className = `track-item ${this.currentIndex === index ? 'active' : ''}`;

          const thumbStyle = track.pictureBlob
            ? `style="background-image: url('${URL.createObjectURL(track.pictureBlob)}');"`
            : "";

          item.innerHTML = `
            <div class="track-thumb" ${thumbStyle}>${!track.pictureBlob ? '♪' : ''}</div>
            <div class="track-info">
              <div class="track-title">${this.escapeHTML(track.title)}</div>
              <div class="track-artist">${this.escapeHTML(track.artist)}</div>
            </div>
            <button class="track-delete" data-id="${track.id}">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          `;

          item.addEventListener("click", (e) => {
            if (e.target.closest(".track-delete")) return;
            this.playTrackAtIndex(index);
          });

          const delBtn = item.querySelector(".track-delete");
          delBtn.addEventListener("click", async (e) => {
            e.stopPropagation();
            await JRStorageEngine.deleteTrack(track.id);
            await this.syncTracksFromDatabase();
            if (this.currentIndex === index) {
              this.stopPlayback();
            }
          });

          this.dom.trackList.appendChild(item);
        });
      }

      escapeHTML(str) {
        return (str || "").replace(/[&<>'"]/g, 
          tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
      }

      async handleFileSelection(e) {
        const files = Array.from(e.target.files);
        if (!files.length) return;

        this.showToast(`Importing ${files.length} payload(s)...`);

        let importedCount = 0;
        for (const file of files) {
          try {
            const arrayBuf = await file.arrayBuffer();
            const decryptedBlob = await JRMusicSecurityEngine.decrypt(arrayBuf);
            const meta = await ID3Parser.extract(decryptedBlob);

            let pictureBlob = null;
            if (meta.pictureUrl) {
              const res = await fetch(meta.pictureUrl);
              pictureBlob = await res.blob();
            }

            const record = {
              title: meta.title !== "Unknown Title" ? meta.title : file.name.replace(/\.jrmusic$/i, ''),
              artist: meta.artist,
              album: meta.album,
              audioBlob: decryptedBlob,
              pictureBlob: pictureBlob,
              filename: file.name,
              importedAt: Date.now()
            };

            await JRStorageEngine.saveTrack(record);
            importedCount++;
          } catch (err) {
            console.error("Decode failed for " + file.name, err);
            this.showToast(`Error decoding: ${file.name}`, "❌");
          }
        }

        e.target.value = "";
        await this.syncTracksFromDatabase();
        this.showToast(`Successfully decoded ${importedCount} tracks`, "✅");

        if (this.currentIndex === -1 && this.tracks.length > 0) {
          this.playTrackAtIndex(0);
        }
      }

      async playTrackAtIndex(index) {
        if (index < 0 || index >= this.tracks.length) return;
        this.currentIndex = index;
        const track = this.tracks[index];

        this.audioPipeline.ensureContext();

        if (this.currentBlobUrl) {
          URL.revokeObjectURL(this.currentBlobUrl);
        }

        this.currentBlobUrl = URL.createObjectURL(track.audioBlob);
        this.audioPipeline.audioEl.src = this.currentBlobUrl;

        try {
          await this.audioPipeline.audioEl.play();
          this.isPlaying = true;
          this.updatePlaybackControls();
        } catch (e) {
          console.warn("Autoplay prevention intercepted", e);
        }

        this.updateMetadataViews(track);
        this.renderLibraryList();
      }

      updateMetadataViews(track) {
        // Stage update
        this.dom.stageTitle.textContent = track.title;
        this.dom.stageArtist.textContent = track.artist;
        this.dom.stageAlbum.textContent = track.album;

        // Player deck update
        this.dom.deckTitle.textContent = track.title;
        this.dom.deckArtist.textContent = track.artist;

        if (track.pictureBlob) {
          const picUrl = URL.createObjectURL(track.pictureBlob);
          this.dom.heroArtMain.style.backgroundImage = `url('${picUrl}')`;
          this.dom.heroArtShadow.style.backgroundImage = `url('${picUrl}')`;
          this.dom.deckThumb.style.backgroundImage = `url('${picUrl}')`;
          this.dom.heroArtPlaceholder.style.display = "none";
        } else {
          this.dom.heroArtMain.style.backgroundImage = "none";
          this.dom.heroArtShadow.style.backgroundImage = "none";
          this.dom.deckThumb.style.backgroundImage = "none";
          this.dom.heroArtPlaceholder.style.display = "block";
        }
      }

      togglePlayPause() {
        if (this.currentIndex === -1 && this.tracks.length > 0) {
          this.playTrackAtIndex(0);
          return;
        }

        this.audioPipeline.ensureContext();

        if (this.audioPipeline.audioEl.paused) {
          this.audioPipeline.audioEl.play();
          this.isPlaying = true;
        } else {
          this.audioPipeline.audioEl.pause();
          this.isPlaying = false;
        }
        this.updatePlaybackControls();
      }

      stopPlayback() {
        this.audioPipeline.audioEl.pause();
        this.audioPipeline.audioEl.currentTime = 0;
        this.isPlaying = false;
        this.currentIndex = -1;
        this.updatePlaybackControls();

        this.dom.stageTitle.textContent = "Vault Idle";
        this.dom.stageArtist.textContent = "Select track to begin";
        this.dom.stageAlbum.textContent = "Sandboxed Container";
        this.dom.deckTitle.textContent = "No Track Active";
        this.dom.deckArtist.textContent = "Select audio";
        this.dom.heroArtMain.style.backgroundImage = "none";
        this.dom.heroArtShadow.style.backgroundImage = "none";
        this.dom.deckThumb.style.backgroundImage = "none";
        this.dom.heroArtPlaceholder.style.display = "block";
      }

      updatePlaybackControls() {
        if (this.isPlaying) {
          this.dom.playIcon.style.display = "none";
          this.dom.pauseIcon.style.display = "block";
        } else {
          this.dom.playIcon.style.display = "block";
          this.dom.pauseIcon.style.display = "none";
        }
      }

      handleTimeUpdate() {
        const cur = this.audioPipeline.audioEl.currentTime;
        const dur = this.audioPipeline.audioEl.duration;
        this.dom.curTime.textContent = this.formatTime(cur);

        if (dur) {
          const percent = (cur / dur) * 100;
          this.dom.timelineFill.style.width = `${percent}%`;
          this.dom.timelineThumb.style.left = `${percent}%`;
        }
      }

      handleTrackEnded() {
        if (this.loopMode === 2) {
          // Single track loop
          this.audioPipeline.audioEl.currentTime = 0;
          this.audioPipeline.audioEl.play();
        } else if (this.loopMode === 1 || this.currentIndex < this.tracks.length - 1) {
          this.playNext();
        } else {
          this.isPlaying = false;
          this.updatePlaybackControls();
        }
      }

      playNext() {
        if (this.tracks.length === 0) return;
        if (this.isShuffled) {
          const next = Math.floor(Math.random() * this.tracks.length);
          this.playTrackAtIndex(next);
        } else {
          const next = (this.currentIndex + 1) % this.tracks.length;
          this.playTrackAtIndex(next);
        }
      }

      playPrevious() {
        if (this.tracks.length === 0) return;
        if (this.audioPipeline.audioEl.currentTime > 3) {
          this.audioPipeline.audioEl.currentTime = 0;
          return;
        }
        const prev = (this.currentIndex - 1 + this.tracks.length) % this.tracks.length;
        this.playTrackAtIndex(prev);
      }

      async clearLibrary() {
        if (confirm("Purge all imported audio from the local IndexedDB sandboxed vault?")) {
          await JRStorageEngine.clear();
          this.stopPlayback();
          await this.syncTracksFromDatabase();
          this.showToast("Library Purged", "🗑️");
        }
      }
    }

    // Engine Bootstrap
    window.addEventListener("DOMContentLoaded", () => {
      window.app = new ApplicationController();
    });
  </script>
</body>
</html>
