<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>JR OS - Desktop Operating System for iPadOS</title>
  <style>
    /* ==========================================================================
       SECTION 1: GLOBAL CSS VARIABLES & FLUENT MICA MATERIAL ENGINE
       ========================================================================== */
    :root {
      --font-system: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-code: "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      
      --accent-color: #0078d4;
      --accent-light: #2b88d8;
      --accent-dark: #004578;
      --accent-alpha: rgba(0, 120, 212, 0.28);
      
      --bg-mica-surface: rgba(30, 30, 30, 0.82);
      --bg-mica-alt: rgba(38, 38, 38, 0.74);
      --bg-acrylic: rgba(42, 42, 42, 0.65);
      --bg-card: rgba(52, 52, 52, 0.55);
      --bg-card-hover: rgba(65, 65, 65, 0.65);
      
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-standard: rgba(255, 255, 255, 0.12);
      --border-accent: rgba(0, 120, 212, 0.45);
      
      --text-primary: #f8f8f8;
      --text-secondary: #a8a8aa;
      --text-disabled: #626266;
      --text-accent: #60cdff;
      
      --shadow-window: 0 24px 54px rgba(0, 0, 0, 0.65), 0 6px 18px rgba(0, 0, 0, 0.4);
      --shadow-popup: 0 18px 40px rgba(0, 0, 0, 0.55);
      --shadow-taskbar: 0 -4px 16px rgba(0, 0, 0, 0.35);
      
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 18px;
      
      --taskbar-height: 52px;
      --titlebar-height: 38px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      font-family: var(--font-system);
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
      color: var(--text-primary);
      padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
      position: fixed;
    }

    /* ==========================================================================
       SECTION 2: DESKTOP SURFACE & WORKSPACE
       ========================================================================== */
    #desktop-viewport {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: calc(100vh - var(--taskbar-height));
      background: radial-gradient(circle at 50% 25%, #18283f 0%, #0c121c 65%, #05070a 100%);
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }

    .desktop-shortcut-grid {
      position: absolute;
      top: 24px;
      left: 24px;
      display: flex;
      flex-direction: column;
      flex-wrap: wrap;
      gap: 16px;
      height: calc(100% - 48px);
      z-index: 2;
    }

    .desktop-icon-node {
      width: 88px;
      height: 94px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: var(--radius-md);
      padding: 8px 4px;
      cursor: pointer;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      transition: background 0.15s ease, transform 0.12s ease;
    }

    .desktop-icon-node:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .desktop-icon-node:active {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(0.95);
    }

    .desktop-icon-node svg {
      width: 44px;
      height: 44px;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.6));
    }

    .desktop-icon-node span {
      font-size: 11.5px;
      text-align: center;
      line-height: 1.25;
      max-width: 82px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-all;
    }

    /* ==========================================================================
       SECTION 3: FLUENT TASKBAR & CONTROLS
       ========================================================================== */
    #taskbar-shell {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: var(--taskbar-height);
      background: var(--bg-mica-surface);
      backdrop-filter: blur(32px) saturate(190%);
      -webkit-backdrop-filter: blur(32px) saturate(190%);
      border-top: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-taskbar);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      z-index: 99999;
    }

    .taskbar-section-left,
    .taskbar-section-right {
      display: flex;
      align-items: center;
      min-width: 140px;
    }

    .taskbar-section-right {
      justify-content: flex-end;
      gap: 10px;
    }

    .taskbar-section-center {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      height: 100%;
    }

    .taskbar-action-button {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      position: relative;
      color: var(--text-primary);
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .taskbar-action-button:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .taskbar-action-button:active {
      background: rgba(255, 255, 255, 0.16);
      transform: scale(0.94);
    }

    .taskbar-action-button.active-process::after {
      content: "";
      position: absolute;
      bottom: 3px;
      width: 16px;
      height: 3px;
      border-radius: 2px;
      background: var(--accent-color);
    }

    .taskbar-action-button.minimized-process::after {
      width: 6px;
      background: var(--text-secondary);
    }

    .tray-pill-widget {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 12px;
      color: var(--text-primary);
      transition: background 0.15s ease;
    }

    .tray-pill-widget:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .tray-pill-widget:active {
      background: rgba(255, 255, 255, 0.14);
    }

    /* ==========================================================================
       SECTION 4: START MENU MODAL SHELL
       ========================================================================== */
    #start-menu-panel {
      position: absolute;
      bottom: calc(var(--taskbar-height) + 12px);
      left: 50%;
      transform: translateX(-50%) translateY(24px) scale(0.96);
      width: 580px;
      height: 620px;
      background: var(--bg-mica-surface);
      backdrop-filter: blur(48px) saturate(200%);
      -webkit-backdrop-filter: blur(48px) saturate(200%);
      border: 1px solid var(--border-standard);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-popup);
      z-index: 100000;
      opacity: 0;
      pointer-events: none;
      transition: transform 0.22s cubic-bezier(0.1, 0.9, 0.2, 1), opacity 0.2s ease;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #start-menu-panel.panel-visible {
      transform: translateX(-50%) translateY(0) scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    .start-search-row {
      padding: 24px 28px 14px 28px;
    }

    .start-search-input-field {
      width: 100%;
      height: 42px;
      border-radius: 22px;
      background: var(--bg-card);
      border: 1px solid var(--border-standard);
      padding: 0 20px;
      font-size: 14px;
      color: var(--text-primary);
      outline: none;
      transition: border 0.15s ease, background 0.15s ease;
    }

    .start-search-input-field:focus {
      background: var(--bg-card-hover);
      border-color: var(--accent-light);
    }

    .start-content-scroll {
      flex: 1;
      padding: 12px 28px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .start-section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .start-grid-apps {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
    }

    .start-pinned-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 12px 6px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .start-pinned-item:hover {
      background: var(--bg-card);
    }

    .start-pinned-item:active {
      background: var(--bg-card-hover);
    }

    .start-pinned-item svg {
      width: 38px;
      height: 38px;
    }

    .start-pinned-item span {
      font-size: 12px;
      text-align: center;
      line-height: 1.2;
    }

    .start-footer-bar {
      height: 60px;
      background: rgba(255, 255, 255, 0.03);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
    }

    /* ==========================================================================
       SECTION 5: WINDOW SURFACE SYSTEM
       ========================================================================== */
    .fluent-window {
      position: absolute;
      background: var(--bg-mica-surface);
      backdrop-filter: blur(40px) saturate(190%);
      -webkit-backdrop-filter: blur(40px) saturate(190%);
      border: 1px solid var(--border-standard);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-window);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 360px;
      min-height: 240px;
      z-index: 10;
    }

    .fluent-window.window-maximized {
      border-radius: 0 !important;
      border: none !important;
      box-shadow: none !important;
    }

    .fluent-window.window-minimized {
      display: none !important;
    }

    .window-titlebar-region {
      height: var(--titlebar-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px 0 14px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
      cursor: default;
    }

    .window-drag-carrier {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .window-title-caption {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .window-header-buttons {
      display: flex;
      height: 100%;
      align-items: center;
    }

    .header-ctrl-btn {
      width: 42px;
      height: 100%;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-primary);
      transition: background 0.15s ease;
    }

    .header-ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .header-ctrl-btn:active {
      background: rgba(255, 255, 255, 0.2);
    }

    .header-ctrl-btn.close-type:hover {
      background: #c42b1c;
      color: #ffffff;
    }

    .window-body-viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-acrylic);
    }

    /* Window Edge Resizing Grips */
    .resizer-grip {
      position: absolute;
      z-index: 1000;
    }
    .resizer-grip.grip-n { top: -4px; left: 0; width: 100%; height: 8px; cursor: n-resize; }
    .resizer-grip.grip-s { bottom: -4px; left: 0; width: 100%; height: 8px; cursor: s-resize; }
    .resizer-grip.grip-w { top: 0; left: -4px; width: 8px; height: 100%; cursor: w-resize; }
    .resizer-grip.grip-e { top: 0; right: -4px; width: 8px; height: 100%; cursor: e-resize; }
    .resizer-grip.grip-nw { top: -6px; left: -6px; width: 12px; height: 12px; cursor: nw-resize; }
    .resizer-grip.grip-ne { top: -6px; right: -6px; width: 12px; height: 12px; cursor: ne-resize; }
    .resizer-grip.grip-sw { bottom: -6px; left: -6px; width: 12px; height: 12px; cursor: sw-resize; }
    .resizer-grip.grip-se { bottom: -6px; right: -6px; width: 12px; height: 12px; cursor: se-resize; }

    /* ==========================================================================
       SECTION 6: LOCK SCREEN & PIN VERIFICATION SUBSYSTEM
       ========================================================================== */
    #lock-screen-curtain {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #1b293e 0%, #06080d 100%);
      z-index: 9999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(36px);
      -webkit-backdrop-filter: blur(36px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .lock-time-display {
      font-size: 72px;
      font-weight: 200;
      letter-spacing: -1.5px;
      line-height: 1.1;
    }

    .lock-date-display {
      font-size: 17px;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }

    .pin-status-indicators {
      display: flex;
      gap: 16px;
      margin-bottom: 28px;
    }

    .pin-bullet {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1.5px solid #ffffff;
      transition: background 0.12s ease, transform 0.12s ease;
    }

    .pin-bullet.bullet-active {
      background: #ffffff;
      transform: scale(1.15);
    }

    .numpad-matrix {
      display: grid;
      grid-template-columns: repeat(3, 76px);
      gap: 18px;
    }

    .numpad-key {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #ffffff;
      font-size: 26px;
      font-weight: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.12s ease, transform 0.1s ease;
    }

    .numpad-key:active {
      background: rgba(255, 255, 255, 0.28);
      transform: scale(0.92);
    }

    /* ==========================================================================
       SECTION 7: PYTHON 3.12 ENGINE CMD CONSOLE STYLING
       ========================================================================== */
    .cmd-terminal-root {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: #0a0a0c;
      font-family: var(--font-code);
      padding: 10px;
    }

    .cmd-log-terminal {
      flex: 1;
      overflow-y: auto;
      color: #d1d5db;
      font-size: 12.5px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .cmd-prompt-line {
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 1px solid #1f242d;
      padding-top: 8px;
    }

    .cmd-chevron {
      color: var(--accent-light);
      font-weight: bold;
      font-size: 13px;
    }

    .cmd-text-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-family: var(--font-code);
      font-size: 13px;
    }

    /* ==========================================================================
       SECTION 8: FILE EXPLORER SHELL
       ========================================================================== */
    .fe-workspace {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .fe-tabs-strip {
      display: flex;
      align-items: center;
      height: 38px;
      padding: 0 8px;
      gap: 6px;
      background: var(--bg-mica-surface);
      border-bottom: 1px solid var(--border-subtle);
    }

    .fe-tab-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      background: var(--bg-card);
      border-radius: var(--radius-sm) var(--radius-sm) 0 0;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid var(--border-subtle);
      border-bottom: none;
    }

    .fe-tab-item.tab-active {
      background: var(--bg-acrylic);
      font-weight: 600;
    }

    .fe-navigation-bar {
      height: 42px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .fe-address-box {
      flex: 1;
      height: 30px;
      background: var(--bg-card);
      border: 1px solid var(--border-standard);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      padding: 0 10px;
      font-size: 12px;
      gap: 6px;
    }

    .fe-panes-split {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .fe-quick-sidebar {
      width: 180px;
      border-right: 1px solid var(--border-subtle);
      padding: 8px;
      overflow-y: auto;
    }

    .fe-sidebar-node {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      cursor: pointer;
    }

    .fe-sidebar-node:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .fe-sidebar-node.node-selected {
      background: var(--accent-alpha);
      color: var(--accent-light);
      font-weight: 600;
    }

    .fe-content-canvas {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
      gap: 14px;
      align-content: flex-start;
    }

    .fe-item-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 10px 4px;
      border-radius: var(--radius-md);
      cursor: pointer;
      gap: 6px;
    }

    .fe-item-tile:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .fe-item-tile:active {
      background: var(--accent-alpha);
    }

    .fe-item-tile svg {
      width: 40px;
      height: 40px;
    }

    .fe-tile-label {
      font-size: 11.5px;
      word-break: break-all;
      max-width: 88px;
      line-height: 1.2;
    }

    /* ==========================================================================
       SECTION 9: SETTINGS APPLICATION SHELL
       ========================================================================== */
    .settings-layout-root {
      display: flex;
      height: 100%;
    }

    .settings-nav-rail {
      width: 240px;
      border-right: 1px solid var(--border-subtle);
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: rgba(0, 0, 0, 0.15);
      overflow-y: auto;
    }

    .settings-nav-button {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      cursor: pointer;
    }

    .settings-nav-button:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .settings-nav-button.button-active {
      background: var(--accent-alpha);
      color: var(--accent-light);
      font-weight: 600;
    }

    .settings-content-pane {
      flex: 1;
      padding: 28px;
      overflow-y: auto;
    }

    .device-telemetry-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 14px;
      font-size: 13px;
    }

    .device-telemetry-table td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .device-telemetry-table td:first-child {
      color: var(--text-secondary);
      width: 36%;
      font-weight: 500;
    }

    .btn-fluent-action {
      padding: 7px 18px;
      background: var(--bg-card);
      border: 1px solid var(--border-standard);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 13px;
      transition: background 0.12s ease;
    }

    .btn-fluent-action:hover {
      background: var(--bg-card-hover);
    }

    .btn-fluent-action:active {
      background: var(--accent-color);
      color: #fff;
    }

    /* Modal .jrex Installer */
    #jrex-installer-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      z-index: 1000000;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .jrex-dialog-box {
      width: 440px;
      background: var(--bg-mica-surface);
      border: 1px solid var(--border-standard);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-popup);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
  </style>
</head>
<body>

  <!-- Screen Lock UI Subsystem -->
  <div id="lock-screen-curtain">
    <div class="lock-time-display" id="screen-lock-time">12:00</div>
    <div class="lock-date-display" id="screen-lock-date">Saturday, October 3, 2026</div>
    <div class="pin-status-indicators">
      <div class="pin-bullet" id="pin-dot-0"></div>
      <div class="pin-bullet" id="pin-dot-1"></div>
      <div class="pin-bullet" id="pin-dot-2"></div>
      <div class="pin-bullet" id="pin-dot-3"></div>
    </div>
    <div class="numpad-matrix">
      <button class="numpad-key" onclick="handlePinInput('1')">1</button>
      <button class="numpad-key" onclick="handlePinInput('2')">2</button>
      <button class="numpad-key" onclick="handlePinInput('3')">3</button>
      <button class="numpad-key" onclick="handlePinInput('4')">4</button>
      <button class="numpad-key" onclick="handlePinInput('5')">5</button>

    /* ==========================================================================

    class JRAudioSynthesizer {
      constructor() {
        this.ctx = null;
      }

      ensureContext() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            this.ctx = new AudioContextClass();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(frequency, type = 'sine', duration = 0.15, gainValue = 0.08) {
        try {
          this.ensureContext();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(frequency, this.ctx.currentTime);
          gain.gain.setValueAtTime(gainValue, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {
          console.warn("Audio synthesis ignored:", e);
        }
      }

      playFeedbackClick() {
        this.playTone(880, 'sine', 0.08, 0.04);

      }

    /* ==========================================================================
       SECTION 11: INDEXEDDB PERSISTENCE SUBSYSTEM
       ========================================================================== */
    class JRIndexedDBEngine {
      constructor(dbName = "JR_OS_KERNEL_DB", dbVersion = 1) {
        this.dbName = dbName;
        this.dbVersion = dbVersion;
        this.db = null;
      }

      async open() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(this.dbName, this.dbVersion);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains("vfs_nodes")) {
              db.createObjectStore("vfs_nodes", { keyPath: "path" });
            }
            if (!db.objectStoreNames.contains("os_registry")) {
              db.createObjectStore("os_registry", { keyPath: "key" });
            }
            if (!db.objectStoreNames.contains("packages_installed")) {
              db.createObjectStore("packages_installed", { keyPath: "appId" });
            }
          };
          req.onsuccess = (e) => {
            this.db = e.target.result;
            resolve(this.db);
          };
          req.onerror = (e) => reject(e.target.error);
        });
      }

      async readRecord(storeName, key) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction([storeName], "readonly");
          const store = tx.objectStore(storeName);
          const req = store.get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      async writeRecord(storeName, record) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction([storeName], "readwrite");
          const store = tx.objectStore(storeName);
          const req = store.put(record);
          req.onsuccess = () => resolve(true);
          req.onerror = () => reject(req.error);
        });
      }

      async removeRecord(storeName, key) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction([storeName], "readwrite");
          const store = tx.objectStore(storeName);
          const req = store.delete(key);
          req.onsuccess = () => resolve(true);
          req.onerror = () => reject(req.error);
        });
      }

      async readAllRecords(storeName) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction([storeName], "readonly");
          const store = tx.objectStore(storeName);
          const req = store.getAll();
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }
    }

    const kernelDB = new JRIndexedDBEngine();

              path: k,
              name: k.substring(k.lastIndexOf("/") + 1),

            });

    /* ==========================================================================
       SECTION 13: ADVANCED DEVICE TELEMETRY & HARDWARE PROBE

    class JRDeviceDiagnostics {
      static async queryAllTelemetry() {
        const metrics = {};

        // Platform & Runtime Identifiers
        metrics["System Runtime Platform"] = navigator.platform || "iPadOS / Apple WebKit";
        metrics["User Agent Descriptor"] = navigator.userAgent;
        metrics["Software Vendor Signature"] = navigator.vendor || "Apple Computer, Inc.";
        metrics["Hardware Concurrency Threads"] = navigator.hardwareConcurrency || "Sandboxed / Dynamic";
        metrics["Touch Points Supported (Max)"] = navigator.maxTouchPoints || "Multi-Touch Dynamic Array";
        metrics["Preferred Operating Language"] = navigator.language;

        // Display Geometry & Pixel Arrays
        const dpr = window.devicePixelRatio || 1;
        metrics["Native Screen Resolution"] = `${window.screen.width * dpr} x ${window.screen.height * dpr} Pixels`;
        metrics["Logical Display Viewport"] = `${window.screen.width} x ${window.screen.height} Points`;
        metrics["Client Window Resolution"] = `${window.innerWidth} x ${window.innerHeight} Pixels`;
        metrics["Display Device Pixel Ratio (DPR)"] = dpr;
        metrics["Screen Color Depth"] = `${window.screen.colorDepth}-Bit Gamut`;

        // Screen Orientation
        if (window.screen.orientation) {
          metrics["Display Orientation Type"] = window.screen.orientation.type;
          metrics["Display Angle Offset"] = `${window.screen.orientation.angle}°`;
        } else if (window.orientation !== undefined) {
          metrics["Display Angle Offset"] = `${window.orientation}°`;
        }

        // WebGL Hardware GPU Probing
        try {
          const canvas = document.createElement("canvas");
          const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
          if (gl) {
            const ext = gl.getExtension("WEBGL_debug_renderer_info");
            metrics["Graphics Unmasked Vendor"] = ext ? gl.getParameter(ext.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR);
            metrics["Graphics Unmasked Renderer"] = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
            metrics["WebGL Engine Version"] = gl.getParameter(gl.VERSION);
            metrics["Max Hardware Texture Size"] = `${gl.getParameter(gl.MAX_TEXTURE_SIZE)} x ${gl.getParameter(gl.MAX_TEXTURE_SIZE)} px`;
          } else {
            metrics["Graphics Pipeline Status"] = "Virtualized / Software Pipeline";
          }
        } catch (e) {
          metrics["Graphics Diagnostic Hook"] = "Restricted by Apple WebKit Sandbox";
        }

        // Audio Subsystem Hardware Sampling
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            const actx = new AudioContextClass();
            metrics["Audio Subsystem Sampling Rate"] = `${actx.sampleRate} Hz`;
            metrics["Audio Destination Channels"] = actx.destination.maxChannelCount;
            metrics["Audio Processing State"] = actx.state;
            actx.close();
          }
        } catch (e) {
          metrics["Audio Diagnostic Hook"] = "Direct Audio Introspection Restricted";
        }

        // Battery Power Telemetry
        if (navigator.getBattery) {
          try {
            const battery = await navigator.getBattery();
            metrics["Battery Power Charge"] = `${Math.round(battery.level * 100)}%`;
            metrics["Battery Charging Active"] = battery.charging ? "Connected to External Power" : "Discharging on Battery";
          } catch (e) {
            metrics["Battery Diagnostic Status"] = "Restricted on iPadOS Platform";
          }
        }

        // Network Interface
        const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (connection) {
          metrics["Network Bandwidth Profile"] = connection.effectiveType || "High-Bandwidth Network";
          metrics["Estimated Downlink Rate"] = connection.downlink ? `${connection.downlink} Mbps` : "Unmetered / Dynamic";
          metrics["Round-Trip Latency (RTT)"] = connection.rtt ? `${connection.rtt} ms` : "Optimized";
        } else {
          metrics["Network Interface Status"] = navigator.onLine ? "Online (Active Session)" : "Disconnected";
        }

        // Memory Footprint Estimation
        if (performance && performance.memory) {
          metrics["JS Heap Memory Allocated"] = `${(performance.memory.totalJSHeapSize / (1024 * 1024)).toFixed(2)} MB`;
          metrics["JS Heap Memory Utilized"] = `${(performance.memory.usedJSHeapSize / (1024 * 1024)).toFixed(2)} MB`;
          metrics["JS Heap Upper Threshold"] = `${(performance.memory.jsHeapSizeLimit / (1024 * 1024)).toFixed(2)} MB`;
        }

        // IndexedDB Quota
        if (navigator.storage && navigator.storage.estimate) {
          try {
            const est = await navigator.storage.estimate();
            metrics["IndexedDB Quota Assigned"] = `${(est.quota / (1024 * 1024 * 1024)).toFixed(2)} GB`;
            metrics["VFS Storage Used"] = `${(est.usage / (1024 * 1024)).toFixed(2)} MB`;
          } catch (e) {}
        }

        return metrics;
      }
    }

    /* ==========================================================================
       SECTION 14: PYTHON 3.12 EMBEDDED AST INTERPRETER ENGINE
       ========================================================================== */
    class JRPythonInterpreter {
      constructor(vfsInstance) {
        this.vfs = vfsInstance;
        this.globalScope = {};
        this.initGlobals();
      }

      initGlobals() {
        this.globalScope = {
          __name__: "__main__",
          __version__: "3.12.2 (JR-WebKit-Embedded)",
          PI: Math.PI,
          E: Math.E,
          True: true,
          False: false,
          None: null
        };

        // Builtin Library Functions
        this.globalScope["len"] = (val) => {
          if (val === null || val === undefined) throw new Error("TypeError: object of type 'NoneType' has no len()");
          return val.length !== undefined ? val.length : Object.keys(val).length;
        };

        this.globalScope["range"] = (...args) => {
          let start = 0, stop = 0, step = 1;
          if (args.length === 1) {
            stop = args[0];
          } else if (args.length === 2) {
            start = args[0];
            stop = args[1];
          } else if (args.length >= 3) {
            start = args[0];
            stop = args[1];
            step = args[2];
          }
          const res = [];
          if (step > 0) {
            for (let i = start; i < stop; i += step) res.push(i);
          } else if (step < 0) {
            for (let i = start; i > stop; i += step) res.push(i);
          }
          return res;
        };

        this.globalScope["sum"] = (seq) => {
          if (!Array.isArray(seq)) throw new Error("TypeError: sum() requires an array");
          return seq.reduce((acc, x) => acc + x, 0);
        };

        this.globalScope["max"] = (...args) => Array.isArray(args[0]) ? Math.max(...args[0]) : Math.max(...args);
        this.globalScope["min"] = (...args) => Array.isArray(args[0]) ? Math.min(...args[0]) : Math.min(...args);
        this.globalScope["abs"] = (x) => Math.abs(x);
        this.globalScope["int"] = (x) => parseInt(x, 10);
        this.globalScope["float"] = (x) => parseFloat(x);
        this.globalScope["str"] = (x) => String(x);
        this.globalScope["list"] = (x) => Array.from(x || []);
        
        // System VFS Bridge Hooks in Python
        this.globalScope["vfs_list"] = (path = "/") => {
          return this.vfs.listDirectory(path).map(item => item.name);
        };
      }

      run(scriptText) {
        const lines = scriptText.split("\n");
        const stdout = [];
        let lineIndex = 0;

        const printBuffer = (...items) => {
          stdout.push(items.map(it => this.pythonRepr(it)).join(" "));
        };

        const localScope = Object.assign({}, this.globalScope);
        localScope["print"] = printBuffer;

        while (lineIndex < lines.length) {
          const raw = lines[lineIndex];
          const trimmed = raw.trim();

          if (!trimmed || trimmed.startsWith("#")) {
            lineIndex++;
            continue;
          }

          if (trimmed === "clear") {
            return { special: "__CLEAR__" };
          }

          if (trimmed === "help") {
            return {
              stdout: `JR OS Embedded Python 3.12 Engine\nSupports:\n- Assignments (var = 100)\n- Arithmetic, logical & bitwise operators\n- Dynamic functions: def square(x): return x * x\n- Loops: for i in range(5): print(i)\n- Comprehensions: [x*2 for x in range(10)]\n- VFS bridge: vfs_list('/')\n`
            };
          }

          // Function Definition Syntax
          if (trimmed.startsWith("def ")) {
            const funcMatch = trimmed.match(/^def\s+([a-zA-Z_]\w*)\s*\((.*?)\)\s*:/);
            if (funcMatch) {
              const funcName = funcMatch[1];
              const params = funcMatch[2].split(",").map(p => p.trim()).filter(p => p);
              lineIndex++;
              const bodyLines = [];
              while (lineIndex < lines.length && (lines[lineIndex].startsWith("  ") || lines[lineIndex].startsWith("\t") || !lines[lineIndex].trim())) {
                if (lines[lineIndex].trim()) bodyLines.push(lines[lineIndex].trim());
                lineIndex++;
              }
              const funcInstance = (...invocationArgs) => {
                const subContext = Object.assign({}, this.globalScope);
                subContext["print"] = printBuffer;
                params.forEach((paramName, idx) => {
                  subContext[paramName] = invocationArgs[idx];
                });
                for (const bLine of bodyLines) {
                  if (bLine.startsWith("return ")) {
                    const retExpression = bLine.replace(/^return\s+/, "");
                    return this.evaluateExpression(retExpression, subContext);
                  }
                  this.evaluateStatement(bLine, subContext);
                }
                return null;
              };
              this.globalScope[funcName] = funcInstance;
              continue;
            }
          }

          // Single-line Loop Syntax
          if (trimmed.startsWith("for ") && trimmed.includes(" in ")) {
            const loopMatch = trimmed.match(/^for\s+([a-zA-Z_]\w*)\s+in\s+(.*?)\s*:\s*(.*)$/);
            if (loopMatch) {
              const iterName = loopMatch[1];
              const rangeExpr = loopMatch[2];
              const subStatement = loopMatch[3];
              const items = this.evaluateExpression(rangeExpr, localScope);
              if (Array.isArray(items)) {
                for (const item of items) {
                  localScope[iterName] = item;
                  this.evaluateStatement(subStatement, localScope);
                }
              }
              lineIndex++;
              continue;
            }
          }

          // Variable Assignment or Pure Evaluation
          if (trimmed.includes("=") && !trimmed.includes("==") && !trimmed.includes("<=") && !trimmed.includes(">=")) {
            this.evaluateStatement(trimmed, localScope);
          } else {
            const evaluationResult = this.evaluateExpression(trimmed, localScope);
            if (evaluationResult !== undefined) {
              stdout.push(this.pythonRepr(evaluationResult));
            }
          }

          lineIndex++;
        }

        Object.assign(this.globalScope, localScope);
        return { stdout: stdout.join("\n") };
      }

      evaluateStatement(stmt, scope) {
        const assignMatch = stmt.match(/^([a-zA-Z_]\w*)\s*=\s*(.*)$/);
        if (assignMatch) {
          const varName = assignMatch[1];
          const valExpr = assignMatch[2];
          const calculatedVal = this.evaluateExpression(valExpr, scope);
          scope[varName] = calculatedVal;
          return;
        }
        if (stmt.startsWith("print(")) {
          this.evaluateExpression(stmt, scope);
          return;
        }
        this.evaluateExpression(stmt, scope);
      }

      evaluateExpression(expr, scope) {
        let transformed = expr.trim();

        // Convert python expressions to JS AST
        transformed = transformed
          .replace(/\band\b/g, "&&")
          .replace(/\bor\b/g, "||")
          .replace(/\bnot\b/g, "!")
          .replace(/\bTrue\b/g, "true")
          .replace(/\bFalse\b/g, "false")
          .replace(/\bNone\b/g, "null")
          .replace(/\bprint\((.*?)\)/g, "print($1)");

        // List Comprehension: [x*2 for x in range(5)]
        const compPattern = transformed.match(/^\[(.*)\s+for\s+([a-zA-Z_]\w*)\s+in\s+(.*)\]$/);
        if (compPattern) {
          const mapper = compPattern[1];
          const variable = compPattern[2];
          const sourceSeq = compPattern[3];
          const collection = this.evaluateExpression(sourceSeq, scope);
          if (Array.isArray(collection)) {
            const accumulator = [];
            for (const el of collection) {
              const innerScope = Object.assign({}, scope);
              innerScope[variable] = el;
              accumulator.push(this.evaluateExpression(mapper, innerScope));
            }
            return accumulator;
          }
        }

        const keys = Object.keys(scope);
        const vals = Object.values(scope);

        try {
          const runner = new Function(...keys, `return (${transformed});`);
          return runner(...vals);
        } catch (err) {
          throw new Error(`SyntaxError in Python expression: ${err.message}`);
        }
      }

      pythonRepr(val) {
        if (val === null) return "None";
        if (val === true) return "True";
        if (val === false) return "False";
        if (Array.isArray(val)) {
          return `[${val.map(v => this.pythonRepr(v)).join(", ")}]`;
        }
        if (typeof val === "object") {
          return JSON.stringify(val);
        }
        return String(val);
      }
    }

    /* ==========================================================================
       SECTION 15: WINDOW MANAGER & FLUENT SHELL ORCHESTRATION
       ========================================================================== */
    class JRWindowManager {
      constructor() {
        this.activeWindows = new Map();
        this.topZIndex = 1000;
        this.currentFocusedId = null;
      }

      createWindow(appId, title, iconSvg, w = 660, h = 440) {
        soundSystem.playFeedbackClick();
        const winId = "win_" + Math.random().toString(36).substr(2, 9);
        const winEl = document.createElement("div");
        winEl.className = "fluent-window";
        winEl.id = winId;

        const maxW = window.innerWidth;
        const maxH = window.innerHeight - 52;
        const finalW = Math.min(w, maxW - 20);
        const finalH = Math.min(h, maxH - 20);
        const startX = Math.max(10, (maxW - finalW) / 2);
        const startY = Math.max(10, (maxH - finalH) / 2);

        winEl.style.width = finalW + "px";
        winEl.style.height = finalH + "px";
        winEl.style.left = startX + "px";
        winEl.style.top = startY + "px";
        winEl.style.zIndex = ++this.topZIndex;

        winEl.innerHTML = `
          <div class="window-titlebar-region">
            <div class="window-drag-carrier">
              <div style="width:16px; height:16px;">${iconSvg}</div>
              <span class="window-title-caption">${title}</span>
            </div>
            <div class="window-header-buttons">
              <button class="header-ctrl-btn min-type">─</button>
              <button class="header-ctrl-btn max-type">□</button>
              <button class="header-ctrl-btn close-type">✕</button>
            </div>
          </div>
          <div class="window-body-viewport" id="${winId}_container"></div>
          <div class="resizer-grip grip-n"></div>
          <div class="resizer-grip grip-s"></div>
          <div class="resizer-grip grip-w"></div>
          <div class="resizer-grip grip-e"></div>
          <div class="resizer-grip grip-nw"></div>
          <div class="resizer-grip grip-ne"></div>
          <div class="resizer-grip grip-sw"></div>
          <div class="resizer-grip grip-se"></div>
        `;

        document.getElementById("desktop-viewport").appendChild(winEl);

        const record = {
          id: winId,
          appId: appId,
          title: title,
          icon: iconSvg,
          element: winEl,
          isMaximized: false,
          isMinimized: false,
          bounds: { w: finalW, h: finalH, x: startX, y: startY }
        };

        this.activeWindows.set(winId, record);
        this.bindEvents(winEl, record);

        winEl.addEventListener("touchstart", () => this.bringToFront(winId), { passive: true });
        winEl.addEventListener("mousedown", () => this.bringToFront(winId));

        this.bringToFront(winId);
        this.updateTaskbar();
        return { winId, contentPane: document.getElementById(`${winId}_container`) };
      }

      bringToFront(winId) {
        if (!this.activeWindows.has(winId)) return;
        this.topZIndex++;
        const rec = this.activeWindows.get(winId);
        rec.element.style.zIndex = this.topZIndex;
        rec.element.classList.remove("window-minimized");
        rec.isMinimized = false;
        this.currentFocusedId = winId;
        this.updateTaskbar();
      }

      bindEvents(element, record) {
        const dragHandle = element.querySelector(".window-drag-carrier");
        const minBtn = element.querySelector(".min-type");
        const maxBtn = element.querySelector(".max-type");
        const closeBtn = element.querySelector(".close-type");

        minBtn.onclick = () => {
          record.isMinimized = true;
          element.classList.add("window-minimized");
          this.updateTaskbar();
        };

        maxBtn.onclick = () => {
          if (!record.isMaximized) {
            record.bounds = {
              w: parseFloat(element.style.width),
              h: parseFloat(element.style.height),
              x: parseFloat(element.style.left),
              y: parseFloat(element.style.top)
            };
            element.style.left = "0px";
            element.style.top = "0px";
            element.style.width = "100vw";
            element.style.height = (window.innerHeight - 52) + "px";
            element.classList.add("window-maximized");
            record.isMaximized = true;
          } else {
            element.style.width = record.bounds.w + "px";
            element.style.height = record.bounds.h + "px";
            element.style.left = record.bounds.x + "px";
            element.style.top = record.bounds.y + "px";
            element.classList.remove("window-maximized");
            record.isMaximized = false;
          }
        };

        closeBtn.onclick = () => {
          element.remove();
          this.activeWindows.delete(record.id);
          this.updateTaskbar();
        };

        // Window Dragging
        let startX, startY, origX, origY;
        const startDrag = (e) => {
          if (e.target.closest(".header-ctrl-btn")) return;
          this.bringToFront(record.id);
          if (record.isMaximized) return;

          const p = e.touches ? e.touches[0] : e;
          startX = p.clientX;
          startY = p.clientY;
          origX = element.offsetLeft;
          origY = element.offsetTop;

          const moveHandler = (ev) => {
            const pt = ev.touches ? ev.touches[0] : ev;
            element.style.left = (origX + (pt.clientX - startX)) + "px";
            element.style.top = Math.max(0, origY + (pt.clientY - startY)) + "px";
          };

          const stopHandler = () => {
            window.removeEventListener("touchmove", moveHandler);
            window.removeEventListener("touchend", stopHandler);
            window.removeEventListener("mousemove", moveHandler);
            window.removeEventListener("mouseup", stopHandler);
          };

          window.addEventListener("touchmove", moveHandler, { passive: true });
          window.addEventListener("touchend", stopHandler);
          window.addEventListener("mousemove", moveHandler);
          window.addEventListener("mouseup", stopHandler);
        };

        dragHandle.addEventListener("touchstart", startDrag, { passive: true });
        dragHandle.addEventListener("mousedown", startDrag);
      }

      updateTaskbar() {
        const row = document.getElementById("taskbar-processes-row");
        row.querySelectorAll(".proc-pill").forEach(el => el.remove());

        this.activeWindows.forEach(win => {
          const btn = document.createElement("button");
          btn.className = `taskbar-action-button proc-pill ${win.id === this.currentFocusedId && !win.isMinimized ? "active-process" : ""} ${win.isMinimized ? "minimized-process" : ""}`;
          btn.innerHTML = win.icon;
          btn.onclick = () => {
            if (win.isMinimized) {
              this.bringToFront(win.id);
            } else if (win.id === this.currentFocusedId) {
              win.isMinimized = true;
              win.element.classList.add("window-minimized");
              this.updateTaskbar();
            } else {
              this.bringToFront(win.id);
            }
          };
          row.appendChild(btn);
        });
      }
    }

    let enteredPasscode = "";

    function updatePasscodeDots() {
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById(`pin-dot-${i}`);
        if (i < enteredPasscode.length) {
          dot.classList.add("bullet-active");
        } else {
          dot.classList.remove("bullet-active");
        }
      }
    }

    function handlePinInput(numChar) {
      soundSystem.playFeedbackClick();
      if (enteredPasscode.length < 4) {
        enteredPasscode += numChar;
        updatePasscodeDots();
        if (enteredPasscode.length === 4) {
          setTimeout(verifyPasscodeSession, 120);
        }
      }
    }

    function resetPinInput() {
      soundSystem.playFeedbackClick();
      enteredPasscode = "";
      updatePasscodeDots();
    }

    function verifyPasscodeSession() {
      if (enteredPasscode === systemPasscode) {
        soundSystem.playAuthSuccess();
        bypassLockScreen();
      } else {
        soundSystem.playAuthError();
        alert("Authorization Denied: Invalid 4-Digit Passcode.");
        resetPinInput();
      }
    }

    function bypassLockScreen() {
      const curtain = document.getElementById("lock-screen-curtain");
      curtain.style.opacity = "0";
      setTimeout(() => {
        curtain.style.display = "none";
        resetPinInput();
      }, 300);
    }

      soundSystem.playTone(440, 'sine', 0.15, 0.05);

    // Application 1: Python CMD Terminal
    function launchPythonTerminal() {
      const { contentPane } = windowManager.createWindow("cmd", "Python 3.12 Engine Terminal", SVG_ICONS.terminal, 680, 440);
      contentPane.innerHTML = `
        <div class="cmd-terminal-root">
          <div class="cmd-log-terminal" id="cmd-screen">JR-OS Embedded Python 3.12.2 Platform\nInteractive Interpreter Shell Ready.\nType "help" for overview or "clear" to empty display.\n\n</div>
          <div class="cmd-prompt-line">
            <span class="cmd-chevron">&gt;&gt;&gt;</span>
            <input type="text" class="cmd-text-input" id="cmd-user-input" autocomplete="off" spellcheck="false">
          </div>
        </div>
      `;

      const input = contentPane.querySelector("#cmd-user-input");
      const screen = contentPane.querySelector("#cmd-screen");
      const historyStack = [];
      let historyPtr = -1;

      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          const val = input.value;
          input.value = "";
          if (val.trim()) {
            historyStack.push(val);
            historyPtr = historyStack.length;
            screen.innerText += `>>> ${val}\n`;

            try {
              const res = pythonEngine.run(val);
              if (res.special === "__CLEAR__") {
                screen.innerText = "";
              } else if (res.stdout) {
                screen.innerText += `${res.stdout}\n`;
              }
            } catch (err) {
              screen.innerText += `Traceback (most recent call):\n${err.message}\n`;
            }
            screen.scrollTop = screen.scrollHeight;
          }
        } else if (e.key === "ArrowUp") {
          if (historyPtr > 0) {
            historyPtr--;
            input.value = historyStack[historyPtr];
          }
        } else if (e.key === "ArrowDown") {
          if (historyPtr < historyStack.length - 1) {
            historyPtr++;
            input.value = historyStack[historyPtr];
          } else {
            historyPtr = historyStack.length;
            input.value = "";
          }
        }
      });
    }

        let icon = SVG_ICONS.file;
        if (item.type === "app_shortcut") {
          icon = item.icon === "settings" ? SVG_ICONS.settings : (item.icon === "terminal" ? SVG_ICONS.terminal : SVG_ICONS.folder);
        }
        if (item.type === "jrex") icon = SVG_ICONS.jrex;

        node.innerHTML = `${icon}<span>${item.name}</span>`;
        node.onclick = () => routeFileExecution(item);
        plane.appendChild(node);
      });
    }

    function renderStartMenuApps() {
      const grid = document.getElementById("start-apps-grid");
      grid.innerHTML = `
        <div class="start-pinned-item" onclick="launchFileExplorer()">
          ${SVG_ICONS.folder}
          <span>File Explorer</span>
        </div>
        <div class="start-pinned-item" onclick="launchSettingsApplication()">
          ${SVG_ICONS.settings}
          <span>Settings</span>
        </div>
        <div class="start-pinned-item" onclick="launchPythonTerminal()">
          ${SVG_ICONS.terminal}
          <span>Python Terminal</span>
        </div>
      `;
    }

    // Start Menu Toggle Handling
    const startTrigger = document.getElementById("start-menu-trigger");
    const startPanel = document.getElementById("start-menu-panel");

    startTrigger.onclick = (e) => {
      e.stopPropagation();
      soundSystem.playFeedbackClick();
      startPanel.classList.toggle("panel-visible");
    };

    document.addEventListener("click", (e) => {
      if (!startPanel.contains(e.target) && e.target !== startTrigger) {
        startPanel.classList.remove("panel-visible");
      }
    });

    // Clock Synchronizer
    function synchronizeClockDisplay() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      const dateStr = now.toLocaleDateString([], { weekday: "long", year: "numeric", month: "long", day: "numeric" });
      
      document.getElementById("taskbar-clock-label").innerText = timeStr;
      document.getElementById("screen-lock-time").innerText = timeStr;
      document.getElementById("screen-lock-date").innerText = dateStr;
    }
    setInterval(synchronizeClockDisplay, 1000);
    synchronizeClockDisplay();

    /* ==========================================================================
       SECTION 20: SYSTEM BOOTLOADER PIPELINE
       ========================================================================== */
    (async function bootstrapOperatingSystemKernel() {
      try {
        await kernelDB.open();
        
        // Restore registry passcode if present
        const regPass = await kernelDB.readRecord("os_registry", "lock_passcode");
        if (regPass && regPass.value) {
          systemPasscode = regPass.value;
        }

        await vfs.bootstrap();
        renderDesktopShortcuts();
        renderStartMenuApps();
        console.log("JR OS Kernel Initialization Successful.");
      } catch (kernelError) {
        console.error("FATAL: Kernel bootstrap exception:", kernelError);
      }
    })();
  </script>
</body>
</html>
