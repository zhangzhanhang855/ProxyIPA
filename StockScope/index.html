<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>JRmusic Pro</title>
  <style>
    :root {
      --accent: #0066ff;
      --accent-subtle: rgba(0, 102, 255, 0.12);
      --bg: #0c0d10;
      --surface: #15181e;
      --elevated: #1e222b;
      --text: #f3f5f8;
      --muted: #858d9d;
      --border: rgba(255, 255, 255, 0.08);
      --danger: #ff3b30;
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f5f8;
        --surface: #ffffff;
        --elevated: #e8ebf0;
        --text: #111317;
        --muted: #6b7280;
        --border: rgba(0, 0, 0, 0.08);
      }
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; background: var(--bg); color: var(--text); height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
    button, input, select { font: inherit; color: inherit; background: none; border: none; outline: none; }
    button { cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }

    /* Layout */
    #app { display: flex; width: 100%; height: 100%; overflow: hidden; }
    #sidebar { display: none; width: 220px; background: var(--surface); border-right: 1px solid var(--border); padding-top: var(--sat); flex-direction: column; flex-shrink: 0; }
    @media (min-width: 768px) { #sidebar { display: flex; } #bottom-bar { display: none !important; } }

    .brand { padding: 18px 20px; font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); }
    .brand span { font-size: 10px; background: var(--accent); color: #fff; padding: 2px 6px; border-radius: 4px; }
    .nav-btn { width: 100%; padding: 12px 18px; text-align: left; font-size: 14px; font-weight: 600; color: var(--muted); border-radius: 8px; margin: 2px 0; justify-content: flex-start; gap: 12px; }
    .nav-btn.active, .nav-btn:hover { color: var(--accent); background: var(--accent-subtle); }

    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .view-pane { flex: 1; overflow-y: auto; padding: calc(var(--sat) + 12px) 16px 140px; display: none; }
    .view-pane.active { display: block; }

    /* Compact Search & Action Bars */
    .bar { display: flex; gap: 8px; margin-bottom: 14px; }
    .input-box { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0 12px; height: 38px; display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .btn { height: 38px; padding: 0 14px; background: var(--accent); color: #fff; border-radius: 10px; font-size: 13px; font-weight: 600; flex-shrink: 0; }
    .btn-secondary { background: var(--elevated); color: var(--text); border: 1px solid var(--border); }

    /* Dense List UI */
    .section-title { font-size: 14px; font-weight: 700; margin: 12px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; display: flex; justify-content: space-between; align-items: center; }
    .song-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; cursor: pointer; }
    .song-row.playing { border-color: var(--accent); background: var(--accent-subtle); }
    .song-row img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: var(--elevated); }
    .song-info { flex: 1; min-width: 0; }
    .song-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-sub { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-actions { display: flex; gap: 4px; }
    .icon-btn { width: 30px; height: 30px; border-radius: 6px; color: var(--muted); }
    .icon-btn:hover { background: var(--elevated); color: var(--text); }

    /* Playlist Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px; cursor: pointer; text-align: center; }
    .card-icon { width: 46px; height: 46px; border-radius: 8px; background: var(--accent-subtle); color: var(--accent); margin: 0 auto 8px; display: flex; align-items: center; justify-content: center; }
    .card-title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* Mini Player */
    #mini-player { position: fixed; bottom: calc(var(--sab) + 54px); left: 10px; right: 10px; height: 56px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; display: flex; align-items: center; padding: 0 10px; gap: 10px; z-index: 50; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
    @media (min-width: 768px) { #mini-player { left: 230px; bottom: calc(var(--sab) + 12px); } }
    #mini-player img { width: 38px; height: 38px; border-radius: 6px; object-fit: cover; }
    .mini-progress { position: absolute; bottom: 0; left: 10px; right: 10px; height: 2px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .mini-progress-fill { width: 0%; height: 100%; background: var(--accent); }

    /* Fullscreen Player */
    #full-player { position: fixed; inset: 0; background: var(--bg); z-index: 100; transform: translateY(100%); transition: transform 0.28s ease; display: flex; flex-direction: column; padding: var(--sat) 18px var(--sab); overflow: hidden; }
    #full-player.open { transform: translateY(0); }
    .player-bg { position: absolute; inset: -20px; filter: blur(50px) brightness(0.35); background-size: cover; background-position: center; z-index: -1; }
    .fp-head { height: 48px; display: flex; align-items: center; justify-content: space-between; }
    .fp-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; overflow: hidden; }
    @media (min-width: 768px) { .fp-body { flex-direction: row; gap: 32px; } }
    .disc { width: min(50vw, 220px); height: min(50vw, 220px); border-radius: 50%; background: #111; border: 8px solid #1a1c22; box-shadow: 0 8px 32px rgba(0,0,0,0.6); position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .disc img { width: 60%; height: 60%; border-radius: 50%; object-fit: cover; }
    .disc.playing { animation: spin 16s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* Lyrics Display */
    .lrc-box { flex: 1; width: 100%; height: 160px; overflow-y: auto; text-align: center; mask-image: linear-gradient(180deg, transparent 0%, #000 20%, #000 80%, transparent 100%); -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 20%, #000 80%, transparent 100%); padding: 60px 0; }
    .lrc-line { padding: 6px 0; font-size: 14px; font-weight: 600; opacity: 0.4; transition: all 0.2s; cursor: pointer; }
    .lrc-line.active { font-size: 17px; opacity: 1; color: var(--accent); }
    .lrc-sub { font-size: 11px; font-weight: 400; opacity: 0.8; margin-top: 2px; }

    /* Player Controls */
    .fp-foot { padding: 12px 0 16px; width: 100%; }
    .slider { width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; position: relative; cursor: pointer; margin: 8px 0; }
    .slider-fill { width: 0%; height: 100%; background: var(--accent); border-radius: 2px; }
    .time-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
    .ctrls { display: flex; align-items: center; justify-content: space-around; margin-top: 10px; }
    .play-btn { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #fff; }

    /* Bottom Nav Bar (Mobile) */
    #bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; height: calc(var(--sab) + 50px); padding-bottom: var(--sab); background: var(--surface); border-top: 1px solid var(--border); display: flex; z-index: 40; }
    .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; color: var(--muted); gap: 2px; }
    .tab.active { color: var(--accent); font-weight: 700; }

    /* Modals */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 200; padding: 16px; }
    .modal.active { display: flex; }
    .modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 360px; padding: 16px; }
    .modal-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
    .modal-list { max-height: 200px; overflow-y: auto; margin-bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
    .modal-item { padding: 10px; background: var(--elevated); border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; text-align: left; }

    /* Toast */
    #toast { position: fixed; top: calc(var(--sat) + 16px); left: 50%; transform: translateX(-50%); background: var(--elevated); border: 1px solid var(--border); padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 600; pointer-events: none; opacity: 0; transition: opacity 0.2s; z-index: 300; }
  </style>
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="brand">JRmusic <span>PRO</span></div>
      <div style="padding: 10px;">
        <button class="nav-btn active" data-view="view-search">🔎 搜索與解析</button>
        <button class="nav-btn" data-view="view-playlists">📂 自建歌單</button>
        <button class="nav-btn" data-view="view-offline">💾 本地離線庫</button>
        <button class="nav-btn" data-view="view-settings">⚙️ 設置</button>
      </div>
    </aside>

    <!-- Main Views -->
    <main id="main">
      <!-- View: Search & Explore -->
      <section class="view-pane active" id="view-search">
        <div class="bar">
          <div class="input-box">
            <span>🔍</span>
            <input type="text" id="input-query" placeholder="歌曲名、歌手、單曲 ID 或 歌單 ID">
          </div>
          <button class="btn" id="btn-search">搜索</button>
          <button class="btn btn-secondary" id="btn-resolve-pl">解析歌單</button>
        </div>
        <div class="section-title"><span>即時解析結果</span><span id="results-count" style="font-weight:400;font-size:12px;"></span></div>
        <div id="search-list"></div>
      </section>

      <!-- View: Custom Playlists -->
      <section class="view-pane" id="view-playlists">
        <div class="section-title">
          <span>我的自建歌單</span>
          <button class="btn" id="btn-create-pl" style="height:26px;padding:0 8px;font-size:11px;">+ 新建歌單</button>
        </div>
        <div class="grid" id="playlists-grid"></div>
        <div id="playlist-detail" style="display: none;">
          <div class="section-title">
            <span id="pl-detail-title">歌單內容</span>
            <button class="btn btn-secondary" id="btn-back-pl" style="height:26px;padding:0 8px;font-size:11px;">返回</button>
          </div>
          <div id="pl-songs-list"></div>
        </div>
      </section>

      <!-- View: Offline Stash -->
      <section class="view-pane" id="view-offline">
        <div class="section-title">
          <span>IndexedDB 本地持久音源</span>
          <button class="btn btn-secondary" id="btn-clear-db" style="height:26px;padding:0 8px;font-size:11px;color:var(--danger);">清空硬盤</button>
        </div>
        <div id="offline-list"></div>
      </section>

      <!-- View: Settings -->
      <section class="view-pane" id="view-settings">
        <div class="section-title">伺服器與音質設置</div>
        <div style="background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px; display:flex; flex-direction:column; gap:12px;">
          <div>
            <div style="font-size:13px; font-weight:600;">後端 API 基礎地址</div>
            <div class="input-box" style="margin-top:4px;">
              <input type="text" id="cfg-api" value="http://localhost:5000">
            </div>
          </div>
          <div>
            <div style="font-size:13px; font-weight:600;">默認解析品質</div>
            <select id="cfg-quality" style="width:100%; margin-top:4px; padding:8px; background:var(--elevated); border:1px solid var(--border); border-radius:8px;">
              <option value="standard">Standard (128kbps)</option>
              <option value="exhigh">ExHigh (320kbps)</option>
              <option value="lossless" selected>Lossless (FLAC 無損)</option>
              <option value="hires">Hi-Res 高清母帶</option>
            </select>
          </div>
        </div>
      </section>
    </main>

    <!-- Mini Player Bar -->
    <div id="mini-player">
      <img id="mini-pic" src="" alt="">
      <div class="song-info">
        <div class="song-name" id="mini-name">JRmusic Ready</div>
        <div class="song-sub" id="mini-sub">請選擇歌曲播放</div>
      </div>
      <button class="icon-btn" id="mini-play-btn" style="width:36px;height:36px;font-size:18px;">▶</button>
      <div class="mini-progress"><div class="mini-progress-fill" id="mini-fill"></div></div>
    </div>

    <!-- Mobile Bottom Tabs -->
    <nav id="bottom-bar">
      <div class="tab active" data-view="view-search"><span>🔎</span>檢索</div>
      <div class="tab" data-view="view-playlists"><span>📂</span>歌單</div>
      <div class="tab" data-view="view-offline"><span>💾</span>離線庫</div>
      <div class="tab" data-view="view-settings"><span>⚙️</span>設置</div>
    </nav>
  </div>

  <!-- Fullscreen Player Modal -->
  <div id="full-player">
    <div class="player-bg" id="fp-bg"></div>
    <div class="fp-head">
      <button class="icon-btn" id="fp-close" style="font-size:20px;">✕</button>
      <div style="text-align:center; max-width:70%;">
        <div class="song-name" id="fp-title" style="color:#fff;">曲目</div>
        <div class="song-sub" id="fp-artist" style="color:rgba(255,255,255,0.7);">歌手</div>
      </div>
      <button class="icon-btn" id="fp-dl" title="下載持久化">💾</button>
    </div>
    <div class="fp-body">
      <div class="disc" id="fp-disc">
        <img id="fp-pic" src="" alt="">
      </div>
      <div class="lrc-box" id="lrc-box">
        <div style="padding:40px; color:rgba(255,255,255,0.4); font-size:13px;">純音樂或未提供歌詞</div>
      </div>
    </div>
    <div class="fp-foot">
      <div class="slider" id="progress-bar"><div class="slider-fill" id="progress-fill"></div></div>
      <div class="time-row"><span id="time-cur">00:00</span><span id="time-dur">00:00</span></div>
      <div class="ctrls">
        <button class="icon-btn" id="ctrl-mode" style="font-size:18px;">🔁</button>
        <button class="icon-btn" id="ctrl-prev" style="font-size:22px;">⏮</button>
        <button class="play-btn" id="ctrl-play" style="font-size:22px;">▶</button>
        <button class="icon-btn" id="ctrl-next" style="font-size:22px;">⏭</button>
        <button class="icon-btn" id="ctrl-add-pl" style="font-size:18px;">➕</button>
      </div>
    </div>
  </div>

  <!-- Add to Playlist Dialog -->
  <div class="modal" id="modal-add-pl">
    <div class="modal-box">
      <div class="modal-title">收藏到自建歌單</div>
      <div class="modal-list" id="modal-pl-items"></div>
      <button class="btn btn-secondary" style="width:100%;" id="btn-modal-close">取消</button>
    </div>
  </div>

  <div id="toast"></div>
  <audio id="audio" playsinline webkit-playsinline></audio>

  <script>
    (function() {
      'use strict';

      // --- State ---
      const Store = {
        api: localStorage.getItem('jr_api') || 'http://localhost:5000',
        quality: localStorage.getItem('jr_quality') || 'lossless',
        playlists: JSON.parse(localStorage.getItem('jr_playlists') || '[]'),
        queue: [],
        index: -1,
        mode: 'loop', // 'loop', 'single', 'shuffle'
        lyrics: [],
        curLrcIdx: -1,
        currentTrack: null,
        blobUrl: null
      };

      const audio = document.getElementById('audio');

      // --- IndexedDB ---
      let db = null;
      function openDB() {
        return new Promise((res, rej) => {
          const req = indexedDB.open('JRmusicDB', 1);
          req.onupgradeneeded = e => e.target.result.createObjectStore('tracks', { keyPath: 'id' });
          req.onsuccess = e => { db = e.target.result; res(db); };
          req.onerror = rej;
        });
      }
      function dbSave(track, blob) {
        return new Promise((res, rej) => {
          const tx = db.transaction('tracks', 'readwrite');
          tx.objectStore('tracks').put({ ...track, blob });
          tx.oncomplete = res; tx.onerror = rej;
        });
      }
      function dbGet(id) {
        return new Promise(res => {
          const tx = db.transaction('tracks', 'readonly');
          const req = tx.objectStore('tracks').get(String(id));
          req.onsuccess = () => res(req.result);
          req.onerror = () => res(null);
        });
      }
      function dbGetAll() {
        return new Promise(res => {
          const tx = db.transaction('tracks', 'readonly');
          const req = tx.objectStore('tracks').getAll();
          req.onsuccess = () => res(req.result || []);
          req.onerror = () => res([]);
        });
      }
      function dbDel(id) {
        return new Promise(res => {
          const tx = db.transaction('tracks', 'readwrite');
          tx.objectStore('tracks').delete(String(id)).onsuccess = res;
        });
      }

      // --- Toast ---
      function toast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg; t.style.opacity = '1';
        setTimeout(() => t.style.opacity = '0', 2000);
      }

      // --- API ---
      async function request(path, body = null) {
        const res = await fetch(Store.api.replace(/\/+$/, '') + path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: body ? JSON.stringify(body) : null
        });
        return await res.json();
      }

      // --- LRC Parser (With Bilingual Parenthesis Extraction) ---
      function parseLRC(raw) {
        if (!raw) return [];
        const lines = raw.split('\n');
        const list = [];
        const reg = /\[(\d{2}):(\d{2})(?:\.(\d{2,3}))?\]/g;
        for (let l of lines) {
          const matches = [...l.matchAll(reg)];
          if (!matches.length) continue;
          let text = l.replace(reg, '').trim();
          if (!text) continue;
          let main = text, sub = '';
          const bMatch = text.match(/[\(（](.+?)[\)）]/);
          if (bMatch) {
            sub = bMatch[1];
            main = text.replace(bMatch[0], '').trim();
          }
          for (let m of matches) {
            const time = parseInt(m[1])*60 + parseInt(m[2]) + (m[3] ? parseInt(m[3].padEnd(3,'0').slice(0,3))/1000 : 0);
            list.push({ time, main, sub });
          }
        }
        return list.sort((a,b) => a.time - b.time);
      }

      // --- Core Playback ---
      async function playSong(song) {
        toast(`載入中: ${song.name}`);
        if (Store.blobUrl) { URL.revokeObjectURL(Store.blobUrl); Store.blobUrl = null; }
        try {
          let src = null, detail = null;
          const cached = await dbGet(song.id);
          if (cached && cached.blob) {
            src = URL.createObjectURL(cached.blob);
            detail = cached;
            toast('播放本地持久化音源');
          } else {
            const res = await request('/song', { url: String(song.id), level: Store.quality, type: 'json' });
            if (!res.success || !res.data || !res.data.url) throw new Error('解析鏈接失效');
            
            // 下載二進制 Blob 避免時效性中斷
            const cdnRes = await fetch(res.data.url, { referrerPolicy: 'no-referrer' });
            const blob = await cdnRes.blob();
            detail = {
              id: String(song.id),
              name: res.data.name,
              ar: res.data.ar_name,
              al: res.data.al_name,
              pic: res.data.pic,
              lyric: res.data.lyric
            };
            await dbSave(detail, blob);
            src = URL.createObjectURL(blob);
          }

          Store.currentTrack = detail;
          Store.blobUrl = src;
          audio.src = src;
          audio.play();

          // Sync Lyrics & UI
          Store.lyrics = parseLRC(detail.lyric);
          renderLyrics();
          updateUI(detail);
          renderOfflineList();
        } catch (e) {
          toast(`播放失敗: ${e.message}`);
        }
      }

      function updateUI(song) {
        document.getElementById('mini-pic').src = song.pic || '';
        document.getElementById('mini-name').textContent = song.name;
        document.getElementById('mini-sub').textContent = `${song.ar} - ${song.al || ''}`;
        
        document.getElementById('fp-pic').src = song.pic || '';
        document.getElementById('fp-bg').style.backgroundImage = `url(${song.pic || ''})`;
        document.getElementById('fp-title').textContent = song.name;
        document.getElementById('fp-artist').textContent = song.ar;

        if ('mediaSession' in navigator) {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: song.name, artist: song.ar, album: song.al,
            artwork: [{ src: song.pic, sizes: '512x512', type: 'image/jpeg' }]
          });
        }
      }

      function renderLyrics() {
        const box = document.getElementById('lrc-box');
        box.innerHTML = '';
        if (!Store.lyrics.length) {
          box.innerHTML = '<div style="padding:40px; color:rgba(255,255,255,0.4); font-size:13px;">純音樂或未檢測到歌詞</div>';
          return;
        }
        Store.lyrics.forEach((l, idx) => {
          const el = document.createElement('div');
          el.className = 'lrc-line';
          el.innerHTML = `<div>${l.main}</div>${l.sub ? `<div class="lrc-sub">${l.sub}</div>` : ''}`;
          el.onclick = () => { audio.currentTime = l.time; };
          box.appendChild(el);
        });
      }

      // --- Audio Engine Events ---
      audio.ontimeupdate = () => {
        const cur = audio.currentTime, dur = audio.duration || 0;
        const pct = dur ? (cur / dur) * 100 : 0;
        document.getElementById('mini-fill').style.width = pct + '%';
        document.getElementById('progress-fill').style.width = pct + '%';
        document.getElementById('time-cur').textContent = fmt(cur);
        document.getElementById('time-dur').textContent = fmt(dur);

        // Lyric Sync
        if (!Store.lyrics.length) return;
        let idx = -1;
        for (let i = 0; i < Store.lyrics.length; i++) {
          if (cur >= Store.lyrics[i].time) idx = i; else break;
        }
        if (idx !== Store.curLrcIdx && idx !== -1) {
          Store.curLrcIdx = idx;
          const box = document.getElementById('lrc-box');
          const lines = box.children;
          for (let i = 0; i < lines.length; i++) lines[i].classList.toggle('active', i === idx);
          if (lines[idx]) box.scrollTo({ top: lines[idx].offsetTop - box.clientHeight / 2 + 20, behavior: 'smooth' });
        }
      };

      audio.onplay = () => {
        document.getElementById('mini-play-btn').textContent = '⏸';
        document.getElementById('ctrl-play').textContent = '⏸';
        document.getElementById('fp-disc').classList.add('playing');
      };
      audio.onpause = () => {
        document.getElementById('mini-play-btn').textContent = '▶';
        document.getElementById('ctrl-play').textContent = '▶';
        document.getElementById('fp-disc').classList.remove('playing');
      };
      audio.onended = () => {
        if (Store.mode === 'single') { audio.currentTime = 0; audio.play(); }
        else nextTrack();
      };

      function nextTrack() {
        if (!Store.queue.length) return;
        if (Store.mode === 'shuffle') Store.index = Math.floor(Math.random() * Store.queue.length);
        else Store.index = (Store.index + 1) % Store.queue.length;
        playSong(Store.queue[Store.index]);
      }
      function prevTrack() {
        if (!Store.queue.length) return;
        Store.index = (Store.index - 1 + Store.queue.length) % Store.queue.length;
        playSong(Store.queue[Store.index]);
      }
      function fmt(t) {
        if (isNaN(t)) return '00:00';
        const m = Math.floor(t / 60), s = Math.floor(t % 60);
        return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
      }

      // --- Search & Resolve ---
      document.getElementById('btn-search').onclick = async () => {
        const q = document.getElementById('input-query').value.trim();
        if (!q) return;
        const list = document.getElementById('search-list');
        list.innerHTML = '<div style="padding:20px; text-align:center; color:var(--muted); font-size:13px;">檢索中...</div>';
        try {
          const res = await request('/search', { keyword: q, limit: 30 });
          renderSongList(res.data || [], list);
        } catch (e) { list.innerHTML = `<div style="padding:20px; color:var(--danger); font-size:13px;">錯誤: ${e.message}</div>`; }
      };

      document.getElementById('btn-resolve-pl').onclick = async () => {
        const id = document.getElementById('input-query').value.trim();
        if (!id) return toast('請在輸入框填寫歌單 ID');
        const list = document.getElementById('search-list');
        list.innerHTML = '<div style="padding:20px; text-align:center; color:var(--muted); font-size:13px;">解析歌單中...</div>';
        try {
          const res = await request('/playlist', { id });
          renderSongList(res.data?.playlist?.tracks || [], list);
        } catch (e) { list.innerHTML = `<div style="padding:20px; color:var(--danger); font-size:13px;">解析失敗: ${e.message}</div>`; }
      };

      function renderSongList(songs, container) {
        container.innerHTML = '';
        document.getElementById('results-count').textContent = `共 ${songs.length} 首`;
        songs.forEach((s, idx) => {
          const row = document.createElement('div');
          row.className = 'song-row';
          row.innerHTML = `
            <img src="${s.picUrl || s.pic || ''}" loading="lazy">
            <div class="song-info">
              <div class="song-name">${s.name}</div>
              <div class="song-sub">${s.artists || s.ar || ''} - ${s.album || s.al || ''}</div>
            </div>
            <div class="row-actions">
              <button class="icon-btn btn-add" title="添加至自建歌單">➕</button>
            </div>
          `;
          row.onclick = e => {
            if (e.target.classList.contains('btn-add')) return;
            Store.queue = songs;
            Store.index = idx;
            playSong(s);
          };
          row.querySelector('.btn-add').onclick = e => {
            e.stopPropagation();
            openAddToPLModal(s);
          };
          container.appendChild(row);
        });
      }

      // --- Custom Playlists Engine ---
      function savePlaylists() {
        localStorage.setItem('jr_playlists', JSON.stringify(Store.playlists));
        renderPlaylistsGrid();
      }

      document.getElementById('btn-create-pl').onclick = () => {
        const name = prompt('請輸入新建歌單名稱:');
        if (!name || !name.trim()) return;
        Store.playlists.push({ id: 'pl_' + Date.now(), name: name.trim(), songs: [] });
        savePlaylists();
        toast('歌單創建成功');
      };

      function renderPlaylistsGrid() {
        const grid = document.getElementById('playlists-grid');
        grid.innerHTML = '';
        if (!Store.playlists.length) {
          grid.innerHTML = '<div style="grid-column:1/-1; padding:20px; text-align:center; color:var(--muted); font-size:13px;">暫無歌單，點擊右上角新建</div>';
          return;
        }
        Store.playlists.forEach((pl, idx) => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card-icon">📂</div>
            <div class="card-title">${pl.name}</div>
            <div class="card-sub">${pl.songs.length} 首歌曲</div>
          `;
          card.onclick = () => openPlaylist(pl, idx);
          grid.appendChild(card);
        });
      }

      function openPlaylist(pl, idx) {
        document.getElementById('playlists-grid').style.display = 'none';
        const detail = document.getElementById('playlist-detail');
        detail.style.display = 'block';
        document.getElementById('pl-detail-title').textContent = `${pl.name} (${pl.songs.length})`;
        
        const list = document.getElementById('pl-songs-list');
        list.innerHTML = '';
        pl.songs.forEach((s, sIdx) => {
          const row = document.createElement('div');
          row.className = 'song-row';
          row.innerHTML = `
            <img src="${s.picUrl || s.pic || ''}">
            <div class="song-info">
              <div class="song-name">${s.name}</div>
              <div class="song-sub">${s.artists || s.ar || ''}</div>
            </div>
            <button class="icon-btn" style="color:var(--danger);" title="刪除">🗑</button>
          `;
          row.onclick = e => {
            if (e.target.tagName === 'BUTTON') return;
            Store.queue = pl.songs;
            Store.index = sIdx;
            playSong(s);
          };
          row.querySelector('button').onclick = () => {
            pl.songs.splice(sIdx, 1);
            savePlaylists();
            openPlaylist(pl, idx);
          };
          list.appendChild(row);
        });
      }

      document.getElementById('btn-back-pl').onclick = () => {
        document.getElementById('playlist-detail').style.display = 'none';
        document.getElementById('playlists-grid').style.display = 'grid';
      };

      function openAddToPLModal(song) {
        const modal = document.getElementById('modal-add-pl');
        const list = document.getElementById('modal-pl-items');
        list.innerHTML = '';
        if (!Store.playlists.length) {
          list.innerHTML = '<div style="color:var(--muted); font-size:12px; padding:10px;">請先在「自建歌單」標籤新建歌單</div>';
        } else {
          Store.playlists.forEach(pl => {
            const btn = document.createElement('div');
            btn.className = 'modal-item';
            btn.textContent = `${pl.name} (${pl.songs.length})`;
            btn.onclick = () => {
              if (!pl.songs.some(x => String(x.id) === String(song.id))) {
                pl.songs.push(song);
                savePlaylists();
                toast(`已加入: ${pl.name}`);
              } else toast('歌曲已在歌單中');
              modal.classList.remove('active');
            };
            list.appendChild(btn);
          });
        }
        modal.classList.add('active');
      }
      document.getElementById('btn-modal-close').onclick = () => document.getElementById('modal-add-pl').classList.remove('active');

      // --- Offline View ---
      async function renderOfflineList() {
        const list = document.getElementById('offline-list');
        const tracks = await dbGetAll();
        list.innerHTML = '';
        if (!tracks.length) {
          list.innerHTML = '<div style="padding:20px; text-align:center; color:var(--muted); font-size:13px;">無離線音源，播放或點擊下載自動落盤</div>';
          return;
        }
        tracks.forEach((t, idx) => {
          const row = document.createElement('div');
          row.className = 'song-row';
          row.innerHTML = `
            <img src="${t.pic || ''}">
            <div class="song-info">
              <div class="song-name">${t.name}</div>
              <div class="song-sub">${t.ar || ''} · [持久化就緒]</div>
            </div>
            <button class="icon-btn" style="color:var(--danger);">🗑</button>
          `;
          row.onclick = e => {
            if (e.target.tagName === 'BUTTON') return;
            Store.queue = tracks; Store.index = idx;
            playSong(t);
          };
          row.querySelector('button').onclick = async () => {
            await dbDel(t.id);
            renderOfflineList();
            toast('已從本機移除');
          };
          list.appendChild(row);
        });
      }
      document.getElementById('btn-clear-db').onclick = async () => {
        if (confirm('確定清空所有本地持久化音頻？')) {
          const tracks = await dbGetAll();
          for (let t of tracks) await dbDel(t.id);
          renderOfflineList();
        }
      };

      // --- Controls & Sliders ---
      document.getElementById('mini-player').onclick = () => document.getElementById('full-player').classList.add('open');
      document.getElementById('fp-close').onclick = () => document.getElementById('full-player').classList.remove('open');
      document.getElementById('mini-play-btn').onclick = e => { e.stopPropagation(); audio.paused ? audio.play() : audio.pause(); };
      document.getElementById('ctrl-play').onclick = () => audio.paused ? audio.play() : audio.pause();
      document.getElementById('ctrl-prev').onclick = prevTrack;
      document.getElementById('ctrl-next').onclick = nextTrack;
      document.getElementById('ctrl-mode').onclick = () => {
        Store.mode = Store.mode === 'loop' ? 'single' : (Store.mode === 'single' ? 'shuffle' : 'loop');
        document.getElementById('ctrl-mode').textContent = Store.mode === 'loop' ? '🔁' : (Store.mode === 'single' ? '🔂' : '🔀');
        toast(`模式: ${Store.mode}`);
      };
      document.getElementById('progress-bar').onclick = e => {
        const rect = e.currentTarget.getBoundingClientRect();
        audio.currentTime = ((e.clientX - rect.left) / rect.width) * (audio.duration || 0);
      };
      document.getElementById('fp-dl').onclick = () => {
        if (Store.currentTrack) toast(`已落盤本地: ${Store.currentTrack.name}`);
      };
      document.getElementById('ctrl-add-pl').onclick = () => {
        if (Store.currentTrack) openAddToPLModal(Store.currentTrack);
      };

      // --- Navigation ---
      function switchTab(viewId) {
        document.querySelectorAll('.view-pane').forEach(p => p.classList.toggle('active', p.id === viewId));
        document.querySelectorAll('.nav-btn, .tab').forEach(b => b.classList.toggle('active', b.dataset.view === viewId));
        if (viewId === 'view-playlists') renderPlaylistsGrid();
        if (viewId === 'view-offline') renderOfflineList();
      }
      document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => switchTab(b.dataset.view));

      // --- Settings Init ---
      document.getElementById('cfg-api').onchange = e => { Store.api = e.target.value.trim(); localStorage.setItem('jr_api', Store.api); toast('API 已更新'); };
      document.getElementById('cfg-quality').onchange = e => { Store.quality = e.target.value; localStorage.setItem('jr_quality', Store.quality); toast('音質檔位已更新'); };

      // --- Init Boot ---
      openDB().then(() => {
        renderPlaylistsGrid();
        renderOfflineList();
      });
    })();
  </script>
</body>
</html>
