<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Phira Pure Engine - Hold Fixed</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      touch-action: none;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px 26px;
      z-index: 10;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      text-shadow: 0 2px 6px rgba(0,0,0,0.85);
    }
    .hud-combo {
      text-align: center;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 2px;
      line-height: 1;
    }
    .hud-combo span {
      font-size: 13px;
      font-weight: normal;
      display: block;
      opacity: 0.8;
      letter-spacing: 1px;
      margin-top: 4px;
    }
    /* 导入遮罩层 */
    #upload-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(6, 6, 10, 0.95);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 30;
      gap: 16px;
    }
    .upload-card-group {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      width: 90%;
      max-width: 800px;
    }
    .drop-zone {
      flex: 1 1 320px;
      min-width: 280px;
      padding: 24px 16px;
      border: 2px dashed #304ffe;
      border-radius: 16px;
      text-align: center;
      background: rgba(48, 79, 254, 0.06);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .drop-zone.ready {
      border-color: #00e676;
      background: rgba(0, 230, 118, 0.08);
    }
    .btn {
      padding: 14px 50px;
      background: linear-gradient(135deg, #2979ff, #00e5ff);
      border: none;
      border-radius: 30px;
      color: #fff;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 229, 255, 0.35);
    }
    .btn:disabled {
      background: #333;
      box-shadow: none;
      cursor: not-allowed;
      color: #777;
    }
    #status-text {
      font-size: 13px;
      color: #90a4ae;
      text-align: center;
      min-height: 20px;
    }
    .slider-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.06);
      padding: 10px 20px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 14px;
      color: #cfd8dc;
    }
    .slider-box input[type="range"] {
      cursor: pointer;
      width: 140px;
    }
    input[type="file"] {
      display: none;
    }

    /* 结算面板样式 */
    #result-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(4, 6, 12, 0.94);
      backdrop-filter: blur(20px);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 40;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    .result-card {
      width: 90%;
      max-width: 720px;
      display: flex;
      flex-direction: row;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px;
      gap: 30px;
      align-items: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }
    .result-rank {
      font-size: 90px;
      font-weight: 900;
      color: #ffd700;
      text-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
      width: 140px;
      text-align: center;
    }
    .result-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .result-score {
      font-size: 40px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .result-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 16px;
      font-size: 14px;
      color: #b0bec5;
    }
    .stat-val {
      font-weight: bold;
      color: #fff;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
  <div id="canvas-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <div id="ui-overlay">
    <div class="hud-top">
      <div>
        <div id="song-name" style="font-weight: bold; font-size: 18px;">Cryogenic</div>
        <div id="song-desc" style="opacity: 0.7; font-size: 13px;">等待载入...</div>
      </div>
      <div class="hud-combo">
        <div id="combo-num">0</div>
        <span>COMBO</span>
      </div>
      <div style="text-align: right;">
        <div id="score-val" style="font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums;">0000000</div>
        <div id="acc-val" style="opacity: 0.7; font-size: 13px;">100.00%</div>
      </div>
    </div>
  </div>

  <div id="upload-panel">
    <h1 style="letter-spacing: 5px; font-weight: 300; font-size: 28px;">PHIRA ZIP ENGINE</h1>
    <div class="upload-card-group">
      <div class="drop-zone" id="chart-drop">
        <h3 style="margin-bottom: 8px;">1. 导入谱面 ZIP (5文件)</h3>
        <p style="font-size: 12px; opacity: 0.8; line-height: 1.6;">
          包含：info.txt、info.yml、JSON、歌曲、曲绘
        </p>
        <span id="chart-file-name" style="display:block; margin-top:10px; font-size:12px; color:#00e5ff;">未选择</span>
        <input type="file" id="chart-input" accept=".zip">
      </div>

      <div class="drop-zone" id="skin-drop">
        <h3 style="margin-bottom: 8px;">2. 导入皮肤与音效 ZIP</h3>
        <p style="font-size: 12px; opacity: 0.8; line-height: 1.6;">
          包含：贴图及 _mh、hit_fx 爆弹序列图、<br>音效与 ending.mp3
        </p>
        <span id="skin-file-name" style="display:block; margin-top:10px; font-size:12px; color:#00e5ff;">未选择 (可选)</span>
        <input type="file" id="skin-input" accept=".zip">
      </div>
    </div>

    <!-- 用户自定义音符大小调节滑块 -->
    <div class="slider-box">
      <span>音符大小 (Note Size):</span>
      <input type="range" id="size-slider" min="0.6" max="2.2" step="0.05" value="1.25">
      <span id="size-val" style="color:#00e5ff; font-weight:bold;">1.25x</span>
    </div>

    <div id="status-text">请先导入谱面 ZIP 包</div>
    <button class="btn" id="start-btn" disabled>开始游玩</button>
  </div>

  <!-- 结算界面 -->
  <div id="result-panel">
    <div class="result-card">
      <div class="result-rank" id="res-rank">V</div>
      <div class="result-info">
        <div id="res-title" style="font-size: 20px; font-weight: 700;">Cryogenic</div>
        <div class="result-score" id="res-score">0982540</div>
        <div class="result-stats">
          <div>ACC: <span class="stat-val" id="res-acc">98.25%</span></div>
          <div>Max Combo: <span class="stat-val" id="res-combo">620</span></div>
          <div>Perfect: <span class="stat-val" style="color:#00e5ff;" id="res-perf">580</span></div>
          <div>Good: <span class="stat-val" style="color:#ffd54f;" id="res-good">20</span></div>
          <div>Miss: <span class="stat-val" style="color:#ff1744;" id="res-miss">5</span></div>
        </div>
      </div>
    </div>
    <button class="btn" style="margin-top: 24px;" onclick="location.reload()">重新载入</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let audioCtx = null;
    let bgmBuffer = null;
    let endingBuffer = null;
    let bgmSource = null;
    let startTime = 0;
    let isPlaying = false;
    let isEnded = false;

    let userNoteScale = 1.25;
    const sizeSlider = document.getElementById('size-slider');
    const sizeVal = document.getElementById('size-val');
    sizeSlider.oninput = (e) => {
      userNoteScale = parseFloat(e.target.value);
      sizeVal.innerText = userNoteScale.toFixed(2) + "x";
    };

    let songMeta = {
      title: "Cryogenic",
      level: "IN Lv.15",
      composer: "Camellia ft. Petra Gurin",
      charter: "「HD」 Falsus",
      offset: 0.0
    };

    const ASSETS = {
      chartJson: null,
      bgImage: null,
      hitFxImage: null,
      audioBuffers: {},
      images: {}
    };

    let parsedLines = [];
    let score = 0, combo = 0, maxCombo = 0;
    let perfectCount = 0, goodCount = 0, missCount = 0, totalNotes = 0;
    let W = 0, H = 0, scale = 1;

    const hitParticles = [];

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
      scale = Math.min(W / 1280, H / 720);
    }
    window.addEventListener('resize', resize);
    resize();

    async function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') await audioCtx.resume();
    }

    function playHitSound(type) {
      if (!audioCtx) return;
      const map = { 1: "Tap", 2: "Drag", 3: "Hold", 4: "Flick" };
      const name = map[type];
      if (ASSETS.audioBuffers[name]) {
        const s = audioCtx.createBufferSource();
        s.buffer = ASSETS.audioBuffers[name];
        s.connect(audioCtx.destination);
        s.start(0);
        return;
      }
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const t = audioCtx.currentTime;
        if (type === 1) {
          osc.type = "sine";
          osc.frequency.setValueAtTime(1400, t);
          osc.frequency.exponentialRampToValueAtTime(300, t + 0.04);
          gain.gain.setValueAtTime(0.7, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
          osc.start(t);
          osc.stop(t + 0.04);
        } else if (type === 2) {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(750, t);
          gain.gain.setValueAtTime(0.35, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.025);
          osc.start(t);
          osc.stop(t + 0.025);
        } else if (type === 4) {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(900, t);
          osc.frequency.linearRampToValueAtTime(2400, t + 0.06);
          gain.gain.setValueAtTime(0.6, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
          osc.start(t);
          osc.stop(t + 0.06);
        }
      } catch (e) {}
    }

    function spawnHitFX(worldX, worldY, isPerfect) {
      hitParticles.push({
        x: worldX,
        y: worldY,
        startTime: performance.now(),
        duration: 340,
        isPerfect: isPerfect
      });
    }

    function parseInfoString(str) {
      const res = {};
      const lines = str.split(/\r?\n/);
      lines.forEach(l => {
        const idx = l.indexOf(':');
        if (idx > -1) {
          const k = l.slice(0, idx).trim().replace(/^#\s*/, '');
          let v = l.slice(idx + 1).trim();
          v = v.replace(/^["']|["']$/g, '');
          if (k) res[k] = v;
        }
      });
      return res;
    }

    // --- ZIP 导入逻辑 ---
    const chartDrop = document.getElementById('chart-drop');
    const chartInput = document.getElementById('chart-input');
    const skinDrop = document.getElementById('skin-drop');
    const skinInput = document.getElementById('skin-input');
    const statusText = document.getElementById('status-text');
    const startBtn = document.getElementById('start-btn');

    chartDrop.onclick = () => chartInput.click();
    skinDrop.onclick = () => skinInput.click();

    chartInput.onchange = (e) => { if (e.target.files[0]) handleChartZip(e.target.files[0]); };
    skinInput.onchange = (e) => { if (e.target.files[0]) handleSkinZip(e.target.files[0]); };

    async function handleChartZip(file) {
      await initAudio();
      statusText.innerText = "正在读取谱面 ZIP 包 (包含 5 文件)...";
      try {
        const zip = await JSZip.loadAsync(file);
        let infoData = {};
        const entries = zip.files;

        for (let path in entries) {
          const l = path.toLowerCase();
          if (l.endsWith('info.yml') || l.endsWith('info.yaml') || l.endsWith('info.txt')) {
            const txt = await entries[path].async('text');
            infoData = Object.assign(infoData, parseInfoString(txt));
          }
        }

        if (infoData.name) songMeta.title = infoData.name;
        if (infoData.level) songMeta.level = infoData.level;
        if (infoData.composer) songMeta.composer = infoData.composer;
        if (infoData.charter) songMeta.charter = infoData.charter;
        if (infoData.offset !== undefined) songMeta.offset = parseFloat(infoData.offset) || 0;

        document.getElementById('song-name').innerText = songMeta.title;
        document.getElementById('song-desc').innerText = `${songMeta.level} | ${songMeta.composer}`;

        for (let path in entries) {
          const entry = entries[path];
          if (entry.dir) continue;
          const l = path.toLowerCase();

          if (l.endsWith('.json')) {
            const txt = await entry.async('text');
            const j = JSON.parse(txt);
            if (j.judgeLineList) ASSETS.chartJson = j;
          } else if (l.endsWith('.ogg') || l.endsWith('.mp3') || l.endsWith('.wav')) {
            const ab = await entry.async('arraybuffer');
            bgmBuffer = await audioCtx.decodeAudioData(ab);
          } else if (l.endsWith('.png') || l.endsWith('.jpg') || l.endsWith('.jpeg')) {
            const blob = await entry.async('blob');
            const img = new Image();
            img.src = URL.createObjectURL(blob);
            await new Promise(r => { img.onload = r; });
            ASSETS.bgImage = img;
          }
        }

        if (!ASSETS.chartJson) throw new Error("未在谱面 ZIP 中找到合法的 judgeLineList JSON 谱面！");
        if (!bgmBuffer) throw new Error("未在谱面 ZIP 中找到歌曲音频！");

        chartDrop.classList.add('ready');
        document.getElementById('chart-file-name').innerText = `已载入: ${file.name}`;
        statusText.innerText = "谱面 ZIP 加载完成！可直接开始或导入皮肤/音效 ZIP。";
        startBtn.disabled = false;
      } catch (err) {
        statusText.innerText = `谱面读取失败: ${err.message}`;
      }
    }

    async function handleSkinZip(file) {
      await initAudio();
      statusText.innerText = "正在解压皮肤与音效 ZIP 包...";
      try {
        const zip = await JSZip.loadAsync(file);
        for (let path in zip.files) {
          const entry = zip.files[path];
          if (entry.dir) continue;
          const l = path.toLowerCase();

          if (l.endsWith('.png') || l.endsWith('.jpg')) {
            const blob = await entry.async('blob');
            const img = new Image();
            img.src = URL.createObjectURL(blob);
            await new Promise(r => { img.onload = r; });

            if (l.includes('hit_fx') || l.includes('hitfx') || l.includes('image_7')) {
              ASSETS.hitFxImage = img;
            } else if (l.includes('tap') || l.includes('click')) {
              ASSETS.images[l.includes('mh') ? 'Tap_mh' : 'Tap'] = img;
            } else if (l.includes('drag')) {
              ASSETS.images[l.includes('mh') ? 'Drag_mh' : 'Drag'] = img;
            } else if (l.includes('hold')) {
              ASSETS.images[l.includes('mh') ? 'Hold_mh' : 'Hold'] = img;
            } else if (l.includes('flick')) {
              ASSETS.images[l.includes('mh') ? 'Flick_mh' : 'Flick'] = img;
            }
          } else if (l.endsWith('.ogg') || l.endsWith('.wav') || l.endsWith('.mp3')) {
            const ab = await entry.async('arraybuffer');
            const buf = await audioCtx.decodeAudioData(ab);

            if (l.includes('tap') || l.includes('click')) ASSETS.audioBuffers['Tap'] = buf;
            else if (l.includes('drag')) ASSETS.audioBuffers['Drag'] = buf;
            else if (l.includes('hold')) ASSETS.audioBuffers['Hold'] = buf;
            else if (l.includes('flick')) ASSETS.audioBuffers['Flick'] = buf;
            else if (l.includes('ending')) endingBuffer = buf;
          }
        }

        skinDrop.classList.add('ready');
        document.getElementById('skin-file-name').innerText = `已载入: ${file.name}`;
        statusText.innerText = "皮肤与音效包解压装配完成！";
      } catch (err) {
        statusText.innerText = `皮肤包读取异常: ${err.message}`;
      }
    }

    // --- 严谨预处理与积分表 ---
    function prepareChart() {
      if (!ASSETS.chartJson || !ASSETS.chartJson.judgeLineList) return;
      totalNotes = 0;

      const timeCount = new Map();
      ASSETS.chartJson.judgeLineList.forEach(line => {
        const allNotes = [...(line.notesAbove || []), ...(line.notesBelow || [])];
        allNotes.forEach(n => {
          const t = Math.round(n.time);
          timeCount.set(t, (timeCount.get(t) || 0) + 1);
        });
      });

      parsedLines = ASSETS.chartJson.judgeLineList.map((line, idx) => {
        const bpm = line.bpm || 140.0;
        const tickToSec = (tick) => (tick / 32) * (60 / bpm);
        const secToTick = (sec) => (sec / (60 / bpm)) * 32;

        let accumulatedFloor = 0;
        const speedEvents = (line.speedEvents || []).map(e => {
          const startFloor = accumulatedFloor;
          const duration = e.endTime - e.startTime;
          const deltaFloor = (duration / 32) * (e.value / (bpm / 60));
          accumulatedFloor += deltaFloor;
          return {
            startTime: e.startTime,
            endTime: e.endTime,
            value: e.value,
            startFloor: startFloor,
            endFloor: accumulatedFloor
          };
        });

        function getFloorPosAtTick(tick) {
          if (speedEvents.length === 0) return 0;
          if (tick <= speedEvents[0].startTime) return 0;
          const last = speedEvents[speedEvents.length - 1];
          if (tick >= last.endTime) return last.endFloor;

          for (let i = 0; i < speedEvents.length; i++) {
            const ev = speedEvents[i];
            if (tick >= ev.startTime && tick <= ev.endTime) {
              const p = (tick - ev.startTime) / (ev.endTime - ev.startTime || 1);
              return ev.startFloor + (ev.endFloor - ev.startFloor) * p;
            }
          }
          return 0;
        }

        function formatNotes(notes, isAbove) {
          return (notes || []).map(n => {
            totalNotes++;
            const startFloor = (n.floorPosition !== undefined) ? n.floorPosition : getFloorPosAtTick(n.time);
            const endFloor = getFloorPosAtTick(n.time + (n.holdTime || 0));
            const isMulti = (timeCount.get(Math.round(n.time)) || 0) >= 2;

            return {
              type: n.type,
              time: n.time,
              timeSec: tickToSec(n.time),
              holdTime: n.holdTime || 0,
              holdTimeSec: tickToSec(n.holdTime || 0),
              x: n.positionX,
              speed: n.speed || 1.0,
              startFloor: startFloor,
              endFloor: endFloor,
              isAbove: isAbove,
              isMulti: isMulti,
              hit: false,
              miss: false,
              holding: false,
              headHit: false,
              lastTouchTime: 0
            };
          });
        }

        return {
          id: idx,
          bpm: bpm,
          tickToSec: tickToSec,
          secToTick: secToTick,
          getFloorPosAtTick: getFloorPosAtTick,
          moveEvents: line.judgeLineMoveEvents || [],
          rotateEvents: line.rotateEvents || line.judgeLineRotateEvents || [],
          disappearEvents: line.judgeLineDisappearEvents || [],
          notes: [...formatNotes(line.notesAbove, true), ...formatNotes(line.notesBelow, false)]
        };
      });
    }

    function evalNumberEvent(events, curTick, defaultVal) {
      if (!events || events.length === 0) return defaultVal;
      if (curTick <= events[0].startTime) return events[0].start;
      const last = events[events.length - 1];
      if (curTick >= last.endTime) return last.end;

      for (let i = 0; i < events.length; i++) {
        const ev = events[i];
        if (curTick >= ev.startTime && curTick <= ev.endTime) {
          const t = (curTick - ev.startTime) / (ev.endTime - ev.startTime || 1);
          return ev.start + (ev.end - ev.start) * t;
        }
      }
      return defaultVal;
    }

    function evalMoveEvent(events, curTick) {
      if (!events || events.length === 0) return { x: 0.5, y: 0.5 };
      if (curTick <= events[0].startTime) return { x: events[0].start, y: events[0].start2 ?? 0.5 };
      const last = events[events.length - 1];
      if (curTick >= last.endTime) return { x: last.end, y: last.end2 ?? 0.5 };

      for (let i = 0; i < events.length; i++) {
        const ev = events[i];
        if (curTick >= ev.startTime && curTick <= ev.endTime) {
          const t = (curTick - ev.startTime) / (ev.endTime - ev.startTime || 1);
          return {
            x: ev.start + (ev.end - ev.start) * t,
            y: (ev.start2 ?? 0.5) + ((ev.end2 ?? 0.5) - (ev.start2 ?? 0.5)) * t
          };
        }
      }
      return { x: 0.5, y: 0.5 };
    }

    // --- 触控响应逻辑 ---
    const activeTouches = new Map();

    window.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      activeTouches.set(e.pointerId, {
        x: e.clientX,
        y: e.clientY,
        lastX: e.clientX,
        lastY: e.clientY,
        startTime: performance.now()
      });
      checkHits(e.clientX, e.clientY, 'tap');
    }, { passive: false });

    window.addEventListener('pointermove', (e) => {
      e.preventDefault();
      if (activeTouches.has(e.pointerId)) {
        const p = activeTouches.get(e.pointerId);
        const dx = e.clientX - p.lastX;
        const dy = e.clientY - p.lastY;
        const dist = Math.hypot(dx, dy);
        const isFlick = dist > 14;

        p.lastX = e.clientX;
        p.lastY = e.clientY;
        p.x = e.clientX;
        p.y = e.clientY;

        if (isFlick) checkHits(e.clientX, e.clientY, 'flick');
        checkHits(e.clientX, e.clientY, 'drag');
      }
    }, { passive: false });

    function onPointerUp(e) { activeTouches.delete(e.pointerId); }
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);

    // 瞬时打击判定 (Tap, Drag, Flick, Hold起始击打)
    function checkHits(screenX, screenY, inputType) {
      if (!isPlaying) return;
      const curTime = (audioCtx.currentTime - startTime) + (songMeta.offset || 0);

      parsedLines.forEach(line => {
        const curTick = line.secToTick(curTime);
        const linePos = evalMoveEvent(line.moveEvents, curTick);
        const rotDeg = evalNumberEvent(line.rotateEvents, curTick, 0);
        const curFloorPos = line.getFloorPosAtTick(curTick);

        const lx = linePos.x * W;
        const ly = (1.0 - linePos.y) * H;
        const rad = (-rotDeg * Math.PI) / 180;

        const dx = screenX - lx;
        const dy = screenY - ly;
        const touchLocalX = dx * Math.cos(rad) - dy * Math.sin(rad);
        const touchLocalY = dx * Math.sin(rad) + dy * Math.cos(rad);

        line.notes.forEach(note => {
          if (note.hit || note.miss) return;
          const dt = curTime - note.timeSec;

          const floorDiff = note.startFloor - curFloorPos;
          const dist = floorDiff * 380 * scale;
          const noteLocalY = note.isAbove ? -dist : dist;
          const noteLocalX = (note.x / 9) * (W * 0.42);

          const vertDist = Math.abs(touchLocalY - noteLocalY);
          const horizDist = Math.abs(touchLocalX - noteLocalX);

          const vertThreshold = 110 * scale * userNoteScale;
          const horizThreshold = 120 * scale * userNoteScale;

          if (horizDist < horizThreshold && vertDist < vertThreshold) {
            const hitWorldX = lx + noteLocalX * Math.cos(-rad);
            const hitWorldY = ly + noteLocalX * Math.sin(-rad);

            if (note.type === 1 && inputType === 'tap' && Math.abs(dt) <= 0.16) {
              note.hit = true;
              playHitSound(1);
              const isPerf = Math.abs(dt) <= 0.08;
              registerHit(isPerf ? 1.0 : 0.65);
              spawnHitFX(hitWorldX, hitWorldY, isPerf);
            } else if (note.type === 2 && Math.abs(dt) <= 0.18) {
              note.hit = true;
              playHitSound(2);
              registerHit(1.0);
              spawnHitFX(hitWorldX, hitWorldY, true);
            } else if (note.type === 4 && inputType === 'flick' && Math.abs(dt) <= 0.18) {
              note.hit = true;
              playHitSound(4);
              registerHit(1.0);
              spawnHitFX(hitWorldX, hitWorldY, true);
            } else if (note.type === 3) {
              // Hold 头部触发：首次 Tap 击中
              if (inputType === 'tap' && Math.abs(dt) <= 0.16 && !note.headHit) {
                note.headHit = true;
                note.holding = true;
                note.lastTouchTime = curTime;
                playHitSound(1);
                spawnHitFX(hitWorldX, hitWorldY, true);
              }
            }
          }
        });
      });
    }

    // 逐帧主动轮询按压中的 Hold（彻底解决“手按着不动断触”的问题）
    function updateHoldingStates(curTime) {
      if (activeTouches.size === 0) return;

      parsedLines.forEach(line => {
        const curTick = line.secToTick(curTime);
        const linePos = evalMoveEvent(line.moveEvents, curTick);
        const rotDeg = evalNumberEvent(line.rotateEvents, curTick, 0);

        const lx = linePos.x * W;
        const ly = (1.0 - linePos.y) * H;
        const rad = (-rotDeg * Math.PI) / 180;

        line.notes.forEach(note => {
          if (note.type !== 3 || !note.headHit || note.hit || note.miss) return;
          if (curTime < note.timeSec || curTime > note.timeSec + note.holdTimeSec) return;

          const noteLocalX = (note.x / 9) * (W * 0.42);
          const horizThreshold = 140 * scale * userNoteScale;
          const vertThreshold = 180 * scale * userNoteScale; // 长按中的贴线宽容度加大

          // 遍历屏幕上每一根手指
          for (let [id, touch] of activeTouches) {
            const dx = touch.x - lx;
            const dy = touch.y - ly;
            const tX = dx * Math.cos(rad) - dy * Math.sin(rad);
            const tY = dx * Math.sin(rad) + dy * Math.cos(rad);

            // 手指只要在判定线附近的对应轨道按着
            if (Math.abs(tX - noteLocalX) < horizThreshold && Math.abs(tY) < vertThreshold) {
              note.holding = true;
              note.lastTouchTime = curTime;
              break;
            }
          }
        });
      });
    }

    function registerHit(weight) {
      if (weight === 1.0) perfectCount++;
      else goodCount++;
      combo++;
      if (combo > maxCombo) maxCombo = combo;
      updateHUD();
    }

    function registerMiss() {
      missCount++;
      combo = 0;
      updateHUD();
    }

    function updateHUD() {
      const processed = perfectCount + goodCount + missCount;
      const totalScore = processed === 0 ? 0 : Math.round(((perfectCount + goodCount * 0.65) / totalNotes) * 1000000);
      const acc = processed === 0 ? 100 : (((perfectCount + goodCount * 0.65) / processed) * 100);

      document.getElementById('combo-num').innerText = combo;
      document.getElementById('score-val').innerText = totalScore.toString().padStart(7, '0');
      document.getElementById('acc-val').innerText = acc.toFixed(2) + '%';
    }

    function renderHitFX(now) {
      for (let i = hitParticles.length - 1; i >= 0; i--) {
        const p = hitParticles[i];
        const elapsed = now - p.startTime;
        if (elapsed >= p.duration) {
          hitParticles.splice(i, 1);
          continue;
        }

        const progress = elapsed / p.duration;
        const frameIndex = Math.min(29, Math.floor(progress * 30));
        const col = frameIndex % 5;
        const row = Math.floor(frameIndex / 5);

        ctx.save();
        ctx.translate(p.x, p.y);

        if (ASSETS.hitFxImage) {
          const img = ASSETS.hitFxImage;
          const fw = img.width / 5;
          const fh = img.height / 6;
          const renderSize = 145 * scale * userNoteScale;

          ctx.drawImage(img, col * fw, row * fh, fw, fh, -renderSize / 2, -renderSize / 2, renderSize, renderSize);
        } else {
          ctx.strokeStyle = p.isPerfect ? '#ffe082' : '#80deea';
          ctx.lineWidth = 3.5 * (1 - progress);
          ctx.beginPath();
          ctx.arc(0, 0, (35 + progress * 45) * scale * userNoteScale, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      }
    }

    // --- 主渲染管线 ---
    function render() {
      if (!isPlaying) return;

      const now = performance.now();
      const curSec = (audioCtx.currentTime - startTime) + (songMeta.offset || 0);

      // 每帧轮询长按音符手指按压
      updateHoldingStates(curSec);

      ctx.clearRect(0, 0, W, H);

      // 1. 曲绘背景
      if (ASSETS.bgImage) {
        ctx.save();
        ctx.globalAlpha = 0.35;
        const img = ASSETS.bgImage;
        const imgRatio = img.width / img.height;
        const screenRatio = W / H;
        let dw, dh, dx, dy;
        if (screenRatio > imgRatio) {
          dw = W; dh = W / imgRatio; dx = 0; dy = (H - dh) / 2;
        } else {
          dh = H; dw = H * imgRatio; dx = (W - dw) / 2; dy = 0;
        }
        ctx.drawImage(img, dx, dy, dw, dh);
        ctx.restore();
      }

      // 2. 判定线与音符
      parsedLines.forEach(line => {
        const curTick = line.secToTick(curSec);
        const linePos = evalMoveEvent(line.moveEvents, curTick);
        const rotDeg = evalNumberEvent(line.rotateEvents, curTick, 0);
        const lineAlpha = evalNumberEvent(line.disappearEvents, curTick, 1.0);
        const curFloorPos = line.getFloorPosAtTick(curTick);

        const lx = linePos.x * W;
        const ly = (1.0 - linePos.y) * H;

        ctx.save();
        ctx.translate(lx, ly);
        ctx.rotate((rotDeg * Math.PI) / 180);

        if (lineAlpha > 0.01) {
          ctx.save();
          ctx.globalAlpha = lineAlpha;
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 3.5 * scale;
          ctx.shadowColor = '#ffffff';
          ctx.shadowBlur = 5 * scale;
          ctx.beginPath();
          ctx.moveTo(-W * 4, 0);
          ctx.lineTo(W * 4, 0);
          ctx.stroke();
          ctx.restore();
        }

        line.notes.forEach(note => {
          if (note.hit) return;

          // 普通音符超时判定
          if (note.type !== 3 && curSec - note.timeSec > 0.18 && !note.miss) {
            note.miss = true;
            registerMiss();
            return;
          }

          // Hold 音符生命周期逻辑
          if (note.type === 3) {
            // 未按且超时未激活
            if (!note.headHit && curSec - note.timeSec > 0.18 && !note.miss) {
              note.miss = true;
              registerMiss();
              return;
            }

            // 已激活：检测断触 (容错时间扩充到 0.28s)
            if (note.headHit && !note.miss) {
              if (curSec > note.lastTouchTime + 0.28 && curSec < note.timeSec + note.holdTimeSec) {
                note.miss = true;
                note.holding = false;
                registerMiss();
                return;
              }
            }

            // Hold 尾部完成结算
            if (note.headHit && curSec >= note.timeSec + note.holdTimeSec) {
              note.hit = true;
              registerHit(1.0);
              const noteLocalX = (note.x / 9) * (W * 0.42);
              const rad = (-rotDeg * Math.PI) / 180;
              spawnHitFX(lx + noteLocalX * Math.cos(-rad), ly + noteLocalX * Math.sin(-rad), true);
              return;
            }
          }

          const timeToHit = note.timeSec - curSec;
          if (timeToHit < -0.25 || timeToHit > 2.2) return;

          // 核心落点与垂直对齐
          const floorDiff = note.startFloor - curFloorPos;
          const dist = floorDiff * 380 * scale;
          const noteY = note.isAbove ? -dist : dist;
          const noteX = (note.x / 9) * (W * 0.42);

          if (Math.abs(noteY) > H * 1.5) return;

          ctx.save();
          ctx.translate(noteX, noteY);

          const nw = 120 * scale * userNoteScale;
          const nh = 18 * scale * userNoteScale;
          const isMh = note.isMulti;

          if (note.type === 1) { // Tap
            const img = isMh ? ASSETS.images['Tap_mh'] : ASSETS.images['Tap'];
            if (img) ctx.drawImage(img, -nw / 2, -nh / 2, nw, nh);
            else {
              ctx.fillStyle = isMh ? '#ffeb3b' : '#03a9f4';
              ctx.fillRect(-nw / 2, -nh / 2, nw, nh);
              ctx.strokeStyle = '#fff';
              ctx.strokeRect(-nw / 2, -nh / 2, nw, nh);
            }
          } else if (note.type === 2) { // Drag
            const img = isMh ? ASSETS.images['Drag_mh'] : ASSETS.images['Drag'];
            if (img) ctx.drawImage(img, -nw / 2, -nh / 2, nw, nh);
            else {
              ctx.fillStyle = '#ffeb3b';
              ctx.fillRect(-nw / 2.2, -nh / 2.5, nw / 1.1, nh / 1.25);
            }
          } else if (note.type === 3) { // Hold (彻底删除多余的 Tap 头部绘制)
            let holdFloorSpan = Math.max(0.01, note.endFloor - note.startFloor);
            // 实时修剪变短：被按住时推平到判定线上
            if (note.headHit) {
              const remainingFloor = Math.max(0, note.endFloor - curFloorPos);
              holdFloorSpan = remainingFloor;
            }
            const holdLen = holdFloorSpan * 380 * scale;
            const holdImg = isMh ? ASSETS.images['Hold_mh'] : ASSETS.images['Hold'];

            if (holdImg) {
              // 直接以 Hold 贴图的头部对准 (0,0) 开始绘制，严禁额外绘制 Tap
              if (note.isAbove) ctx.drawImage(holdImg, -nw / 2, -holdLen, nw, holdLen);
              else ctx.drawImage(holdImg, -nw / 2, 0, nw, holdLen);
            } else {
              ctx.fillStyle = isMh ? 'rgba(255, 235, 59, 0.45)' : 'rgba(3, 169, 244, 0.4)';
              if (note.isAbove) ctx.fillRect(-nw / 2, -holdLen, nw, holdLen);
              else ctx.fillRect(-nw / 2, 0, nw, holdLen);
            }
          } else if (note.type === 4) { // Flick
            const img = isMh ? ASSETS.images['Flick_mh'] : ASSETS.images['Flick'];
            if (img) ctx.drawImage(img, -nw / 2, -nh / 2, nw, nh);
            else {
              ctx.fillStyle = '#ff1744';
              ctx.fillRect(-nw / 2, -nh / 2, nw, nh);
              ctx.fillStyle = '#fff';
              ctx.fillRect(-nw / 6, -nh / 4, nw / 3, nh / 2);
            }
          }

          ctx.restore();
        });

        ctx.restore();
      });

      renderHitFX(now);

      if (bgmBuffer && curSec > bgmBuffer.duration + 0.8 && !isEnded) {
        isEnded = true;
        showResult();
      }

      requestAnimationFrame(render);
    }

    function showResult() {
      isPlaying = false;
      if (endingBuffer) {
        const endSrc = audioCtx.createBufferSource();
        endSrc.buffer = endingBuffer;
        endSrc.connect(audioCtx.destination);
        endSrc.start(0);
      }

      const processed = perfectCount + goodCount + missCount;
      const totalScore = processed === 0 ? 0 : Math.round(((perfectCount + goodCount * 0.65) / totalNotes) * 1000000);
      const acc = processed === 0 ? 100 : (((perfectCount + goodCount * 0.65) / processed) * 100);

      let rank = "F";
      let rankColor = "#f44336";
      if (totalScore === 1000000) { rank = "φ"; rankColor = "#00e5ff"; }
      else if (totalScore >= 960000) { rank = "V"; rankColor = "#ffd700"; }
      else if (totalScore >= 920000) { rank = "S"; rankColor = "#ffb300"; }
      else if (totalScore >= 880000) { rank = "A"; rankColor = "#4caf50"; }
      else if (totalScore >= 820000) { rank = "B"; rankColor = "#29b6f6"; }
      else if (totalScore >= 700000) { rank = "C"; rankColor = "#ab47bc"; }

      const rankElem = document.getElementById('res-rank');
      rankElem.innerText = rank;
      rankElem.style.color = rankColor;
      rankElem.style.textShadow = `0 0 25px ${rankColor}`;

      document.getElementById('res-title').innerText = songMeta.title;
      document.getElementById('res-score').innerText = totalScore.toString().padStart(7, '0');
      document.getElementById('res-acc').innerText = acc.toFixed(2) + '%';
      document.getElementById('res-combo').innerText = maxCombo;
      document.getElementById('res-perf').innerText = perfectCount;
      document.getElementById('res-good').innerText = goodCount;
      document.getElementById('res-miss').innerText = missCount;

      const p = document.getElementById('result-panel');
      p.style.display = 'flex';
      setTimeout(() => { p.style.opacity = '1'; }, 50);
    }

    startBtn.onclick = () => {
      if (!ASSETS.chartJson) return;
      prepareChart();
      document.getElementById('upload-panel').style.display = 'none';
      isPlaying = true;

      if (bgmBuffer) {
        bgmSource = audioCtx.createBufferSource();
        bgmSource.buffer = bgmBuffer;
        bgmSource.connect(audioCtx.destination);
        startTime = audioCtx.currentTime;
        bgmSource.start(0);
      } else {
        startTime = audioCtx.currentTime;
      }

      requestAnimationFrame(render);
    };
  </script>
</body>
</html>
